<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy Arrow of Time</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #111; overflow: hidden; }
        .box { position: relative; width: 300px; height: 150px; border: 2px solid #666; background: #222; overflow: hidden; cursor: pointer; transition: all 0.5s; }
        
        .particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            transition: top 3s ease-in-out, left 3s ease-in-out, background 2s;
        }

        /* Initial states will be injected by JS */
    </style>
</head>
<body>
    <div class="box" id="box"></div>

    <script>
        const box = document.getElementById('box');
        const particles = [];
        const num = 100;
        
        for (let i = 0; i < num; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            
            // Initial neatly stacked positions
            const isRed = i < num/2;
            const targetColor = isRed ? '#FF6347' : '#4682B4';
            
            // Stack neatly
            const row = Math.floor((i % (num/2)) / 10);
            const col = (i % (num/2)) % 10;
            
            const startX = isRed ? 20 + col * 12 : 170 + col * 12;
            const startY = 30 + row * 12;

            p.style.left = startX + 'px';
            p.style.top = startY + 'px';
            p.style.background = targetColor;

            p.dataset.startX = startX;
            p.dataset.startY = startY;
            p.dataset.origColor = targetColor;

            box.appendChild(p);
            particles.push(p);
        }

        let entropyInterval;
        let clicked = false;

        function mix() {
            particles.forEach(p => {
                const rx = Math.random() * 290;
                const ry = Math.random() * 140;
                p.style.left = rx + 'px';
                p.style.top = ry + 'px';
                p.style.background = '#8A2BE2'; // Purple chaos
            });
        }

        // Start mixing after a short delay
        setTimeout(() => {
            mix();
            entropyInterval = setInterval(mix, 3000);
        }, 500);

        box.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;
            clearInterval(entropyInterval);
            
            // Violate second law: sort perfectly
            particles.forEach(p => {
                p.style.transition = 'all 1s cubic-bezier(0.25, 0.1, 0.25, 1)';
                p.style.left = p.dataset.startX + 'px';
                p.style.top = p.dataset.startY + 'px';
                p.style.background = p.dataset.origColor;
            });

            // Blink out of existence
            setTimeout(() => {
                box.style.transform = 'scale(0)';
                box.style.opacity = '0';
            }, 1500);
        });
    </script>
</body>
</html>
