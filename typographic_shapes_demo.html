<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typographic Geometric Minimalism</title>
<style>
  :root {
    --bg: #000000;
    --card: #0a0a0c;
    --ink: #ffffff;
    --hint: #555555;
    --border: #1a1a1a;
  }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .header-text {
    text-align: center;
    max-width: 600px;
    margin-bottom: 20px;
  }
  h1 { font-weight: 300; letter-spacing: 12px; margin: 0 0 10px 0; text-transform: uppercase; font-size: 24px; }
  p { color: var(--hint); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; margin: 0; }

  .showcase-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    max-width: 1000px;
    width: 100%;
  }
  /* Center the bottom two cards if 5 items in a 3-col grid */
  .card:nth-child(4) { grid-column: 1 / 3; justify-self: right; width: calc(150% - 15px); }
  .card:nth-child(5) { grid-column: 2 / 4; justify-self: left; width: calc(150% - 15px); margin-left: calc(50% + 15px);}

  @media (max-width: 768px) {
    .showcase-grid { grid-template-columns: 1fr; }
    .card:nth-child(4), .card:nth-child(5) { grid-column: 1; justify-self: stretch; width: 100%; margin-left: 0; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    height: 280px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  
  .card-header {
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .card-header span.letter { font-size: 20px; font-weight: 500; }
  .card-header span.sim { font-size: 10px; font-weight: 300; letter-spacing: 3px; color: var(--hint); text-transform: uppercase; }
  
  .reset-btn {
    background: transparent; color: var(--hint); border: none; padding: 5px; cursor: pointer; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
  }
  .reset-btn:hover { color: var(--ink); }

  .interactive-area {
    flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
  }
  .hint { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 9px; color: #333; letter-spacing: 3px; text-transform: uppercase; pointer-events: none; }

  /* =======================================================================
     SVG CORE STYLES
     ======================================================================= */
  .orb-container {
    width: 100px; height: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative;
  }
  svg {
    width: 100%; height: 100%;
    stroke: var(--ink); stroke-width: 1.5px;
    stroke-linecap: round; stroke-linejoin: round; fill: none;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .orb-container:hover svg { stroke-width: 3px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); }

  /* =======================================================================
     1. X (Fluid)
     ======================================================================= */
  .x-svg { animation: x-idle 12s linear infinite; }
  .x-1, .x-2 { transform-origin: 30px 30px; }
  
  .active-x .x-1 { animation: x-fluid-1 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active-x .x-2 { animation: x-fluid-2 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }

  @keyframes x-idle { 100% { transform: rotate(360deg); } }
  @keyframes x-fluid-1 {
    30% { transform: rotate(-45deg); }
    100% { transform: rotate(-45deg) scaleY(2) scaleX(0.1); opacity: 0; filter: blur(4px); }
  }
  @keyframes x-fluid-2 {
    30% { transform: rotate(45deg); }
    100% { transform: rotate(45deg) scaleY(2) scaleX(0.1); opacity: 0; filter: blur(4px); }
  }

  /* =======================================================================
     2. Y (Earth)
     ======================================================================= */
  .y-svg { animation: idle-breathe 6s ease-in-out infinite; }
  .y-1, .y-2 { transform-origin: 30px 30px; }
  
  .active-y .y-1 { animation: y-fold-1 0.3s ease-in forwards; }
  .active-y .y-2 { animation: y-fold-2 0.3s ease-in forwards; }
  .active-y .y-svg { animation: y-drop 0.5s cubic-bezier(0.8, 0, 0.2, 1) 0.2s forwards; }

  @keyframes y-fold-1 { 100% { transform: rotate(-45deg); } }
  @keyframes y-fold-2 { 100% { transform: rotate(45deg); } }
  @keyframes y-drop { 100% { transform: translateY(150px); opacity: 0; } }

  /* =======================================================================
     3. Z (Fire)
     ======================================================================= */
  .z-svg { animation: idle-float 4s ease-in-out infinite; }
  
  .active-z .z-1 { animation: z-snap-1 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active-z .z-2 { animation: z-snap-2 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards; transform-origin: 30px 30px; }
  .active-z .z-3 { animation: z-snap-3 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards; }

  @keyframes z-snap-1 { 20% { transform: translateX(10px); } 100% { transform: translateX(50px); opacity: 0; filter: blur(2px); } }
  @keyframes z-snap-2 { 100% { transform: scaleX(0) rotate(90deg); opacity: 0; } }
  @keyframes z-snap-3 { 20% { transform: translateX(-10px); } 100% { transform: translateX(-50px); opacity: 0; filter: blur(2px); } }

  /* =======================================================================
     4. A (Air)
     ======================================================================= */
  .a-svg { animation: idle-float 5s ease-in-out infinite reverse; }
  .a-1, .a-2 { transform-origin: 30px 15px; }
  .a-3 { transform-origin: 30px 35px; }
  
  .active-a .a-3 { animation: a-cross-fade 0.3s forwards; }
  .active-a .a-1 { animation: a-fold-1 0.4s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active-a .a-2 { animation: a-fold-2 0.4s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active-a .a-svg { animation: a-shoot 0.5s cubic-bezier(0.8, 0, 0.2, 1) 0.3s forwards; }

  @keyframes a-cross-fade { 100% { transform: scaleX(0); opacity: 0; } }
  @keyframes a-fold-1 { 100% { transform: rotate(20deg); } }
  @keyframes a-fold-2 { 100% { transform: rotate(-20deg); } }
  @keyframes a-shoot { 100% { transform: translateY(-150px); opacity: 0; } }

  /* =======================================================================
     5. B (Water)
     ======================================================================= */
  .b-svg { animation: idle-breathe 7s ease-in-out infinite; }
  .b-1 { transform-origin: 22px 30px; }
  
  .active-b .b-1 { animation: b-spine-fade 0.3s forwards; }
  .active-b .b-2 { animation: b-bubble-1 1s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
  .active-b .b-3 { animation: b-bubble-2 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards; }

  @keyframes b-spine-fade { 100% { transform: scaleY(0); opacity: 0; } }
  @keyframes b-bubble-1 { 0% { transform: translateX(0) translateY(0) scale(1); } 100% { transform: translateX(10px) translateY(-50px) scale(1.5); opacity: 0; filter: blur(2px); } }
  @keyframes b-bubble-2 { 0% { transform: translateX(0) translateY(0) scale(1); } 100% { transform: translateX(-10px) translateY(-40px) scale(1.5); opacity: 0; filter: blur(2px); } }


  /* SHARED IDLE KEYFRAMES */
  @keyframes idle-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes idle-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

</style>
</head>
<body>

  <div class="header-text">
    <h1>TYPOGRAPHIC</h1>
    <p>Minimalistic geometric letters mapped to simulations</p>
  </div>

  <div class="showcase-grid">

    <!-- X (Fluid) -->
    <div class="card">
      <div class="card-header">
        <div>
          <span class="letter">X</span><br>
          <span class="sim">Fluid Simulation</span>
        </div>
        <button class="reset-btn" onclick="resetOrb(this, 'active-x')">Reset</button>
      </div>
      <div class="interactive-area">
        <div class="orb-container" onclick="this.classList.add('active-x');">
          <svg class="x-svg" viewBox="0 0 60 60">
            <line class="x-1" x1="15" y1="15" x2="45" y2="45" />
            <line class="x-2" x1="45" y1="15" x2="15" y2="45" />
          </svg>
        </div>
      </div>
      <div class="hint">Interact</div>
    </div>

    <!-- Y (Earth) -->
    <div class="card">
      <div class="card-header">
        <div>
          <span class="letter">Y</span><br>
          <span class="sim">Earth Simulation</span>
        </div>
        <button class="reset-btn" onclick="resetOrb(this, 'active-y')">Reset</button>
      </div>
      <div class="interactive-area">
        <div class="orb-container" onclick="this.classList.add('active-y');">
          <svg class="y-svg" viewBox="0 0 60 60">
            <line class="y-1" x1="15" y1="15" x2="30" y2="30" />
            <line class="y-2" x1="45" y1="15" x2="30" y2="30" />
            <line class="y-3" x1="30" y1="30" x2="30" y2="50" />
          </svg>
        </div>
      </div>
      <div class="hint">Interact</div>
    </div>

    <!-- Z (Fire) -->
    <div class="card">
      <div class="card-header">
        <div>
          <span class="letter">Z</span><br>
          <span class="sim">Fire Simulation</span>
        </div>
        <button class="reset-btn" onclick="resetOrb(this, 'active-z')">Reset</button>
      </div>
      <div class="interactive-area">
        <div class="orb-container" onclick="this.classList.add('active-z');">
          <svg class="z-svg" viewBox="0 0 60 60">
            <line class="z-1" x1="15" y1="15" x2="45" y2="15" />
            <line class="z-2" x1="45" y1="15" x2="15" y2="45" />
            <line class="z-3" x1="15" y1="45" x2="45" y2="45" />
          </svg>
        </div>
      </div>
      <div class="hint">Interact</div>
    </div>

    <!-- A (Air) -->
    <div class="card">
      <div class="card-header">
        <div>
          <span class="letter">A</span><br>
          <span class="sim">Air Simulation</span>
        </div>
        <button class="reset-btn" onclick="resetOrb(this, 'active-a')">Reset</button>
      </div>
      <div class="interactive-area">
        <div class="orb-container" onclick="this.classList.add('active-a');">
          <svg class="a-svg" viewBox="0 0 60 60">
            <line class="a-1" x1="30" y1="15" x2="15" y2="50" />
            <line class="a-2" x1="30" y1="15" x2="45" y2="50" />
            <line class="a-3" x1="21.5" y1="35" x2="38.5" y2="35" />
          </svg>
        </div>
      </div>
      <div class="hint">Interact</div>
    </div>

    <!-- B (Water) -->
    <div class="card">
      <div class="card-header">
        <div>
          <span class="letter">B</span><br>
          <span class="sim">Water Simulation</span>
        </div>
        <button class="reset-btn" onclick="resetOrb(this, 'active-b')">Reset</button>
      </div>
      <div class="interactive-area">
        <div class="orb-container" onclick="this.classList.add('active-b');">
          <svg class="b-svg" viewBox="0 0 60 60">
            <line class="b-1" x1="22" y1="12" x2="22" y2="48" />
            <path class="b-2" d="M 22 12 C 40 12, 40 30, 22 30" />
            <path class="b-3" d="M 22 30 C 42 30, 42 48, 22 48" />
          </svg>
        </div>
      </div>
      <div class="hint">Interact</div>
    </div>

  </div>

  <script>
    function resetOrb(btn, activeClass) {
      const card = btn.closest('.card');
      const orb = card.querySelector('.orb-container');
      orb.classList.remove(activeClass);
      // Force DOM reflow to reset animations immediately
      void orb.offsetWidth;
    }
  </script>
</body>
</html>
