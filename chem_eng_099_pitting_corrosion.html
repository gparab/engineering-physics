<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitting Corrosion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 40px;
            height: 20px;
            cursor: pointer;
        }

        .metal-left {
            position: absolute;
            left: 0;
            top: 5px;
            width: 18px;
            height: 10px;
            background-color: #555;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            transform-origin: bottom left;
        }

        .metal-right {
            position: absolute;
            right: 0;
            top: 5px;
            width: 18px;
            height: 10px;
            background-color: #555;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            transform-origin: bottom right;
        }

        .pit-bg {
            position: absolute;
            left: 16px;
            top: 5px;
            width: 8px;
            height: 10px;
            background-color: #121212;
            border-radius: 0 0 4px 4px;
        }

        .pit-rust {
            position: absolute;
            left: 17px;
            top: 5px;
            width: 6px;
            height: 2px;
            background-color: #A0522D;
            border-radius: 0 0 3px 3px;
        }

        .rust-ion {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #A0522D;
            border-radius: 50%;
            left: 19px;
            top: 4px;
            opacity: 0;
        }
        
        .crack {
            position: absolute;
            left: 19px;
            top: 10px;
            width: 2px;
            height: 0px;
            background-color: #121212;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <div class="metal-left" id="m-left"></div>
        <div class="metal-right" id="m-right"></div>
        <div class="pit-bg"></div>
        <div class="pit-rust" id="rust"></div>
        <div class="crack" id="crack"></div>
    </div>

    <script>
        const container = document.getElementById('model-container');
        const rust = document.getElementById('rust');
        const mLeft = document.getElementById('m-left');
        const mRight = document.getElementById('m-right');
        const crack = document.getElementById('crack');

        // Idle Animation
        const rustTL = gsap.timeline({ repeat: -1, yoyo: true });
        rustTL.to(rust, { height: 6, duration: 2, ease: "sine.inOut" });

        function createIon() {
            let ion = document.createElement('div');
            ion.className = 'rust-ion';
            container.appendChild(ion);
            
            gsap.to(ion, {
                y: -15 - Math.random() * 10,
                x: (Math.random() - 0.5) * 15,
                opacity: 1,
                duration: 0.5,
                ease: "power1.out",
                onComplete: () => {
                    gsap.to(ion, {
                        opacity: 0,
                        duration: 0.5,
                        onComplete: () => ion.remove()
                    });
                }
            });
        }
        
        let ionInterval = setInterval(createIon, 600);

        // Click Animation
        container.addEventListener('click', () => {
            clearInterval(ionInterval);
            rustTL.kill();
            
            const clickTL = gsap.timeline();
            
            // Fracture
            clickTL.to(crack, { height: 5, duration: 0.1, ease: "power4.in" })
                   .to(mLeft, { rotation: -45, y: 30, opacity: 0, duration: 0.6, ease: "power2.in" }, "+=0.1")
                   .to(mRight, { rotation: 45, y: 30, opacity: 0, duration: 0.6, ease: "power2.in" }, "<")
                   .to(rust, { y: 30, opacity: 0, duration: 0.6, ease: "power2.in" }, "<")
                   .to('.rust-ion', { opacity: 0, duration: 0.2 }, "<")
                   .to(container, { display: 'none', duration: 0 });
        });
    </script>
</body>
</html>
