<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
  #container { position: relative; width: 60px; height: 40px; cursor: pointer; }
  .lead { position: absolute; height: 2px; background: #C0392B; top: 19px; }
  #in { width: 15px; left: 0; }
  #out { width: 15px; left: 45px; }
  #triangle { position: absolute; left: 15px; top: 10px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 20px solid #C0392B; }
  #bubble { position: absolute; left: 35px; top: 17px; width: 6px; height: 6px; border: 2px solid #C0392B; border-radius: 50%; box-sizing: border-box; background: #0f172a; }
  #val-in { position: absolute; left: 0; top: 0; color: #fff; font-size: 10px; font-family: monospace; }
  #val-out { position: absolute; right: 0; top: 0; color: #fff; font-size: 10px; font-family: monospace; }
</style>
</head>
<body>
<div id="container">
  <div class="lead" id="in"></div>
  <div class="lead" id="out"></div>
  <div id="triangle"></div>
  <div id="bubble"></div>
  <div id="val-in">1</div>
  <div id="val-out">0</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  let state = 1;
  const valIn = document.getElementById('val-in');
  const valOut = document.getElementById('val-out');
  
  let interval = setInterval(() => {
    state = 1 - state;
    valIn.innerText = state;
    valOut.innerText = 1 - state;
    gsap.fromTo('#triangle', { opacity: 0.5 }, { opacity: 1, duration: 0.2 });
  }, 1000);

  let clicked = false;
  container.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    clearInterval(interval);
    
    valIn.innerText = 'X';
    valOut.innerText = 'X';
    valIn.style.color = '#C0392B';
    valOut.style.color = '#C0392B';
    
    // Oscillation and Disintegration
    gsap.to('#container', {
      x: 'random(-10, 10)',
      y: 'random(-10, 10)',
      duration: 0.05,
      repeat: 20,
      yoyo: true,
      onComplete: () => {
        gsap.to('#container', { opacity: 0, scale: 2, duration: 0.5 });
        for(let i=0; i<20; i++) {
          let ring = document.createElement('div');
          ring.style.position = 'absolute';
          ring.style.width = '10px';
          ring.style.height = '10px';
          ring.style.border = '1px solid #C0392B';
          ring.style.borderRadius = '50%';
          ring.style.left = '25px';
          ring.style.top = '15px';
          container.appendChild(ring);
          gsap.to(ring, {
            scale: gsap.utils.random(5, 15),
            opacity: 0,
            duration: gsap.utils.random(1, 2),
            ease: 'power2.out'
          });
        }
      }
    });
  });
</script>
</body>
</html>
