<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
  #container { position: relative; width: 60px; height: 40px; cursor: pointer; }
  .lead { position: absolute; height: 2px; background: #8E44AD; }
  #in1 { width: 14px; top: 10px; left: 0; }
  #in2 { width: 14px; top: 30px; left: 0; }
  #out { width: 15px; top: 20px; left: 45px; }
  .gate-body { position: absolute; left: 18px; top: 0; width: 27px; height: 40px; }
  .gate-body svg { width: 100%; height: 100%; overflow: visible; }
  .curve { position: absolute; left: 14px; top: 0; width: 6px; height: 40px; }
  .curve svg { width: 100%; height: 100%; overflow: visible; }
  .pulse { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; opacity: 0; box-shadow: 0 0 5px #8E44AD; }
</style>
</head>
<body>
<div id="container">
  <div class="lead" id="in1"></div>
  <div class="lead" id="in2"></div>
  <div class="lead" id="out"></div>
  <div class="curve">
    <svg viewBox="0 0 6 40">
      <path d="M 0,0 C 6,10 6,30 0,40" fill="none" stroke="#8E44AD" stroke-width="2"/>
    </svg>
  </div>
  <div class="gate-body">
    <svg viewBox="0 0 27 40">
      <path d="M 0,0 C 8,0 27,20 27,20 C 27,20 8,40 0,40 C 6,30 6,10 0,0 Z" fill="none" stroke="#8E44AD" stroke-width="2"/>
    </svg>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  
  let p1 = document.createElement('div'); p1.className = 'pulse'; p1.style.top = '8px'; container.appendChild(p1);
  let p3 = document.createElement('div'); p3.className = 'pulse'; p3.style.top = '18px'; container.appendChild(p3);
  
  let tl = gsap.timeline({ repeat: -1 });
  tl.fromTo(p1, { x: 0, opacity: 1 }, { x: 12, duration: 0.5, ease: 'none' })
    .to(p1, { opacity: 0, duration: 0.1 })
    .fromTo(p3, { x: 45, opacity: 1 }, { x: 60, opacity: 0, duration: 0.5, ease: 'none' }, "-=0.1");

  let clicked = false;
  container.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    tl.kill();
    gsap.to('.pulse', { opacity: 0, duration: 0.1 });
    
    // Both inputs high - short circuit explosion
    gsap.to(['#in1', '#in2'], { backgroundColor: '#fff', duration: 0.2 });
    gsap.to('.curve path, .gate-body path', { stroke: '#fff', duration: 0.2, yoyo: true, repeat: 3 });
    
    setTimeout(() => {
      gsap.to('#container > div:not(.pulse)', { opacity: 0, duration: 0.1 });
      for(let i=0; i<40; i++) {
        let bit = document.createElement('div');
        bit.innerText = Math.random() > 0.5 ? '1' : '0';
        bit.style.position = 'absolute';
        bit.style.color = '#8E44AD';
        bit.style.fontSize = '14px';
        bit.style.fontWeight = 'bold';
        bit.style.left = '30px';
        bit.style.top = '20px';
        container.appendChild(bit);
        
        gsap.to(bit, {
          x: gsap.utils.random(-400, 400),
          y: gsap.utils.random(-400, 400),
          rotation: gsap.utils.random(-720, 720),
          opacity: 0,
          scale: gsap.utils.random(0.5, 2),
          duration: gsap.utils.random(1, 2),
          ease: 'expo.out'
        });
      }
    }, 600);
  });
</script>
</body>
</html>
