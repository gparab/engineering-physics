<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB Via & Trace</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0d0d0d; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #canvas-container { width: 400px; height: 400px; cursor: pointer; position: relative; }
        canvas { display: block; outline: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(3, 3, 4);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(400, 400);
        container.appendChild(renderer.domElement);

        const pcbMaterial = new THREE.MeshLambertMaterial({ color: 0x114411, transparent: true, opacity: 0.8 });
        const pcbGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const pcb1 = new THREE.Mesh(pcbGeo, pcbMaterial);
        pcb1.position.y = 0.5;
        scene.add(pcb1);

        const pcb2 = new THREE.Mesh(pcbGeo, pcbMaterial);
        pcb2.position.y = -0.5;
        scene.add(pcb2);

        const traceMaterial = new THREE.MeshBasicMaterial({ color: 0x27AE60 });
        const trace1Geo = new THREE.PlaneGeometry(2, 0.2);
        const trace1 = new THREE.Mesh(trace1Geo, traceMaterial);
        trace1.rotation.x = -Math.PI / 2;
        trace1.position.set(-1, 0.56, 0);
        scene.add(trace1);

        const trace2Geo = new THREE.PlaneGeometry(2, 0.2);
        const trace2 = new THREE.Mesh(trace2Geo, traceMaterial);
        trace2.rotation.x = -Math.PI / 2;
        trace2.rotation.z = Math.PI / 2;
        trace2.position.set(0, -0.44, 1);
        scene.add(trace2);

        // Via hole
        const viaGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
        const viaMaterial = new THREE.MeshBasicMaterial({ color: 0x27AE60, side: THREE.DoubleSide });
        const via = new THREE.Mesh(viaGeo, viaMaterial);
        scene.add(via);

        // Current particle
        const particleGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const particle = new THREE.Mesh(particleGeo, particleMaterial);
        scene.add(particle);

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(2, 5, 3);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        let time = 0;
        let isDestroyed = false;
        let particles = [];

        function animate() {
            requestAnimationFrame(animate);
            if (!isDestroyed) {
                time += 0.02;
                let t = time % 3;
                if (t < 1) {
                    particle.position.set(-2 + t * 2, 0.6, 0);
                } else if (t < 2) {
                    let vt = t - 1;
                    particle.position.set(Math.cos(vt * Math.PI * 4) * 0.1, 0.5 - vt, Math.sin(vt * Math.PI * 4) * 0.1);
                } else {
                    let lt = t - 2;
                    particle.position.set(0, -0.4, lt * 2);
                }
            } else {
                particle.visible = false;
                particles.forEach(p => {
                    p.mesh.position.add(p.velocity);
                    p.mesh.scale.multiplyScalar(0.95);
                });
            }
            renderer.render(scene, camera);
        }
        animate();

        container.addEventListener('click', () => {
            if (isDestroyed) return;
            isDestroyed = true;
            
            // Volcano explosion
            scene.remove(via);
            
            const explosionColors = [0xff4500, 0xffa500, 0x27ae60, 0x555555];
            for (let i = 0; i < 50; i++) {
                const pGeo = new THREE.SphereGeometry(Math.random() * 0.1, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({ color: explosionColors[Math.floor(Math.random() * explosionColors.length)] });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(0, 0.5, 0);
                scene.add(p);
                particles.push({
                    mesh: p,
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 0.2, Math.random() * 0.2 + 0.1, (Math.random() - 0.5) * 0.2)
                });
            }
            
            gsap.to(container, {
                opacity: 0,
                duration: 2,
                delay: 1,
                ease: 'power2.in'
            });
        });
    </script>
</body>
</html>
