<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PID Controller</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0a0f0d;
    overflow: hidden;
    cursor: pointer;
  }
  .container {
    width: 36px;
    height: 24px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .signal {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container">
  <svg viewBox="0 0 36 24" id="icon">
    <g stroke="#2E8B57" stroke-width="1" fill="none">
      <!-- Input line -->
      <line x1="0" y1="12" x2="6" y2="12" />
      <!-- Split -->
      <path d="M 6 12 L 6 4 L 10 4 M 6 12 L 10 12 M 6 12 L 6 20 L 10 20" />
      <!-- P, I, D Blocks -->
      <rect x="10" y="2" width="6" height="4" />
      <rect x="10" y="10" width="6" height="4" />
      <rect x="10" y="18" width="6" height="4" />
      <!-- Summing -->
      <path d="M 16 4 L 20 4 L 20 12 M 16 12 L 20 12 M 16 20 L 20 20 L 20 12" />
      <circle cx="22" cy="12" r="2" />
      <!-- Plant -->
      <line x1="24" y1="12" x2="28" y2="12" />
      <rect x="28" y="9" width="6" height="6" />
      <line x1="34" y1="12" x2="38" y2="12" />
      <!-- Feedback -->
      <path d="M 36 12 L 36 24 L 4 24 L 4 12" stroke-dasharray="1 1"/>
    </g>

    <!-- Signal Animation Wave -->
    <path id="wave" d="M 0 12 C 6 2, 6 22, 12 12 S 18 6, 24 12 S 30 11, 36 12" stroke="#4fff99" stroke-width="0.8" fill="none" opacity="0.8"/>
  </svg>
</div>

<script>
  // Idle Animation: A signal wave travels the loop, dynamically flattening out as it reaches the end.
  const wave = document.getElementById('wave');
  
  const tl = gsap.timeline({ repeat: -1 });
  tl.fromTo(wave, { strokeDasharray: "15 50", strokeDashoffset: 65 }, {
    strokeDashoffset: 0,
    duration: 2,
    ease: "linear"
  });
  
  // Subtle flattening of the wave end
  gsap.to(wave, {
    attr: { d: "M 0 12 C 6 2, 6 22, 12 12 S 18 10, 24 12 S 30 12, 36 12" },
    duration: 1,
    yoyo: true,
    repeat: -1,
    ease: "sine.inOut"
  });

  // Click Disappearance Motion: The error signal wildly overshoots, causing the loop to oscillate infinitely and vibrate apart into static.
  document.body.addEventListener('click', () => {
    tl.kill();
    gsap.killTweensOf(wave);
    
    const clickTl = gsap.timeline();
    
    // Wild overshoot
    clickTl.to(wave, {
      attr: { d: "M 0 12 C 6 -30, 6 54, 12 12 S 18 -10, 24 12 S 30 -5, 36 12" },
      stroke: "#ff3333",
      duration: 0.2,
      ease: "power2.in"
    })
    // Oscillation and vibration
    .to("#icon", {
      x: () => (Math.random() - 0.5) * 50,
      y: () => (Math.random() - 0.5) * 50,
      scale: 2,
      rotation: () => (Math.random() - 0.5) * 20,
      duration: 0.05,
      repeat: 10,
      yoyo: true,
      ease: "rough({ template: none.out, strength: 2, points: 20, taper: none, randomize: true, clamp: false })"
    })
    // Vibrate apart into static
    .to("#icon", {
      scale: 10,
      opacity: 0,
      duration: 0.3,
      ease: "expo.in"
    })
    .to("body", {
      backgroundColor: "#fff",
      duration: 0.05,
      yoyo: true,
      repeat: 1
    }, "-=0.2");
  }, { once: true });
</script>
</body>
</html>
