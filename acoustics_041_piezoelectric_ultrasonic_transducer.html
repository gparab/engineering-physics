<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piezoelectric Ultrasonic Transducer</title>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f1f2f6;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 40px;
        height: 50px;
        cursor: pointer;
    }
    .transducer {
        position: absolute;
        top: 0;
        left: 10px;
        width: 20px;
        height: 15px;
        background-color: #34495e; /* backing */
        border-bottom: 3px solid #f39c12; /* piezoceramic */
    }
    .flaw {
        position: absolute;
        bottom: 5px;
        left: 19px;
        width: 2px;
        height: 2px;
        background-color: #c0392b;
        border-radius: 50%;
    }
    .pulse {
        position: absolute;
        left: 10px;
        width: 20px;
        height: 2px;
        background-color: #f39c12;
        opacity: 0;
    }
    
    .beam {
        position: absolute;
        top: 50vh;
        left: 50vw;
        width: 2px;
        height: 150vh;
        background: linear-gradient(rgba(243,156,18,0), rgba(243,156,18,0.8), rgba(243,156,18,0));
        transform-origin: top center;
        opacity: 0;
        display: none;
        pointer-events: none;
    }
    .hidden-crack {
        position: absolute;
        top: 60vh;
        left: 30vw;
        width: 150px;
        height: 5px;
        background-color: #2c3e50;
        transform: rotate(-15deg);
        opacity: 0;
        display: none;
    }
</style>
</head>
<body>

<div class="beam" id="beam"></div>
<div class="hidden-crack" id="hiddenCrack"></div>

<div id="container">
    <div class="transducer" id="transducer"></div>
    <div class="flaw"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const container = document.getElementById('container');
    const transducer = document.getElementById('transducer');
    
    let isIdle = true;

    function sendPulse() {
        if (!isIdle) return;
        
        // Ring
        gsap.to(transducer, {
            y: -1,
            duration: 0.05,
            yoyo: true,
            repeat: 3
        });

        const pulse = document.createElement('div');
        pulse.classList.add('pulse');
        pulse.style.top = '18px';
        container.appendChild(pulse);
        
        // Go down
        gsap.to(pulse, {
            top: 40,
            opacity: 1,
            duration: 0.4,
            ease: "none",
            onComplete: () => {
                // Echo returns
                gsap.to(pulse, {
                    top: 18,
                    opacity: 0.5,
                    duration: 0.4,
                    ease: "none",
                    onComplete: () => pulse.remove()
                });
            }
        });
        
        setTimeout(sendPulse, 2000);
    }
    sendPulse();

    let clicked = false;
    container.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        isIdle = false;
        
        container.style.display = 'none';
        
        const beam = document.getElementById('beam');
        const crack = document.getElementById('hiddenCrack');
        
        beam.style.display = 'block';
        crack.style.display = 'block';

        // Phased array sweep
        gsap.set(beam, { rotation: -60, opacity: 1 });
        
        gsap.to(beam, {
            rotation: 60,
            duration: 2.5,
            ease: "sine.inOut",
            onUpdate: function() {
                // Reveal crack when beam passes over -15 deg area
                const rot = gsap.getProperty(beam, "rotation");
                if (rot > -25 && rot < -5) {
                    gsap.to(crack, {opacity: 1, duration: 0.2});
                }
            },
            onComplete: () => {
                gsap.to(beam, {opacity: 0, duration: 0.5});
            }
        });
    });
</script>
</body>
</html>
