<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrodynamic Journal Bearing</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let sparks = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const outerR = 18;
    const innerR = 12;
    let shaftOffset = {x: 3, y: 3};
    let shaftAngle = 0;
    const color = '#F39C12';

    class Spark {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 20 + 5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.size = Math.random() * 2 + 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(243, 156, 18, ${this.life})`;
            ctx.fill();
        }
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        // Move shaft to hit wall
        shaftOffset = {x: outerR - innerR, y: 0};
        
        // spawn sparks
        let hitX = cx + outerR;
        let hitY = cy;
        for(let i=0; i<150; i++) {
            sparks.push(new Spark(hitX, hitY));
        }
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);

        shaftAngle += 0.15;

        // Draw outer ring
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, 0, Math.PI*2);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        let sx = cx + shaftOffset.x;
        let sy = cy + shaftOffset.y;

        // Draw shaft
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(shaftAngle);
        ctx.beginPath();
        ctx.arc(0, 0, innerR, 0, Math.PI*2);
        ctx.moveTo(0, 0);
        ctx.lineTo(innerR, 0); // show rotation
        ctx.strokeStyle = color;
        ctx.stroke();
        ctx.restore();

        if (!clicked) {
            // Draw fluid dots
            ctx.fillStyle = 'rgba(243, 156, 18, 0.4)';
            for(let i=0; i<8; i++) {
                let a = shaftAngle + i * Math.PI/4;
                let r = innerR + (outerR - innerR)/2 + Math.cos(a)*2; // roughly between
                ctx.beginPath();
                ctx.arc(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 1, 0, Math.PI*2);
                ctx.fill();
            }
        } else {
            sparks.forEach((s, i) => {
                s.update();
                s.draw(ctx);
                if(s.life <= 0) sparks.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
