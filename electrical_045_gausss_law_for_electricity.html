<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauss's Law for Electricity</title>
<style>
  body { margin: 0; padding: 0; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  #container { position: relative; width: 40px; height: 40px; cursor: pointer; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .charge { fill: #E67E22; }
  .vector { fill: none; stroke: #E67E22; stroke-width: 1.5; stroke-linecap: round; }
  .plus { fill: none; stroke: #fff; stroke-width: 1; stroke-linecap: round; }
</style>
</head>
<body>
<div id="container">
  <svg viewBox="0 0 40 40" id="gauss-svg">
    <!-- Vectors -->
    <g id="vectors">
      <line class="vector" x1="20" y1="20" x2="20" y2="4" />
      <line class="vector" x1="20" y1="20" x2="20" y2="36" />
      <line class="vector" x1="20" y1="20" x2="4" y2="20" />
      <line class="vector" x1="20" y1="20" x2="36" y2="20" />
      <line class="vector" x1="20" y1="20" x2="9" y2="9" />
      <line class="vector" x1="20" y1="20" x2="31" y2="31" />
      <line class="vector" x1="20" y1="20" x2="31" y2="9" />
      <line class="vector" x1="20" y1="20" x2="9" y2="31" />
    </g>
    <!-- Central Charge -->
    <circle class="charge" cx="20" cy="20" r="6" id="core-charge" />
    <path class="plus" d="M18,20 L22,20 M20,18 L20,22" id="plus-sign" />
  </svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  
  // Idle: Vectors pulse representing constant electric flux
  gsap.to('.vector', {
    strokeWidth: 2.5,
    opacity: 0.6,
    duration: 1,
    yoyo: true,
    repeat: -1,
    ease: "sine.inOut"
  });

  container.addEventListener('click', () => {
    gsap.killTweensOf('.vector');
    
    // Vectors stretch to infinity; central charge dissolves as field collapses
    // We will scale up the vectors group immensely
    gsap.to('#vectors', {
      scale: 50,
      transformOrigin: "50% 50%",
      opacity: 0,
      duration: 1.5,
      ease: "power3.in"
    });
    
    // Central charge dissolves
    gsap.to(['#core-charge', '#plus-sign'], {
      scale: 0,
      transformOrigin: "50% 50%",
      opacity: 0,
      duration: 0.4,
      ease: "back.in(2)"
    });
  });
</script>
</body>
</html>
