<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #fcfcfc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .container { position: relative; width: 50px; height: 50px; cursor: pointer; }
  .axes { position: absolute; width: 100%; height: 100%; border-bottom: 2px solid #333; border-left: 2px solid #333; box-sizing: border-box; }
  svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  path { fill: none; stroke: #16A085; stroke-width: 2; }
  .marker { position: absolute; width: 6px; height: 6px; background: #16A085; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px #16A085; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
</head>
<body>
<div class="container" id="model">
  <div class="axes"></div>
  <svg viewBox="0 0 50 50">
    <path id="curve" d="M 5,45 Q 15,10 45,5" />
  </svg>
  <div class="marker" id="marker"></div>
</div>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  const model = document.getElementById('model');
  const curve = document.getElementById('curve');
  
  let idleTween = gsap.to("#marker", {
    duration: 2,
    repeat: -1,
    yoyo: true,
    ease: "power1.inOut",
    motionPath: {
      path: "#curve",
      align: "#curve",
      alignOrigin: [0.5, 0.5]
    }
  });

  model.addEventListener('click', () => {
    idleTween.kill();
    
    gsap.to(curve, {
      attr: { d: "M 5,45 Q 25,45 45,45" },
      duration: 0.6,
      ease: "power3.in"
    });
    gsap.to("#marker", {
      y: 45,
      duration: 0.6,
      ease: "power3.in"
    });
    
    setTimeout(() => {
      const wipe = document.createElement('div');
      wipe.style.position = 'absolute';
      wipe.style.left = '50%';
      wipe.style.top = '50%';
      wipe.style.width = '100vw';
      wipe.style.height = '4px';
      wipe.style.background = '#16A085';
      wipe.style.transform = 'translate(-50%, -50%) scaleX(0)';
      document.body.appendChild(wipe);
      
      gsap.to(wipe, {
        scaleX: 2,
        height: '100vh',
        duration: 0.7,
        ease: "power4.inOut",
        onComplete: () => {
          document.body.style.background = '#16A085';
          model.style.display = 'none';
        }
      });
    }, 700);
  });
</script>
</body>
</html>
