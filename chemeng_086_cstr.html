<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSTR</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; cursor: pointer; overflow: hidden; }
        #container { width: 40px; height: 50px; position: relative; }
        .tank { position: absolute; width: 40px; height: 50px; border: 2px solid #555; border-radius: 4px; box-sizing: border-box; overflow: hidden; background: rgba(0, 206, 209, 0.1); }
        .fluid { position: absolute; bottom: 0; width: 100%; height: 70%; background: linear-gradient(180deg, rgba(0, 206, 209, 0.4), rgba(0, 206, 209, 0.8)); transform-origin: center bottom; }
        .impeller-shaft { position: absolute; top: 0; left: 18px; width: 2px; height: 35px; background: #aaa; }
        .impeller-blade { position: absolute; top: 32px; left: 10px; width: 20px; height: 4px; background: #ddd; border-radius: 2px; transform-origin: center; }
        .vortex { position: absolute; bottom: 10px; left: 10px; width: 20px; height: 20px; border: 1px solid rgba(0, 206, 209, 0.6); border-radius: 50%; border-top-color: transparent; border-bottom-color: transparent; }
    </style>
</head>
<body>
    <div id="container">
        <div class="tank">
            <div class="fluid" id="fluid"></div>
            <div class="vortex" id="vortex1"></div>
            <div class="vortex" id="vortex2" style="width: 14px; height: 14px; left: 13px; bottom: 13px;"></div>
        </div>
        <div class="impeller-shaft"></div>
        <div class="impeller-blade" id="blade"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const blade = document.getElementById('blade');
        const vortex1 = document.getElementById('vortex1');
        const vortex2 = document.getElementById('vortex2');
        const fluid = document.getElementById('fluid');
        const container = document.getElementById('container');

        gsap.to(blade, { rotationY: 360, duration: 0.5, repeat: -1, ease: "none" });
        gsap.to([vortex1, vortex2], { rotationY: 360, duration: 1, repeat: -1, ease: "none", transformOrigin: "50% 50%" });
        gsap.to(vortex1, { scale: 1.1, duration: 0.5, yoyo: true, repeat: -1, ease: "sine.inOut" });
        gsap.to(vortex2, { scale: 1.1, duration: 0.5, yoyo: true, repeat: -1, ease: "sine.inOut", delay: 0.25 });

        let clicked = false;
        document.body.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;

            gsap.killTweensOf([blade, vortex1, vortex2, fluid]);
            
            // Mix to uniform color
            gsap.to(fluid, { background: "rgba(0, 206, 209, 1)", duration: 0.3 });
            
            // Spin incredibly fast and drain
            gsap.to(blade, { rotationY: 1440, duration: 1, ease: "power2.in" });
            gsap.to([vortex1, vortex2], { rotationY: 1440, scale: 0.1, duration: 1, ease: "power2.in" });
            
            gsap.to(fluid, { scaleY: 0, duration: 0.6, delay: 0.4, ease: "power2.in" });
            
            // Container spirals away
            gsap.to(container, {
                rotation: 720,
                scale: 0,
                y: 500,
                opacity: 0,
                duration: 1,
                delay: 0.5,
                ease: "power3.in"
            });
        });
    </script>
</body>
</html>
