<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Innovative Abstracts</title>
<style>
  :root {
    --bg: #000000;
    --card: #040405;
    --ink: #ffffff;
    --hint: #444444;
    --border: rgba(255,255,255,0.03);
    
    /* Subtle Elemental Tints */
    --c-fluid: #a5f3fc;
    --c-earth: #a7f3d0;
    --c-fire: #fed7aa;
    --c-air: #f1f5f9;
    --c-water: #bfdbfe;
  }
  body {
    background-color: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 40px;
  }
  .header-text { text-align: center; max-width: 600px; margin-bottom: 10px; }
  h1 { font-weight: 300; letter-spacing: 10px; margin: 0 0 10px 0; text-transform: uppercase; font-size: 16px; color: #fff; }
  p { color: var(--hint); font-size: 10px; letter-spacing: 4px; text-transform: uppercase; margin: 0; line-height: 1.5; }

  .showcase-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
    max-width: 1200px; width: 100%;
  }
  @media (max-width: 900px) {
    .showcase-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .showcase-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 4px;
    height: 200px; display: flex; flex-direction: column; position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: border-color 0.4s;
  }
  .card:hover { border-color: rgba(255,255,255,0.1); }
  
  .card-header { padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
  .card-header span.title { font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #888; }
  
  .reset-btn { background: transparent; color: #333; border: none; padding: 0; cursor: pointer; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
  .reset-btn:hover { color: var(--ink); }

  .interactive-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

  /* =======================================================================
     SVG CORE STYLES (Micro Scale)
     ======================================================================= */
  .micro-container { width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
  svg {
    width: 100%; height: 100%;
    stroke: var(--ink); stroke-width: 0.75px;
    stroke-linecap: round; stroke-linejoin: round; fill: none; overflow: visible;
  }

  /* =======================================================================
     1. FLUID: The Capillary
     ======================================================================= */
  .f-line { transform-origin: 20px 20px; transform: scaleY(0); transition: 0.1s; }
  .f-base { stroke-width: 0.75px; }
  .f-dew { fill: var(--ink); opacity: 0; transform: scale(0); transform-origin: 20px 20px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

  .micro-container:hover .f-dew { opacity: 1; transform: scale(1); fill: var(--c-fluid); }
  .micro-container:hover .f-line { stroke: transparent; } /* hide straight base line */
  .micro-container:hover .f-base { stroke: var(--c-fluid); }

  .active-fluid { pointer-events: none; }
  .active-fluid .f-dew { animation: dew-drop 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active-fluid .f-line { animation: thread-snap 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

  @keyframes dew-drop {
    20% { transform: scale(1.2, 0.8) translateY(1px); opacity: 1; }
    100% { transform: scale(0.5, 1.5) translateY(15px); opacity: 0; }
  }
  @keyframes thread-snap {
    0% { transform: scaleY(0); stroke: var(--c-fluid); }
    20% { transform: scaleY(1); stroke: var(--c-fluid); }
    40% { transform: scaleY(-0.5); stroke: var(--ink); }
    100% { transform: scaleY(0); stroke: var(--ink); }
  }

  /* =======================================================================
     2. EARTH: The Fault
     ======================================================================= */
  .e-dot { fill: var(--ink); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .e-fissure { stroke: var(--c-earth); stroke-width: 0.5px; stroke-dasharray: 10; stroke-dashoffset: 10; opacity: 0; }

  .micro-container:hover .e-left { transform: translateX(-1px); fill: var(--c-earth); }
  .micro-container:hover .e-right { transform: translateX(1px); fill: var(--c-earth); }

  .active-earth { pointer-events: none; }
  .active-earth .e-left { animation: fault-left 0.8s cubic-bezier(0.9, 0, 0.1, 1) forwards; }
  .active-earth .e-right { animation: fault-right 0.8s cubic-bezier(0.9, 0, 0.1, 1) forwards; }
  .active-earth .e-fissure { animation: fault-crack 0.8s ease-out forwards; }

  @keyframes fault-left { 100% { transform: translateX(-6px); opacity: 0; } }
  @keyframes fault-right { 100% { transform: translateX(6px); opacity: 0; } }
  @keyframes fault-crack {
    20% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; filter: blur(1px); }
  }

  /* =======================================================================
     3. FIRE: The Ignition
     ======================================================================= */
  .z-line { stroke-dasharray: 12; stroke-dashoffset: 0; transition: filter 0.3s; }
  .z-spark { fill: var(--c-fire); opacity: 0; filter: drop-shadow(0 0 2px var(--c-fire)); }

  .micro-container:hover .z-line { filter: drop-shadow(0 -2px 2px var(--c-fire)); stroke: #ffd; }
  
  .active-fire { pointer-events: none; }
  .active-fire .z-line { animation: line-burn 0.5s linear forwards; }
  .active-fire .z-spark { animation: spark-travel 0.5s linear forwards; }

  @keyframes line-burn { 100% { stroke-dashoffset: -12; stroke: var(--c-fire); } }
  @keyframes spark-travel {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    90% { opacity: 1; transform: translateY(12px) scale(1.5); }
    100% { opacity: 0; transform: translateY(15px) scale(3); filter: blur(2px); }
  }

  /* =======================================================================
     4. AIR: The Updraft
     ======================================================================= */
  .a-group { transform-origin: 20px 20px; transition: 0.3s; }
  .a-dot { fill: var(--ink); transition: fill 0.3s; }
  
  .micro-container:hover .a-group { animation: updraft-idle 2s linear infinite; }
  .micro-container:hover .a-dot { fill: var(--c-air); }

  .active-air { pointer-events: none; }
  .active-air .a-group { animation: updraft-shoot 0.8s cubic-bezier(0.5, 0, 0.2, 1) forwards; }

  @keyframes updraft-idle { 100% { transform: rotate(360deg); } }
  @keyframes updraft-shoot {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    20% { transform: translateY(2px) rotate(-90deg) scale(0.8); }
    100% { transform: translateY(-30px) rotate(720deg) scale(0.1); opacity: 0; }
  }

  /* =======================================================================
     5. WATER: The Sonar
     ======================================================================= */
  .w-core { transition: 0.3s; transform-origin: 20px 20px; }
  .w-ring { stroke: var(--c-water); stroke-width: 0.5px; opacity: 0; transform-origin: 20px 20px; }
  
  .micro-container:hover .w-core { stroke: var(--c-water); transform: scale(1.2); }

  .active-water { pointer-events: none; }
  .active-water .w-core { animation: sonar-implode 0.8s ease-out forwards; }
  .active-water .w-ring.r1 { animation: sonar-ping 1s ease-out 0.1s forwards; }
  .active-water .w-ring.r2 { animation: sonar-ping 1s ease-out 0.2s forwards; }
  .active-water .w-ring.r3 { animation: sonar-ping 1s ease-out 0.3s forwards; }

  @keyframes sonar-implode {
    0% { transform: scale(1.2); fill: none; }
    20% { transform: scale(0.1); fill: var(--c-water); stroke-width: 4px; }
    100% { transform: scale(0); fill: var(--c-water); opacity: 0; }
  }
  @keyframes sonar-ping {
    0% { transform: scale(0.1); opacity: 1; }
    100% { transform: scale(6); opacity: 0; stroke-width: 0.1px; }
  }

</style>
</head>
<body>

  <div class="header-text">
    <h1>MICRO INTERACTIONS</h1>
    <p>Extremely tiny, highly innovative elemental physics.</p>
  </div>

  <div class="showcase-grid">

    <!-- FLUID -->
    <div class="card">
      <div class="card-header"><span class="title">Fluid</span><button class="reset-btn" onclick="resetOrb(this, 'active-fluid')">Reset</button></div>
      <div class="interactive-area">
        <div class="micro-container" onclick="this.classList.add('active-fluid');">
          <svg viewBox="0 0 40 40">
            <line class="f-base" x1="12" y1="20" x2="28" y2="20" />
            <path class="f-line" d="M 12 20 Q 20 26 28 20" />
            <circle class="f-dew" cx="20" cy="20" r="1.5" />
          </svg>
        </div>
      </div>
    </div>

    <!-- EARTH -->
    <div class="card">
      <div class="card-header"><span class="title">Earth</span><button class="reset-btn" onclick="resetOrb(this, 'active-earth')">Reset</button></div>
      <div class="interactive-area">
        <div class="micro-container" onclick="this.classList.add('active-earth');">
          <svg viewBox="0 0 40 40">
            <path class="e-fissure" d="M 14 20 L 17 18 L 20 22 L 23 19 L 26 20" />
            <path class="e-left e-dot" d="M 20 18 A 2 2 0 0 0 20 22 Z" />
            <path class="e-right e-dot" d="M 20 18 A 2 2 0 0 1 20 22 Z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- FIRE -->
    <div class="card">
      <div class="card-header"><span class="title">Fire</span><button class="reset-btn" onclick="resetOrb(this, 'active-fire')">Reset</button></div>
      <div class="interactive-area">
        <div class="micro-container" onclick="this.classList.add('active-fire');">
          <svg viewBox="0 0 40 40">
            <line class="z-line" x1="20" y1="14" x2="20" y2="26" />
            <circle class="z-spark" cx="20" cy="14" r="1.5" />
          </svg>
        </div>
      </div>
    </div>

    <!-- AIR -->
    <div class="card">
      <div class="card-header"><span class="title">Air</span><button class="reset-btn" onclick="resetOrb(this, 'active-air')">Reset</button></div>
      <div class="interactive-area">
        <div class="micro-container" onclick="this.classList.add('active-air');">
          <svg viewBox="0 0 40 40">
            <g class="a-group">
              <circle class="a-dot" cx="17.5" cy="20" r="1" />
              <circle class="a-dot" cx="22.5" cy="20" r="1" />
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- WATER -->
    <div class="card">
      <div class="card-header"><span class="title">Water</span><button class="reset-btn" onclick="resetOrb(this, 'active-water')">Reset</button></div>
      <div class="interactive-area">
        <div class="micro-container" onclick="this.classList.add('active-water');">
          <svg viewBox="0 0 40 40">
            <circle class="w-ring r1" cx="20" cy="20" r="2" />
            <circle class="w-ring r2" cx="20" cy="20" r="2" />
            <circle class="w-ring r3" cx="20" cy="20" r="2" />
            <circle class="w-core" cx="20" cy="20" r="2" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <script>
    function resetOrb(btn, activeClass) {
      const card = btn.closest('.card');
      const orb = card.querySelector('.micro-container');
      orb.classList.remove(activeClass);
      // Force DOM reflow
      void orb.offsetWidth;
    }
  </script>
</body>
</html>
