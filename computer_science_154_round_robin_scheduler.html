<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round-Robin Scheduler</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden;
            perspective: 800px;
        }
        .container {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        
        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: spin 4s steps(4) infinite;
        }

        .process {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ccc;
            top: 17px;
            left: 17px;
            border-radius: 4px;
            transition: background-color 0.1s;
        }

        .p1 { transform: rotateY(0deg) translateZ(25px); }
        .p2 { transform: rotateY(90deg) translateZ(25px); }
        .p3 { transform: rotateY(180deg) translateZ(25px); }
        .p4 { transform: rotateY(270deg) translateZ(25px); }

        .cpu-light {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: transparent;
            border: 2px solid #16A085;
            border-radius: 6px;
            top: 11px;
            left: 11px;
            transform: translateZ(26px);
            box-shadow: 0 0 10px #16A085 inset, 0 0 10px #16A085;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-360deg); }
        }

        @keyframes colorCycle1 { 0%, 24% { background-color: #16A085; } 25%, 100% { background-color: #ccc; } }
        @keyframes colorCycle2 { 0%, 24% { background-color: #ccc; } 25%, 49% { background-color: #16A085; } 50%, 100% { background-color: #ccc; } }
        @keyframes colorCycle3 { 0%, 49% { background-color: #ccc; } 50%, 74% { background-color: #16A085; } 75%, 100% { background-color: #ccc; } }
        @keyframes colorCycle4 { 0%, 74% { background-color: #ccc; } 75%, 99% { background-color: #16A085; } 100% { background-color: #ccc; } }

        .p1 { animation: colorCycle1 4s infinite; }
        .p2 { animation: colorCycle2 4s infinite; }
        .p3 { animation: colorCycle3 4s infinite; }
        .p4 { animation: colorCycle4 4s infinite; }

        .clicked .carousel {
            animation: spinFast 1s forwards cubic-bezier(0.5, 0, 1, 1);
        }
        .clicked .cpu-light { display: none; }

        @keyframes spinFast {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            50% { transform: rotateY(-720deg) rotateX(45deg); }
            100% { transform: rotateY(-2000deg) rotateX(90deg) translateZ(100vh); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="container" id="model">
        <div class="carousel">
            <div class="process p1"></div>
            <div class="process p2"></div>
            <div class="process p3"></div>
            <div class="process p4"></div>
        </div>
        <div class="cpu-light"></div>
    </div>

    <script>
        document.getElementById('model').addEventListener('click', function() {
            this.classList.add('clicked');
        });
    </script>
</body>
</html>
