<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 24px;
    height: 40px;
    cursor: pointer;
  }
  .ground {
    position: absolute;
    top: 10px;
    width: 100%;
    height: 30px;
    border-top: 1px solid rgba(205, 92, 92, 0.4);
    background: linear-gradient(to bottom, rgba(205,92,92,0.1), rgba(205,92,92,0.3));
    z-index: 1;
  }
  .pipe {
    position: absolute;
    width: 12px;
    height: 25px;
    border: 2px solid;
    border-top: none;
    border-radius: 0 0 6px 6px;
    left: 4px;
    top: 5px;
    z-index: 2;
    background: linear-gradient(to bottom, transparent, transparent) padding-box,
                linear-gradient(180deg, #3498DB, #CD5C5C) border-box;
    border: 2px solid transparent;
    border-top: none;
  }
  .flow-dot {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    z-index: 3;
    animation: flow 3s infinite linear;
  }
  @keyframes flow {
    0% { top: 5px; left: 4px; background: #3498DB; }
    40% { top: 25px; left: 4px; background: #CD5C5C; }
    50% { top: 28px; left: 9px; background: #CD5C5C; }
    60% { top: 25px; left: 14px; background: #CD5C5C; }
    100% { top: 5px; left: 14px; background: #CD5C5C; }
  }
  .glow {
    position: absolute;
    width: 24px;
    height: 40px;
    background: #fff;
    filter: blur(10px);
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="container" id="model">
  <div class="ground"></div>
  <div class="pipe" id="pipe"></div>
  <div class="flow-dot"></div>
  <div class="flow-dot" style="animation-delay: -1.5s;"></div>
  <div class="glow" id="glow"></div>
</div>
<script>
  document.getElementById('model').onclick = function() {
    this.style.pointerEvents = 'none';
    let pipe = document.getElementById('pipe');
    let glow = document.getElementById('glow');
    let dots = document.querySelectorAll('.flow-dot');
    
    dots.forEach(d => d.style.display = 'none');
    
    pipe.style.transition = 'all 0.5s ease-in';
    pipe.style.borderImage = 'linear-gradient(to bottom, #fff, #fff) 1';
    pipe.style.filter = 'drop-shadow(0 0 5px #fff)';
    glow.style.transition = 'opacity 0.5s';
    glow.style.opacity = '1';
    
    setTimeout(() => {
      pipe.style.transition = 'all 0.8s cubic-bezier(0.5, 0, 0.2, 1)';
      pipe.style.transform = 'translateY(100px)';
      pipe.style.opacity = '0';
      glow.style.transition = 'all 0.8s';
      glow.style.transform = 'translateY(100px)';
      glow.style.opacity = '0';
      
      document.querySelector('.ground').style.transition = 'opacity 1s';
      document.querySelector('.ground').style.opacity = '0';
    }, 500);
  };
</script>
</body>
</html>
