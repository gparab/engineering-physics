<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRAM Cell</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 200px;
    height: 200px;
    cursor: pointer;
  }
  svg {
    width: 100%;
    height: 100%;
  }
  .ring {
    fill: none;
    stroke: #9B59B6;
    stroke-width: 2;
    stroke-dasharray: 4 4;
  }
  .transistor {
    fill: none;
    stroke: #9B59B6;
    stroke-width: 3;
  }
  .electron {
    fill: #E8DAEF;
    filter: drop-shadow(0 0 5px #E8DAEF);
  }
</style>
</head>
<body>
<div class="container" id="model">
  <svg viewBox="0 0 100 100" id="svg-element">
    <g id="circuit">
      <path class="ring" d="M30,30 L70,30 L70,70 L30,70 Z" id="loop-path" />
      <line class="transistor" x1="25" y1="50" x2="35" y2="50" />
      <line class="transistor" x1="65" y1="50" x2="75" y2="50" />
      <line class="transistor" x1="50" y1="25" x2="50" y2="35" />
      <line class="transistor" x1="50" y1="65" x2="50" y2="75" />
    </g>
    <circle class="electron" r="3" id="e1" />
    <circle class="electron" r="3" id="e2" />
    <circle class="electron" r="3" id="e3" />
    <circle class="electron" r="3" id="e4" />
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin);

  const loop = {
    path: "#loop-path",
    align: "#loop-path",
    alignOrigin: [0.5, 0.5],
    autoRotate: true
  };
  
  const tl = gsap.timeline({ repeat: -1 });
  
  const electrons = ["#e1", "#e2", "#e3", "#e4"];
  electrons.forEach((e, i) => {
    gsap.to(e, {
      duration: 2,
      motionPath: {
        ...loop,
        start: i * 0.25,
        end: i * 0.25 + 1
      },
      ease: "none",
      repeat: -1
    });
  });

  const model = document.getElementById('model');
  model.addEventListener('click', () => {
    gsap.killTweensOf(".electron");
    
    const clickTl = gsap.timeline();
    clickTl.to("#circuit", { opacity: 0, duration: 0.3, scale: 1.2, transformOrigin: "50% 50%" }, 0);
    
    electrons.forEach((e, i) => {
      clickTl.to(e, {
        x: Math.cos(i * Math.PI/2) * 200,
        y: Math.sin(i * Math.PI/2) * 200,
        scale: 0,
        opacity: 0,
        duration: 1,
        ease: "power2.out",
        rotation: 720
      }, 0);
    });
  });
</script>
</body>
</html>
