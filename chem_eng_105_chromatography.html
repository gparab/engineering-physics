<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatography</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 20px;
            height: 60px;
            cursor: pointer;
        }

        .column {
            position: absolute;
            width: 12px;
            height: 40px;
            border: 2px solid #555;
            border-top: none;
            left: 2px;
            top: 0;
            overflow: hidden;
            background: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.05),
                rgba(255,255,255,0.05) 2px,
                transparent 2px,
                transparent 4px
            );
        }

        .band {
            position: absolute;
            width: 12px;
            height: 4px;
            left: 0;
            top: -5px;
            opacity: 0;
        }

        .band-mixed { background-color: #C71585; }
        .band-fast { background-color: #FF69B4; }
        .band-slow { background-color: #8B008B; }
        
        .vial {
            position: absolute;
            width: 8px;
            height: 10px;
            border: 1px solid #555;
            border-top: none;
            border-radius: 0 0 2px 2px;
            bottom: 0;
            opacity: 0;
        }
        
        .vial-1 { left: 0px; }
        .vial-2 { left: 10px; }
        
        .drop {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            left: 6px;
            top: 42px;
            opacity: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <div class="column">
            <div class="band band-mixed" id="b-mix"></div>
            <div class="band band-fast" id="b-fast"></div>
            <div class="band band-slow" id="b-slow"></div>
        </div>
        <div class="vial vial-1" id="v1"></div>
        <div class="vial vial-2" id="v2"></div>
        <div class="drop" id="drop"></div>
    </div>

    <script>
        const container = document.getElementById('model-container');
        const bMix = document.getElementById('b-mix');
        const bFast = document.getElementById('b-fast');
        const bSlow = document.getElementById('b-slow');
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');
        const drop = document.getElementById('drop');

        // Idle Animation
        const idleTL = gsap.timeline({ repeat: -1 });
        idleTL.set([bMix, bFast, bSlow], { y: 0, opacity: 0 })
              // Enter top mixed
              .to(bMix, { y: 5, opacity: 1, duration: 0.5 })
              .to(bMix, { y: 15, duration: 1, ease: "none" })
              // Separate
              .set(bMix, { opacity: 0 })
              .set([bFast, bSlow], { y: 15, opacity: 1 })
              .to(bFast, { y: 35, duration: 1, ease: "none" }, "sep")
              .to(bSlow, { y: 25, duration: 1, ease: "none" }, "sep")
              .to([bFast, bSlow], { opacity: 0, duration: 0.2 });

        // Click Animation
        container.addEventListener('click', () => {
            idleTL.kill();
            
            const clickTL = gsap.timeline();
            
            // Show vials
            clickTL.to([v1, v2], { opacity: 1, duration: 0.2 })
                   // Fast elutes to v1
                   .to(bFast, { y: 40, opacity: 1, duration: 0.5, ease: "none" })
                   .set(bFast, { opacity: 0 })
                   .set(drop, { backgroundColor: "#FF69B4", opacity: 1, top: 42 })
                   .to(drop, { y: 8, x: -6, duration: 0.2, ease: "power1.in" })
                   .set(drop, { opacity: 0 })
                   .to(v1, { backgroundColor: "#FF69B4", duration: 0.2 })
                   
                   // Slow elutes to v2
                   .to(bSlow, { y: 40, opacity: 1, duration: 0.8, ease: "none" }, "-=0.2")
                   .set(bSlow, { opacity: 0 })
                   .set(drop, { backgroundColor: "#8B008B", opacity: 1, top: 42, x: 0, y: 0 })
                   .to(drop, { y: 8, x: 4, duration: 0.2, ease: "power1.in" })
                   .set(drop, { opacity: 0 })
                   .to(v2, { backgroundColor: "#8B008B", duration: 0.2 })
                   
                   // Column flushes clean (fade out)
                   .to('.column', { borderColor: "transparent", background: "transparent", duration: 0.5 })
                   .to([v1, v2], { y: 20, opacity: 0, duration: 0.5 }, "+=0.2")
                   .to(container, { display: 'none', duration: 0 });
        });
    </script>
</body>
</html>
