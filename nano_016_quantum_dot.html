<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Dot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    cursor: pointer;
    width: 20px;
    height: 20px;
  }
  .quantum-dot {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ff00ff;
    box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
    position: absolute;
    top: 0; left: 0;
  }
  .exciton {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    top: 8px; left: 8px;
    opacity: 0;
  }
  .electron { background: #00ffff; box-shadow: 0 0 5px #00ffff; }
  .hole { background: #ff0000; box-shadow: 0 0 5px #ff0000; }
  .photon {
    position: absolute;
    width: 2px; height: 10px;
    background: #fff;
    box-shadow: 0 0 5px #fff;
    top: -100px; left: 9px;
    opacity: 0;
  }
  .flash {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: #ff00ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="container" id="model">
  <div class="photon" id="photon"></div>
  <div class="quantum-dot" id="dot"></div>
  <div class="exciton electron" id="electron"></div>
  <div class="exciton hole" id="hole"></div>
</div>
<script>
  gsap.registerPlugin(MotionPathPlugin);

  const dot = document.getElementById('dot');
  const model = document.getElementById('model');

  const idleTl = gsap.timeline({repeat: -1, yoyo: true, ease: "sine.inOut"});
  idleTl.fromTo(dot, 
    { scale: 0.7, backgroundColor: '#0088ff', boxShadow: '0 0 10px #0088ff' },
    { scale: 1.3, backgroundColor: '#ff0044', boxShadow: '0 0 20px #ff0044', duration: 2 }
  );

  let isAnimating = false;
  model.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    idleTl.kill();
    
    gsap.to(dot, {scale: 1, backgroundColor: '#ff00ff', boxShadow: '0 0 10px #ff00ff, 0 0 20px #ff00ff', duration: 0.3});
    
    const tl = gsap.timeline();
    
    tl.to('#photon', {opacity: 1, duration: 0.1})
      .to('#photon', {y: 100, duration: 0.3, ease: "power2.in"})
      .to('#photon', {opacity: 0, duration: 0.01});
      
    tl.to(['#electron', '#hole'], {opacity: 1, duration: 0.1})
      .to('#dot', {scale: 0.8, opacity: 0.5, duration: 0.2}, "<")
      .to('#electron', {
        motionPath: { path: [{x: -30, y: -20}, {x: -50, y: 10}, {x: -10, y: 30}, {x: 0, y: 0}], curviness: 1.5 },
        duration: 1, ease: "power1.inOut"
      }, "+=0.1")
      .to('#hole', {
        motionPath: { path: [{x: 30, y: 20}, {x: 50, y: -10}, {x: 10, y: -30}, {x: 0, y: 0}], curviness: 1.5 },
        duration: 1, ease: "power1.inOut"
      }, "<")
      .to(['#electron', '#hole', '#dot'], {opacity: 0, duration: 0.1})
      .to('#flash', {
        width: '300vw', height: '300vw',
        backgroundColor: '#ffffff',
        duration: 0.5, ease: "power4.out"
      })
      .to('#flash', {
        opacity: 0, duration: 1
      })
      .set('#model', {display: 'none'});
  });
</script>
</body>
</html>
