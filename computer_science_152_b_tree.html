<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Tree</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 80px;
            height: 40px;
            cursor: pointer;
        }
        .node {
            position: absolute;
            background-color: #27AE60;
            height: 8px;
            border-radius: 2px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            color: white;
        }
        .root {
            top: 0;
            left: 30px;
            width: 20px;
            animation: rootSplit 3s infinite;
        }
        .child1 {
            bottom: 0;
            left: 0;
            width: 20px;
        }
        .child2 {
            bottom: 0;
            left: 30px;
            width: 20px;
        }
        .child3 {
            bottom: 0;
            right: 0;
            width: 20px;
        }
        .line {
            position: absolute;
            background-color: #27AE60;
            width: 1px;
            height: 20px;
            top: 8px;
            transform-origin: top;
        }
        .l1 { left: 40px; transform: rotate(45deg); height: 30px; }
        .l2 { left: 40px; }
        .l3 { left: 40px; transform: rotate(-45deg); height: 30px; }
        
        .data {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #333;
            border-radius: 50%;
            top: -20px;
            left: 40px;
            animation: fall 3s infinite;
        }

        @keyframes fall {
            0% { top: -20px; opacity: 1; }
            30% { top: 0; opacity: 1; }
            40% { top: 0; opacity: 0; }
            100% { top: 0; opacity: 0; }
        }

        @keyframes rootSplit {
            0%, 20% { width: 20px; left: 30px; }
            35% { width: 30px; left: 25px; } /* Expand */
            45%, 100% { width: 20px; left: 30px; } /* Split/Merge back */
        }

        /* Click animation */
        .clicked {
            animation: violentUp 0.8s forwards cubic-bezier(0.8, 0, 0.2, 1);
        }
        @keyframes violentUp {
            0% { transform: translateY(0); }
            30% { transform: translateY(20px); } /* Anticipation */
            100% { transform: translateY(-200vh); }
        }
    </style>
</head>
<body>
    <div class="container" id="model">
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="node root"></div>
        <div class="node child1"></div>
        <div class="node child2"></div>
        <div class="node child3"></div>
        <div class="data"></div>
    </div>

    <script>
        document.getElementById('model').addEventListener('click', function() {
            this.classList.add('clicked');
        });
    </script>
</body>
</html>
