<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tree Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            transition: background-color 0.1s;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
        }

        .line {
            stroke: #555;
            stroke-width: 2;
            fill: none;
        }

        .top-event {
            fill: #333;
            stroke: #C0392B; /* Hazard Red */
            stroke-width: 3;
        }

        .top-event-text {
            fill: #C0392B;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .gate {
            fill: #444;
            stroke: #555;
            stroke-width: 2;
        }

        .leaf {
            fill: #333;
            stroke: #555;
            stroke-width: 2;
        }

        .fault-signal {
            fill: #C0392B;
            r: 4;
            opacity: 0;
        }
        
        .melt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        #fta-svg {
            transform-origin: center top;
        }
    </style>
</head>
<body>

    <div class="container" id="fta-container">
        <svg width="300" height="300" viewBox="0 0 300 300" id="fta-svg">
            <!-- Lines -->
            <path d="M 150 50 L 150 90" class="line" /> <!-- Top Event to Top Gate (OR) -->
            <path d="M 150 120 L 150 140 M 150 140 L 80 140 M 150 140 L 220 140 M 80 140 L 80 160 M 220 140 L 220 160" class="line" /> <!-- OR to ANDs -->
            <path d="M 80 190 L 80 210 M 80 210 L 40 210 M 80 210 L 120 210 M 40 210 L 40 240 M 120 210 L 120 240" class="line" id="lines-left"/> <!-- AND to Leaves -->
            <path d="M 220 190 L 220 210 M 220 210 L 180 210 M 220 210 L 260 210 M 180 210 L 180 240 M 260 210 L 260 240" class="line" id="lines-right"/> <!-- AND to Leaves -->

            <!-- Fault Signals (will be animated along lines) -->
            <circle cx="0" cy="0" class="fault-signal" id="sig1" />
            <circle cx="0" cy="0" class="fault-signal" id="sig2" />
            <circle cx="0" cy="0" class="fault-signal" id="sig3" />
            <circle cx="0" cy="0" class="fault-signal" id="sig4" />
            
            <circle cx="0" cy="0" class="fault-signal" id="sig-top1" />
            <circle cx="0" cy="0" class="fault-signal" id="sig-top2" />
            <circle cx="0" cy="0" class="fault-signal" id="sig-final" />

            <!-- Top Event -->
            <rect x="100" y="20" width="100" height="30" rx="5" class="top-event" id="top-box" />
            <text x="150" y="35" class="top-event-text" id="top-text">TOP EVENT</text>

            <!-- Gates -->
            <!-- Top OR Gate -->
            <path d="M 130 120 Q 150 90 170 120 Q 150 110 130 120" class="gate" />
            
            <!-- Bottom AND Gates -->
            <!-- Left AND -->
            <path d="M 65 190 L 95 190 L 95 175 A 15 15 0 0 0 65 175 Z" class="gate" id="gate-and-left"/>
            <!-- Right AND -->
            <path d="M 205 190 L 235 190 L 235 175 A 15 15 0 0 0 205 175 Z" class="gate" id="gate-and-right"/>

            <!-- Leaves (Basic Events) -->
            <circle cx="40" cy="250" r="10" class="leaf" id="leaf1" />
            <circle cx="120" cy="250" r="10" class="leaf" id="leaf2" />
            <circle cx="180" cy="250" r="10" class="leaf" id="leaf3" />
            <circle cx="260" cy="250" r="10" class="leaf" id="leaf4" />
        </svg>
    </div>
    
    <div class="melt-overlay" id="melt-overlay"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('fta-container');
        const sig1 = document.getElementById('sig1');
        const sig2 = document.getElementById('sig2');
        const sig3 = document.getElementById('sig3');
        const sig4 = document.getElementById('sig4');
        const leaf1 = document.getElementById('leaf1');
        const leaf3 = document.getElementById('leaf3');

        // Helper to animate fault from leaf to AND gate (idle)
        function triggerIdleFault(leaf, sigId, pathD, gateId) {
            const tl = gsap.timeline();
            tl.set(leaf, { fill: "#C0392B" })
              .set(sigId, { opacity: 1, cx: pathD.startX, cy: pathD.startY })
              .to(sigId, { duration: 0.3, cy: pathD.midY, ease: "none" })
              .to(sigId, { duration: 0.3, cx: pathD.midX, ease: "none" })
              .to(sigId, { duration: 0.3, cy: pathD.endY, ease: "none" })
              .to(sigId, { duration: 0.1, opacity: 0 })
              .to(gateId, { stroke: "#C0392B", duration: 0.2, yoyo: true, repeat: 1 }) // Gate stops it
              .set(leaf, { fill: "#333", delay: 0.2 });
            return tl;
        }

        let idleTl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
        
        // Leaf 1 faults
        idleTl.add(triggerIdleFault(leaf1, "#sig1", {startX: 40, startY: 240, midY: 210, midX: 80, endY: 190}, "#gate-and-left"), 0);
        // Leaf 3 faults later
        idleTl.add(triggerIdleFault(leaf3, "#sig3", {startX: 180, startY: 240, midY: 210, midX: 220, endY: 190}, "#gate-and-right"), 1.5);

        container.addEventListener('click', () => {
            idleTl.kill();
            gsap.killTweensOf("*"); // Stop everything

            const tl = gsap.timeline();

            // Perfect storm: All leaves fault simultaneously
            tl.set(".leaf", { fill: "#C0392B" })
              .set(["#sig1", "#sig2", "#sig3", "#sig4"], { opacity: 1 });

            // Animate all signals up to AND gates
            tl.to("#sig1", { duration: 0.2, cx: 40, cy: 210, ease: "none" }, 0)
              .to("#sig2", { duration: 0.2, cx: 120, cy: 210, ease: "none" }, 0)
              .to("#sig3", { duration: 0.2, cx: 180, cy: 210, ease: "none" }, 0)
              .to("#sig4", { duration: 0.2, cx: 260, cy: 210, ease: "none" }, 0);
              
            tl.to("#sig1", { duration: 0.2, cx: 80, ease: "none" }, 0.2)
              .to("#sig2", { duration: 0.2, cx: 80, ease: "none" }, 0.2)
              .to("#sig3", { duration: 0.2, cx: 220, ease: "none" }, 0.2)
              .to("#sig4", { duration: 0.2, cx: 220, ease: "none" }, 0.2);

            tl.to(["#sig1", "#sig2", "#sig3", "#sig4"], { duration: 0.2, cy: 190, ease: "none" }, 0.4);

            // AND gates trigger, send signals up to OR gate
            tl.set(["#sig1", "#sig2", "#sig3", "#sig4"], { opacity: 0 }, 0.6)
              .set(".gate", { stroke: "#C0392B", fill: "#8a2820" }, 0.6)
              .set(["#sig-top1", "#sig-top2"], { opacity: 1 }, 0.6)
              .set("#sig-top1", { cx: 80, cy: 160 }, 0.6)
              .set("#sig-top2", { cx: 220, cy: 160 }, 0.6);

            tl.to(["#sig-top1", "#sig-top2"], { duration: 0.2, cy: 140, ease: "none" }, 0.6);
            tl.to("#sig-top1", { duration: 0.2, cx: 150, ease: "none" }, 0.8);
            tl.to("#sig-top2", { duration: 0.2, cx: 150, ease: "none" }, 0.8);
            tl.to(["#sig-top1", "#sig-top2"], { duration: 0.2, cy: 120, ease: "none" }, 1.0);

            // OR gate triggers, final signal to Top Event
            tl.set(["#sig-top1", "#sig-top2"], { opacity: 0 }, 1.2)
              .set("#sig-final", { opacity: 1, cx: 150, cy: 90 }, 1.2);
            tl.to("#sig-final", { duration: 0.2, cy: 50, ease: "none" }, 1.2);

            // Top Event Triggered
            tl.set("#sig-final", { opacity: 0 }, 1.4)
              .to("#top-box", { fill: "#C0392B", duration: 0.1 }, 1.4)
              .to("#top-text", { fill: "#FFF", duration: 0.1 }, 1.4);

            // Meltdown
            tl.to("#top-box", {
                scale: 1.5,
                transformOrigin: "center",
                duration: 0.2,
                yoyo: true,
                repeat: 3
            }, 1.5);

            tl.to("#fta-svg", {
                scaleY: 0,
                opacity: 0,
                duration: 1,
                ease: "power3.in"
            }, 2.0);

            // Blinding flash overlay
            tl.to("#melt-overlay", {
                opacity: 1,
                duration: 0.3,
                ease: "power4.out"
            }, 2.0);
            
            // Screen turns black / melts down
            tl.to("body", {
                backgroundColor: "#fff",
                duration: 0.1
            }, 2.1);
            
            tl.to("body", {
                backgroundColor: "#111",
                duration: 1
            }, 2.5);
            
            tl.to("#melt-overlay", {
                opacity: 0,
                duration: 1
            }, 2.5);
        });

    </script>
</body>
</html>
