<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveying Theodolite</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2b2b2b; overflow: hidden; }
  .scene { position: relative; width: 400px; height: 400px; cursor: pointer; }
  
  /* Theodolite */
  .tripod { position: absolute; left: 180px; top: 180px; width: 40px; height: 40px; z-index: 5; }
  .leg1, .leg2, .leg3 { position: absolute; width: 4px; height: 30px; background-color: #aaa; transform-origin: top center; top: 20px; left: 18px; }
  .leg1 { transform: rotate(30deg) translate(10px, 0); }
  .leg2 { transform: rotate(-30deg) translate(-10px, 0); }
  .leg3 { transform: rotate(0deg) translate(0, 5px); }
  .scope { position: absolute; left: 10px; top: 0; width: 20px; height: 20px; background-color: #FFD700; border-radius: 5px; z-index: 6; }
  
  /* Targets */
  .target { position: absolute; width: 10px; height: 10px; background-color: #FFD700; border-radius: 50%; z-index: 4; }
  #t1 { top: 50px; left: 100px; }
  #t2 { top: 80px; left: 300px; }
  #t3 { top: 320px; left: 200px; }
  
  /* Lasers */
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .laser { stroke: rgba(255, 215, 0, 0.8); stroke-width: 2; stroke-dasharray: 5,5; opacity: 0; }
  .radar-line { stroke: rgba(255, 215, 0, 0.4); stroke-width: 2; transform-origin: 200px 200px; }
  
  /* Contour Map */
  .contours { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s, transform 2s ease-in-out; transform: scale(0.5); z-index: 1; pointer-events: none; }
  .contour-path { fill: none; stroke: #4caf50; stroke-width: 1; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="contours" id="contours">
    <svg viewBox="0 0 400 400">
      <path class="contour-path" d="M 50 50 Q 200 10, 350 50 T 350 350 T 50 350 Z" />
      <path class="contour-path" d="M 100 100 Q 200 60, 300 100 T 300 300 T 100 300 Z" />
      <path class="contour-path" d="M 150 150 Q 200 120, 250 150 T 250 250 T 150 250 Z" />
    </svg>
  </div>

  <div class="tripod" id="tripod">
    <div class="leg1"></div>
    <div class="leg2"></div>
    <div class="leg3"></div>
    <div class="scope"></div>
  </div>
  
  <div class="target" id="t1"></div>
  <div class="target" id="t2"></div>
  <div class="target" id="t3"></div>
  
  <svg>
    <line class="radar-line" id="radar" x1="200" y1="200" x2="200" y2="0" />
    <polygon class="laser" id="triangle" points="105,55 305,85 205,325" fill="rgba(255, 215, 0, 0.2)" />
    <line class="laser" id="l1" x1="200" y1="200" x2="105" y2="55" />
    <line class="laser" id="l2" x1="200" y1="200" x2="305" y2="85" />
    <line class="laser" id="l3" x1="200" y1="200" x2="205" y2="325" />
  </svg>
</div>
<script>
  const scene = document.getElementById('scene');
  const radar = document.getElementById('radar');
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  const l3 = document.getElementById('l3');
  const triangle = document.getElementById('triangle');
  const contours = document.getElementById('contours');
  
  let angle = 0;
  let clicked = false;
  
  let sweep = setInterval(() => {
    angle += 2;
    radar.style.transform = `rotate(${angle}deg)`;
    
    // Lock on targets (approximate angles)
    let modAngle = angle % 360;
    if(modAngle > 310 && modAngle < 330) l1.style.opacity = '1';
    else if(modAngle > 30 && modAngle < 50) l2.style.opacity = '1';
    else if(modAngle > 170 && modAngle < 190) l3.style.opacity = '1';
    else {
      l1.style.opacity = '0';
      l2.style.opacity = '0';
      l3.style.opacity = '0';
    }
  }, 20);

  scene.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    clearInterval(sweep);
    
    radar.style.display = 'none';
    l1.style.opacity = '1';
    l2.style.opacity = '1';
    l3.style.opacity = '1';
    
    setTimeout(() => {
      triangle.style.opacity = '1';
      triangle.style.transition = 'opacity 0.5s';
    }, 500);
    
    setTimeout(() => {
      // Zoom into contour map
      contours.style.opacity = '1';
      contours.style.transform = 'scale(2.5)';
      document.getElementById('tripod').style.opacity = '0';
      document.getElementById('t1').style.opacity = '0';
      document.getElementById('t2').style.opacity = '0';
      document.getElementById('t3').style.opacity = '0';
      triangle.style.opacity = '0';
      l1.style.opacity = '0';
      l2.style.opacity = '0';
      l3.style.opacity = '0';
    }, 1500);
  });
</script>
</body>
</html>
