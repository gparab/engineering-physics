<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waveguide</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0d0d0d; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #canvas-container { width: 400px; height: 400px; cursor: pointer; }
        canvas { display: block; outline: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 1, 4);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(400, 400);
        container.appendChild(renderer.domElement);

        // Rectangular tube
        const tubeMat = new THREE.MeshPhongMaterial({ color: 0x7F8C8D, transparent: true, opacity: 0.5, side: THREE.DoubleSide, wireframe: true });
        const tubeGeo = new THREE.BoxGeometry(2, 1, 4);
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tube);

        // TE10 Mode Vectors
        const arrows = [];
        const numArrows = 20;
        
        const dir = new THREE.Vector3(0, 1, 0);
        const origin = new THREE.Vector3(0, 0, 0);
        
        for (let i = 0; i < numArrows; i++) {
            const z = -2 + (i / numArrows) * 4;
            const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, z), 0.8, 0xff0000, 0.2, 0.2);
            scene.add(arrow);
            arrows.push({ arrow: arrow, zPos: z });
        }

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(2, 5, 3);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        let time = 0;
        let isDestroyed = false;

        function animate() {
            requestAnimationFrame(animate);
            if (!isDestroyed) {
                time += 0.1;
                tube.rotation.y = Math.sin(time * 0.2) * 0.2;
                
                arrows.forEach((a, i) => {
                    const phase = time - a.zPos * 2;
                    const magnitude = Math.sin(phase);
                    a.arrow.setDirection(new THREE.Vector3(0, Math.sign(magnitude), 0));
                    a.arrow.setLength(Math.max(0.01, Math.abs(magnitude) * 0.8), 0.2, 0.2);
                    a.arrow.position.set(0, 0, a.zPos);
                    // Rotate slightly with tube
                    a.arrow.rotation.y = tube.rotation.y;
                });
            }
            renderer.render(scene, camera);
        }
        animate();

        container.addEventListener('click', () => {
            if (isDestroyed) return;
            isDestroyed = true;
            
            // Frequency drops below cutoff (evanescent wave)
            arrows.forEach((a, i) => {
                gsap.to(a.arrow.scale, {
                    x: 0.01, y: 0.01, z: 0.01,
                    duration: 1,
                    delay: (a.zPos + 2) * 0.1
                });
            });
            
            // Tube crumples
            gsap.to(tube.scale, {
                x: 0.1, y: 0.1, z: 0.1,
                duration: 1.5,
                delay: 0.5,
                ease: 'power3.in',
                onComplete: () => {
                    gsap.to(container, { opacity: 0, duration: 0.5 });
                }
            });
            gsap.to(tube.rotation, {
                x: Math.PI, z: Math.PI / 2,
                duration: 1.5,
                delay: 0.5
            });
        });
    </script>
</body>
</html>
