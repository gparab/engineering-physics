<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell-and-Tube Heat Exchanger</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 24px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let particles = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const cylW = 40;
    const cylH = 20;

    class FluidDot {
        constructor(isTube) {
            this.isTube = isTube;
            this.x = isTube ? cx - cylW/2 : cx + cylW/2;
            this.y = cy + (Math.random() - 0.5) * cylH;
            this.speed = isTube ? 0.8 + Math.random()*0.5 : -(0.8 + Math.random()*0.5);
            this.life = 1.0;
        }
        update() {
            if (!clicked) {
                this.x += this.speed;
                if (this.isTube && this.x > cx + cylW/2) this.x = cx - cylW/2;
                if (!this.isTube && this.x < cx - cylW/2) this.x = cx + cylW/2;
            }
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
            if (!clicked) {
                // Gradient based on x position
                let ratio = (this.x - (cx - cylW/2)) / cylW;
                if (!this.isTube) ratio = 1 - ratio;
                // Tubes heat up (blue to red)
                // Shell cools down (red to blue)
                let r = this.isTube ? Math.floor(255 * ratio) : Math.floor(255 * (1 - ratio));
                let b = this.isTube ? Math.floor(255 * (1 - ratio)) : Math.floor(255 * ratio);
                ctx.fillStyle = `rgb(${r}, 0, ${b})`;
            } else {
                ctx.fillStyle = `rgba(150, 150, 150, ${this.life})`;
            }
            ctx.fill();
        }
    }

    class EvaporatingDot {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 8 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 3 + 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(150, 150, 150, ${this.life})`;
            ctx.fill();
        }
    }

    let dots = [];
    for (let i = 0; i < 30; i++) {
        dots.push(new FluidDot(i % 2 === 0));
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        // spawn evaporating dots
        for(let i=0; i<150; i++) {
            let x = cx + (Math.random() - 0.5) * cylW;
            let y = cy + (Math.random() - 0.5) * cylH;
            particles.push(new EvaporatingDot(x, y));
        }
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked) {
            // Draw cylinder outline
            ctx.beginPath();
            ctx.rect(cx - cylW/2, cy - cylH/2, cylW, cylH);
            ctx.strokeStyle = '#D35400';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Draw tubes
            ctx.beginPath();
            ctx.moveTo(cx - cylW/2, cy - cylH/4);
            ctx.lineTo(cx + cylW/2, cy - cylH/4);
            ctx.moveTo(cx - cylW/2, cy + cylH/4);
            ctx.lineTo(cx + cylW/2, cy + cylH/4);
            ctx.strokeStyle = 'rgba(211, 84, 0, 0.5)';
            ctx.stroke();

            dots.forEach(d => {
                d.update();
                d.draw(ctx);
            });
        } else {
            // flash grey and evaporate
            ctx.fillStyle = `rgba(200, 200, 200, ${Math.max(0, 1 - particles[0]?.life*2)})`;
            ctx.fillRect(0, 0, width, height);
            
            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
