<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Minimalist Demo</title>
<style>
  :root {
    --ink: #fff;
    --paper: #020203;
    --card-bg: #07070a;
    --cyan: #00e5ff;
  }
  body {
    background-color: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    overflow-x: hidden;
  }
  .header-text {
    text-align: center;
    max-width: 600px;
    margin-bottom: 20px;
  }
  .showcase-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 600px;
    height: 350px;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,229,255,0.05), inset 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .card-header {
    padding: 20px 25px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .card-header h2 { margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; color: #eee;}
  .card-header span { font-size: 10px; font-weight: 300; color: #555; }
  .reset-btn {
    background: transparent; color: #666; border: 1px solid #333; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
  }
  .reset-btn:hover { color: var(--cyan); border-color: var(--cyan); }

  .interactive-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .hint { position: absolute; bottom: 20px; right: 25px; font-size: 10px; color: #444; letter-spacing: 3px; text-transform: uppercase; pointer-events: none; }

  .orb-container {
    width: 80px; height: 80px;
    position: relative;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* =======================================================================
     1. THE ORBITER (Home / UFO)
     ======================================================================= */
  .orb-core { width: 14px; height: 14px; background: #000; border-radius: 50%; box-shadow: inset 0 0 0 1px #fff; z-index: 2; transition: transform 0.5s ease; }
  .orb-ring {
    position: absolute; width: 60px; height: 60px;
    border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 50%;
    transform: rotateX(70deg) rotateY(20deg);
    transform-style: preserve-3d;
    animation: orbiter-spin 8s linear infinite;
  }
  .orb-satellite {
    position: absolute; top: -3px; left: 27px; width: 6px; height: 6px;
    background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan);
  }

  .orb-container:hover .orb-ring { border-color: rgba(0, 229, 255, 0.6); animation-duration: 2s; }
  .orb-container:hover .orb-core { transform: scale(1.5); box-shadow: inset 0 0 0 1px var(--cyan); }

  .orb-container.active-orbiter { pointer-events: none; }
  .orb-container.active-orbiter .orb-core { animation: orbiter-warp 0.6s cubic-bezier(0.9, 0, 0.1, 1) forwards; }
  .orb-container.active-orbiter .orb-ring { opacity: 0; transition: 0.2s; }

  @keyframes orbiter-spin { 0% { transform: rotateX(70deg) rotateY(20deg) rotateZ(0deg); } 100% { transform: rotateX(70deg) rotateY(20deg) rotateZ(360deg); } }
  @keyframes orbiter-warp {
    0% { transform: scale(1.5); }
    30% { transform: scale(0.5); }
    50% { transform: scaleX(4) scaleY(0.1); background: var(--cyan); box-shadow: 0 0 20px var(--cyan); }
    100% { transform: scaleX(20) scaleY(0.02) translateX(300px); background: var(--cyan); opacity: 0; }
  }

  /* =======================================================================
     2. THE PRISM (Writing / Chalk)
     ======================================================================= */
  .prism-svg { width: 100%; height: 100%; overflow: visible; }
  .prism-shape {
    fill: rgba(0,0,0,0.5); stroke: #fff; stroke-width: 1px;
    transform-origin: 40px 40px;
    animation: prism-float 4s ease-in-out infinite;
    transition: stroke 0.3s, filter 0.3s;
  }
  .prism-laser {
    stroke: var(--cyan); stroke-width: 2px;
    stroke-dasharray: 200; stroke-dashoffset: 200;
    filter: drop-shadow(0 0 5px var(--cyan));
  }

  .orb-container:hover .prism-shape { stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan)); }
  
  .orb-container.active-prism { pointer-events: none; }
  .orb-container.active-prism .prism-shape { animation: prism-collapse 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .orb-container.active-prism .prism-laser { animation: laser-shoot 0.8s ease-out 0.4s forwards; }

  @keyframes prism-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes prism-collapse {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(0.8) rotate(90deg); }
    100% { transform: scale(0) rotate(90deg); opacity: 0; }
  }
  @keyframes laser-shoot {
    0% { stroke-dashoffset: 200; transform: translateX(0); }
    50% { stroke-dashoffset: 0; transform: translateX(0); }
    100% { stroke-dashoffset: -200; transform: translateX(200px); opacity: 0; }
  }

  /* =======================================================================
     3. THE DRONES (CV / Fireflies)
     ======================================================================= */
  .drone {
    position: absolute; width: 0; height: 0;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 8px solid #fff;
    transform-origin: center 20px;
    animation: drone-hover 6s ease-in-out infinite;
    transition: all 0.5s ease;
  }
  .drone.d1 { transform: rotate(0deg) translateY(-10px); }
  .drone.d2 { transform: rotate(120deg) translateY(-10px); }
  .drone.d3 { transform: rotate(240deg) translateY(-10px); }
  
  .drone-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; animation: drone-spin 10s linear infinite;}

  .orb-container:hover .drone-wrapper { animation: drone-spin 2s linear infinite; }
  .orb-container:hover .drone { border-bottom-color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  
  .orb-container.active-drone { pointer-events: none; }
  .orb-container.active-drone .drone { animation: drone-scatter 0.6s cubic-bezier(0.9, 0, 0.1, 1) forwards; }

  @keyframes drone-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes drone-hover { 0%, 100% { scale: 1; } 50% { scale: 1.2; } }
  @keyframes drone-scatter {
    0% { transform: translateY(-10px); }
    20% { transform: translateY(5px) scale(0.5); }
    100% { transform: translateY(-200px) scale(0.1) scaleY(5); opacity: 0; }
  }

  /* =======================================================================
     4. THE ARTIFACT (Sitemap)
     ======================================================================= */
  .artifact-wrapper { position: relative; width: 40px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: artifact-float 5s ease-in-out infinite;}
  .artifact-top {
    width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #fff;
    margin-bottom: 2px; transition: transform 0.4s ease, border-top-color 0.4s ease;
  }
  .artifact-bottom {
    width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #fff;
    transition: transform 0.4s ease, border-bottom-color 0.4s ease;
  }
  .artifact-core {
    position: absolute; width: 4px; height: 4px; background: var(--cyan); border-radius: 50%; opacity: 0; filter: drop-shadow(0 0 10px var(--cyan));
    transition: opacity 0.4s;
  }
  .artifact-beam {
    position: absolute; width: 2px; height: 100vh; background: var(--cyan); opacity: 0; pointer-events: none;
    box-shadow: 0 0 20px var(--cyan);
  }

  .orb-container:hover .artifact-top { transform: translateY(-5px); border-top-color: #aaa; }
  .orb-container:hover .artifact-bottom { transform: translateY(5px); border-bottom-color: #aaa; }
  .orb-container:hover .artifact-core { opacity: 1; }

  .orb-container.active-artifact { pointer-events: none; }
  .orb-container.active-artifact .artifact-top { animation: artifact-open-t 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .orb-container.active-artifact .artifact-bottom { animation: artifact-open-b 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .orb-container.active-artifact .artifact-beam { animation: artifact-fire 0.8s ease-out 0.2s forwards; }
  .orb-container.active-artifact .artifact-core { opacity: 0; transition: 0.1s; }

  @keyframes artifact-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes artifact-open-t { 100% { transform: translateY(-50px) rotate(45deg) scale(0); opacity: 0; } }
  @keyframes artifact-open-b { 100% { transform: translateY(50px) rotate(-45deg) scale(0); opacity: 0; } }
  @keyframes artifact-fire {
    0% { transform: scaleY(0); opacity: 0; }
    20% { transform: scaleY(1); opacity: 1; width: 2px;}
    100% { transform: scaleY(1); opacity: 0; width: 40px; }
  }

  /* =======================================================================
     5. THE ECLIPSE (Dive)
     ======================================================================= */
  .eclipse-corona {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    background: transparent; box-shadow: 0 0 15px 2px #fff;
    animation: eclipse-pulse 4s infinite alternate; transition: box-shadow 0.5s, transform 0.5s;
  }
  .eclipse-core {
    position: absolute; width: 32px; height: 32px; background: var(--card-bg); border-radius: 50%; z-index: 2;
    transition: transform 0.5s ease;
  }

  .orb-container:hover .eclipse-corona { box-shadow: 0 0 20px 5px var(--cyan); transform: scale(1.1); animation: eclipse-pulse-fast 1s infinite alternate; }
  .orb-container:hover .eclipse-core { transform: scale(0.95); background: #000; }

  .orb-container.active-eclipse { pointer-events: none; }
  .orb-container.active-eclipse .eclipse-core { animation: eclipse-consume 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .orb-container.active-eclipse .eclipse-corona { opacity: 0; transition: 0.2s; }

  @keyframes eclipse-pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
  @keyframes eclipse-pulse-fast { 0% { opacity: 0.8; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1.2); } }
  @keyframes eclipse-consume {
    0% { transform: scale(1); background: #000; }
    30% { transform: scale(0.5); background: #000; }
    100% { transform: scale(40); background: #000; }
  }

</style>
</head>
<body>

  <div class="header-text">
    <h1 style="margin:0 0 10px 0; font-weight: 300; letter-spacing: 6px;">SCI-FI MINIMALISM</h1>
    <p style="margin:0; color:#555; font-size:12px; letter-spacing: 2px;">Ethereal geometries, neon light, and zero-G physics.</p>
  </div>

  <!-- 1. THE ORBITER -->
  <div class="showcase-card">
    <div class="card-header">
      <h2>The Orbiter <span>(Home)</span></h2>
      <button class="reset-btn" onclick="resetOrb(this, 'active-orbiter')">Reset</button>
    </div>
    <div class="interactive-area">
      <div class="orb-container" onclick="this.classList.add('active-orbiter');">
        <div class="orb-ring"><div class="orb-satellite"></div></div>
        <div class="orb-core"></div>
      </div>
    </div>
    <div class="hint">Interact</div>
  </div>

  <!-- 2. THE PRISM -->
  <div class="showcase-card">
    <div class="card-header">
      <h2>The Prism <span>(Writing)</span></h2>
      <button class="reset-btn" onclick="resetOrb(this, 'active-prism')">Reset</button>
    </div>
    <div class="interactive-area">
      <div class="orb-container" onclick="this.classList.add('active-prism');">
        <svg class="prism-svg" viewBox="0 0 80 80">
          <line class="prism-laser" x1="40" y1="40" x2="200" y2="40" />
          <polygon class="prism-shape" points="40,20 50,40 40,60 30,40" />
        </svg>
      </div>
    </div>
    <div class="hint">Interact</div>
  </div>

  <!-- 3. THE DRONES -->
  <div class="showcase-card">
    <div class="card-header">
      <h2>The Swarm <span>(CV)</span></h2>
      <button class="reset-btn" onclick="resetOrb(this, 'active-drone')">Reset</button>
    </div>
    <div class="interactive-area">
      <div class="orb-container" onclick="this.classList.add('active-drone');">
        <div class="drone-wrapper">
          <div class="drone d1"></div>
          <div class="drone d2"></div>
          <div class="drone d3"></div>
        </div>
      </div>
    </div>
    <div class="hint">Interact</div>
  </div>

  <!-- 4. THE ARTIFACT -->
  <div class="showcase-card">
    <div class="card-header">
      <h2>The Artifact <span>(Sitemap)</span></h2>
      <button class="reset-btn" onclick="resetOrb(this, 'active-artifact')">Reset</button>
    </div>
    <div class="interactive-area">
      <div class="orb-container" onclick="this.classList.add('active-artifact');">
        <div class="artifact-wrapper">
          <div class="artifact-top"></div>
          <div class="artifact-bottom"></div>
          <div class="artifact-core"></div>
        </div>
        <div class="artifact-beam"></div>
      </div>
    </div>
    <div class="hint">Interact</div>
  </div>

  <!-- 5. THE ECLIPSE -->
  <div class="showcase-card">
    <div class="card-header">
      <h2>The Eclipse <span>(Dive)</span></h2>
      <button class="reset-btn" onclick="resetOrb(this, 'active-eclipse')">Reset</button>
    </div>
    <div class="interactive-area">
      <div class="orb-container" onclick="this.classList.add('active-eclipse');">
        <div class="eclipse-corona"></div>
        <div class="eclipse-core"></div>
      </div>
    </div>
    <div class="hint">Interact</div>
  </div>

  <script>
    function resetOrb(btn, activeClass) {
      const card = btn.closest('.showcase-card');
      const orb = card.querySelector('.orb-container');
      orb.classList.remove(activeClass);
      // Force DOM reflow to reset animations immediately
      void orb.offsetWidth;
    }
  </script>
</body>
</html>
