<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Interference</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        overflow: hidden;
        font-family: sans-serif;
        perspective: 1000px;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
        cursor: pointer;
    }
    .plate {
        position: absolute;
        bottom: 0; left: 0;
        width: 40px; height: 4px;
        background: #ccc;
        overflow: hidden;
    }
    .fringes {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: repeating-linear-gradient(90deg, #000 0, #000 1px, #f1c40f 2px, #f1c40f 3px);
        opacity: 0.5;
        animation: fringeShift 2s infinite linear;
    }
    @keyframes fringeShift {
        from { transform: translateX(0); }
        to { transform: translateX(6px); }
    }
    .beam {
        position: absolute;
        width: 2px; height: 30px;
        background: #f1c40f;
        box-shadow: 0 0 4px #f1c40f;
        transform-origin: bottom center;
    }
    .ref-beam {
        bottom: 4px; left: 10px;
        transform: rotate(-30deg);
    }
    .obj-beam {
        bottom: 4px; left: 28px;
        transform: rotate(30deg);
        opacity: 0.8;
    }
    
    /* Click Animation Elements */
    .reconstruction-beam {
        position: absolute;
        bottom: 0; left: 50%;
        width: 100vw; height: 100vh;
        background: radial-gradient(circle at bottom, rgba(241, 196, 15, 0.4) 0%, transparent 60%);
        transform: translateX(-50%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
    }
    .hologram-obj {
        position: absolute;
        top: 50%; left: 50%;
        width: 200px; height: 200px;
        margin-top: -100px; margin-left: -100px;
        border: 2px solid #f1c40f;
        border-radius: 20px;
        box-shadow: 0 0 20px #f1c40f, inset 0 0 20px #f1c40f;
        opacity: 0;
        transform-style: preserve-3d;
        pointer-events: none;
    }
    .holo-face {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        border: 2px solid #f1c40f;
        border-radius: 50%;
        box-shadow: 0 0 10px #f1c40f;
    }
    .f1 { transform: rotateY(45deg); }
    .f2 { transform: rotateX(45deg); }
    .f3 { transform: rotateZ(45deg); }
</style>
</head>
<body>

<div id="container" onclick="triggerHologram()">
    <div class="beam ref-beam" id="r-beam"></div>
    <div class="beam obj-beam" id="o-beam"></div>
    <div class="plate">
        <div class="fringes"></div>
    </div>
</div>

<div class="reconstruction-beam" id="reconBeam"></div>
<div class="hologram-obj" id="holoObj">
    <div class="holo-face f1"></div>
    <div class="holo-face f2"></div>
    <div class="holo-face f3"></div>
</div>

<script>
    function triggerHologram() {
        const rBeam = document.getElementById('r-beam');
        const oBeam = document.getElementById('o-beam');
        const reconBeam = document.getElementById('reconBeam');
        const holoObj = document.getElementById('holoObj');
        const container = document.getElementById('container');
        
        rBeam.style.display = 'none';
        oBeam.style.display = 'none';
        
        setTimeout(() => {
            reconBeam.style.opacity = '1';
            
            setTimeout(() => {
                container.style.display = 'none';
                holoObj.style.opacity = '0.9';
                
                holoObj.animate([
                    { transform: 'translateZ(-500px) rotateX(0deg) rotateY(0deg)' },
                    { transform: 'translateZ(200px) rotateX(360deg) rotateY(720deg)' }
                ], {
                    duration: 3000,
                    easing: 'ease-out',
                    fill: 'forwards'
                });
                
                setTimeout(() => {
                    holoObj.style.transition = 'opacity 1s, filter 1s';
                    holoObj.style.opacity = '0';
                    holoObj.style.filter = 'blur(20px)';
                    reconBeam.style.opacity = '0';
                }, 2000);
            }, 300);
        }, 100);
    }
</script>

</body>
</html>
