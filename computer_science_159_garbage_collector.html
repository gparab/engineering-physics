<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Collector</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
            border-radius: 50%;
            border: 1px solid #2ECC71;
            background: #e8faef;
            overflow: hidden;
        }
        
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: conic-gradient(from 0deg, rgba(46,204,113,0) 0%, rgba(46,204,113,0.5) 100%);
            transform-origin: 0 0;
            animation: spin 3s linear infinite;
        }

        .node {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #2ECC71;
        }
        .n1 { top: 20px; left: 30px; }
        .n2 { top: 50px; left: 20px; }
        .n3 { top: 40px; left: 50px; }
        
        .orphan {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #aaa;
            animation: dissolve 3s infinite;
        }
        .o1 { top: 60px; left: 60px; animation-delay: 0.5s; }
        .o2 { top: 15px; left: 55px; animation-delay: 1.5s; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes dissolve {
            0%, 50% { opacity: 1; transform: scale(1); }
            80% { opacity: 0; transform: scale(0); }
            100% { opacity: 0; transform: scale(0); }
        }

        .laser {
            position: absolute;
            top: -100px;
            left: -50vw;
            width: 200vw;
            height: 5px;
            background-color: #2ECC71;
            box-shadow: 0 0 20px #2ECC71;
            opacity: 0;
            z-index: 100;
        }

        /* Stop-The-World click */
        .clicked * {
            animation-play-state: paused !important;
        }
        .clicked .container {
            filter: grayscale(100%);
        }
        .clicked .laser {
            animation: laserWipe 1.5s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes laserWipe {
            0% { top: -100px; opacity: 1; }
            100% { top: 100vh; opacity: 1; }
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }
        .clicked .overlay {
            animation: flashFreeze 1.5s forwards;
        }
        @keyframes flashFreeze {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; backdrop-filter: grayscale(1); }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="laser"></div>
    <div class="container" id="model">
        <div class="radar-sweep"></div>
        <div class="node n1"></div>
        <div class="node n2"></div>
        <div class="node n3"></div>
        <div class="orphan o1"></div>
        <div class="orphan o2"></div>
    </div>

    <script>
        document.getElementById('model').addEventListener('click', function() {
            this.classList.add('clicked');
        });
    </script>
</body>
</html>
