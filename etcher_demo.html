<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Etcher Demo</title>
<style>
  :root {
    --ink: #fff;
    --paper: #020203;
    --card-bg: #07070a;
    --cyan: #00e5ff;
  }
  body {
    background-color: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: var(--card-bg);
    padding: 30px 50px;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,229,255,0.05), inset 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
    width: 380px;
    height: 220px;
  }
  .title {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 400; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 5px; z-index: 10;
  }
  
  .interactive-area {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: flex-start;
    padding-left: 20px;
  }

  /* The Formula */
  .formula-reveal {
    position: absolute; left: 25px; top: 50%; transform: translateY(-50%);
    color: var(--cyan); 
    font-family: "Courier New", Courier, monospace; font-size: 22px; font-weight: bold;
    white-space: nowrap; overflow: hidden; width: 0;
    text-shadow: 0 0 10px var(--cyan);
    letter-spacing: 2px;
  }

  /* The Etcher Needle */
  #etcher-wrapper {
    position: absolute; left: 0px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; z-index: 5;
  }
  .orb {
    display: block; width: 100%; height: 100%;
    cursor: pointer; text-decoration: none; outline: none;
    transform-origin: 22px 38px; /* Tip of the needle */
  }
  .orb svg { overflow: visible; width: 100%; height: 100%; }

  /* Needle SVG */
  .needle-body {
    fill: #000; stroke: #fff; stroke-width: 1px;
    transition: stroke 0.3s, filter 0.3s;
  }
  .needle-core { fill: var(--cyan); opacity: 0.2; transition: 0.3s; }
  .scanner-beam {
    fill: none; stroke: var(--cyan); stroke-width: 1px; opacity: 0;
    stroke-dasharray: 4; animation: scan-line 1s linear infinite;
  }

  /* Idle */
  #etcher-body { animation: etcher-idle 3s ease-in-out infinite; }
  
  #etcher-wrapper:hover .needle-body { stroke: var(--cyan); filter: drop-shadow(0 0 5px var(--cyan)); }
  #etcher-wrapper:hover .needle-core { opacity: 1; filter: drop-shadow(0 0 8px var(--cyan)); }
  #etcher-wrapper:hover .scanner-beam { opacity: 0.5; }

  /* Writing Actions */
  .writing { pointer-events: none; }
  .writing .needle-core { opacity: 1; filter: drop-shadow(0 0 15px var(--cyan)); }
  .writing .scanner-beam { opacity: 0; }

  @keyframes etcher-idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes scan-line {
    0% { stroke-dashoffset: 8; }
    100% { stroke-dashoffset: 0; }
  }

  /* Robotic Etching Path */
  @keyframes robotic-etch {
    0% { transform: translate(0, 0); }
    /* Sharp, mechanical movements synced with the text reveal */
    5% { transform: translate(15px, -15px); }
    10% { transform: translate(15px, 15px); }
    15% { transform: translate(30px, 0px); }
    25% { transform: translate(60px, -10px); }
    35% { transform: translate(90px, 10px); }
    45% { transform: translate(120px, 0); }
    55% { transform: translate(160px, -15px); }
    65% { transform: translate(200px, 15px); }
    75% { transform: translate(240px, 0px); }
    85% { transform: translate(270px, -10px); }
    95% { transform: translate(295px, 0px); }
    100% { transform: translate(295px, 0px); }
  }
  @keyframes etcher-vanish {
    0% { transform: translate(295px, 0px) scale(1); opacity: 1; }
    20% { transform: translate(295px, -30px) scale(1.2); opacity: 1; }
    100% { transform: translate(295px, -300px) scale(0.1); opacity: 0; }
  }

  .hint { position: absolute; bottom: 15px; right: 20px; font-size: 10px; color: #444; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; }
  .reset-btn { position: absolute; top: 15px; right: 15px; background: transparent; color: #666; border: 1px solid #333; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; text-transform: uppercase; transition: 0.3s; z-index: 10; }
  .reset-btn:hover { color: var(--cyan); border-color: var(--cyan); }
</style>
</head>
<body>

  <div class="card" id="etcher-card">
    <button class="reset-btn" onclick="resetEtcher()">Reset</button>
    <h1 class="title">Writing</h1>
    
    <div class="interactive-area">
      <div class="formula-reveal" id="formula">∑(3Δt, 30λ, ∫ds, r_s) = t_0</div>
      
      <div id="etcher-wrapper" onclick="triggerEtcher();">
        <a class="orb" id="etcher-orb" href="#" title="Fabricate Formula" onclick="return false;">
          <svg viewBox="0 0 44 44">
            <g id="etcher-body">
              <polygon class="needle-body" points="20,10 24,10 26,20 22,40 18,20" />
              <polygon class="needle-core" points="21,12 23,12 24,20 22,35 20,20" />
              <path class="scanner-beam" d="M 22,40 L 10,60 M 22,40 L 34,60" />
            </g>
          </svg>
        </a>
      </div>
    </div>
    
    <div class="hint">Click to fabricate</div>
  </div>

  <script>
    let isFabricating = false;

    function triggerEtcher() {
      if (isFabricating) return;
      isFabricating = true;

      const wrapper = document.getElementById('etcher-wrapper');
      const body = document.getElementById('etcher-body');
      const formula = document.getElementById('formula');
      
      wrapper.classList.add('writing');
      
      // The text is slowly exposed like it's being printed
      formula.style.transition = 'width 2.5s steps(30, end)';
      formula.style.width = '300px';
      
      // The wrapper moves in sharp, robotic zig-zags to simulate etching
      wrapper.style.animation = 'robotic-etch 2.5s linear forwards';
      
      // After it finishes writing, it shoots upward into hyperspace
      setTimeout(() => {
         wrapper.style.animation = 'etcher-vanish 0.6s cubic-bezier(0.9, 0, 0.1, 1) forwards';
      }, 2600);
    }

    function resetEtcher() {
      isFabricating = false;
      const wrapper = document.getElementById('etcher-wrapper');
      const formula = document.getElementById('formula');
      
      wrapper.classList.remove('writing');
      wrapper.style.animation = 'none';
      formula.style.transition = 'none';
      formula.style.width = '0px';
    }
  </script>
</body>
</html>
