<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .container { position: relative; cursor: pointer; }
  canvas { display: block; }
  .label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 1px; color: #8b949e; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="container" id="container">
  <canvas id="simCanvas" width="400" height="400"></canvas>
  <div class="label">Viterbi Decoder</div>
</div>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const COLOR = '#D35400';
let state = 'idle';
let particles = [];

document.getElementById('container').addEventListener('click', () => {
  if(state === 'idle') {
    state = 'clicked';
    for(let i=0; i<400; i++) {
       particles.push({
         x: 200 + (Math.random()-0.5)*100, y: 200 + (Math.random()-0.5)*100,
         vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30,
         life: 1
       });
    }
  }
});

let trellis = [];
for(let c=0; c<6; c++) {
  let col = [];
  for(let r=0; r<4; r++) col.push({x: 70 + c*52, y: 120 + r*50});
  trellis.push(col);
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  
  if (state === 'idle') {
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#30363d';
    for(let c=0; c<5; c++) {
      for(let r1=0; r1<4; r1++) {
        for(let r2=0; r2<4; r2++) {
          ctx.beginPath();
          ctx.moveTo(trellis[c][r1].x, trellis[c][r1].y);
          ctx.lineTo(trellis[c+1][r2].x, trellis[c+1][r2].y);
          ctx.stroke();
        }
      }
    }
    
    let path = [1, 2, 0, 1, 3, 2];
    ctx.lineWidth = 3;
    ctx.strokeStyle = COLOR;
    ctx.shadowBlur = 10;
    ctx.shadowColor = COLOR;
    ctx.beginPath();
    ctx.moveTo(trellis[0][path[0]].x, trellis[0][path[0]].y);
    for(let c=1; c<6; c++) {
      ctx.lineTo(trellis[c][path[c]].x, trellis[c][path[c]].y);
    }
    ctx.stroke();
    
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    for(let c=0; c<6; c++) {
      for(let r=0; r<4; r++) {
        ctx.beginPath(); ctx.arc(trellis[c][r].x, trellis[c][r].y, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  } else {
    ctx.fillStyle = '#fff';
    for(let p of particles) {
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life > 0) {
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
