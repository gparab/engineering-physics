<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
  .container { position: relative; width: 60px; height: 60px; cursor: pointer; }
  .boundary { position: absolute; width: 2px; height: 80px; background: #666; top: -10px; left: 29px; transform: rotate(30deg); }
  .void { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #d35400; box-shadow: 0 0 5px #d35400; left: 28px;}
  .arrow { position: absolute; color: #aaa; font-size: 10px; font-weight: bold; }
  #a-left { top: 25px; left: 0; transform: rotate(180deg); }
  #a-right { top: 25px; right: 0; }
  
  #crack-screen { position: absolute; width: 100vw; height: 100vh; top: 0; left: 0; pointer-events: none; display: none; }
  .crack-half { position: absolute; width: 100%; height: 100%; background: #111; }
  #crack-left { clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: bottom left; }
  #crack-right { clip-path: polygon(100% 0, 100% 100%, 0 100%); transform-origin: top right; }
  .crack-line { position: absolute; width: 142%; height: 2px; background: #d35400; top: 50%; left: -21%; transform: rotate(-45deg); opacity: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="crack-screen">
    <div class="crack-half" id="crack-left"></div>
    <div class="crack-half" id="crack-right"></div>
    <div class="crack-line"></div>
</div>
<div class="container" id="container">
    <div class="boundary"></div>
    <div class="void" style="top: 10px;"></div>
    <div class="void" style="top: 25px;"></div>
    <div class="void" style="top: 40px;"></div>
    <div class="void" style="top: 55px;"></div>
    <div class="arrow" id="a-left">➔</div>
    <div class="arrow" id="a-right">➔</div>
</div>
<script>
  let tl = gsap.timeline({repeat: -1, yoyo: true});
  tl.to('.void', {scaleX: 1.5, scaleY: 0.8, duration: 1.5, ease: "sine.inOut"}, 0)
    .to('.boundary', {opacity: 0.7, duration: 1.5}, 0);
  
  let clicked = false;
  document.getElementById('container').addEventListener('click', () => {
      if(clicked) return;
      clicked = true;
      tl.kill();
      
      gsap.to('.void', {
          scaleY: 6,
          scaleX: 0.5,
          duration: 0.4,
          ease: "power2.in",
          onComplete: () => {
              document.body.style.backgroundColor = '#000';
              document.getElementById('container').style.display = 'none';
              document.getElementById('crack-screen').style.display = 'block';
              
              let crackTl = gsap.timeline();
              crackTl.to('.crack-line', {opacity: 1, duration: 0.1})
                     .to('#crack-left', {x: "-10vw", y: "10vh", rotation: -5, duration: 1, ease: "power3.out"}, 0.1)
                     .to('#crack-right', {x: "10vw", y: "-10vh", rotation: 5, duration: 1, ease: "power3.out"}, 0.1)
                     .to('.crack-line', {opacity: 0, duration: 0.5}, 0.5);
          }
      });
  });
</script>
</body>
</html>
