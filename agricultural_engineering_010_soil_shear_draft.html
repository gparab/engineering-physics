<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Shear Draft</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model">
        <svg width="40" height="40" viewBox="0 0 40 40" overflow="visible">
            <rect x="4" y="20" width="32" height="16" fill="#8B4513" />
            <path class="bulge" d="M12,20 Q16,16 20,20 Z" fill="#8B4513" />
            <line x1="4" y1="28" x2="16" y2="28" stroke="#5c2e0c" stroke-width="1" stroke-dasharray="2,1"/>
            
            <g class="tine">
                <line x1="26" y1="8" x2="26" y2="28" stroke="#4A4A4A" stroke-width="3"/>
                <path d="M24.5,28 L27.5,28 L24,32 Z" fill="#4A4A4A"/>
            </g>
        </svg>
    </div>
    <script>
        const tl = gsap.timeline({ repeat: -1 });
        tl.fromTo('.tine', { x: 8 }, { x: -12, duration: 2, ease: "none" }, 0)
          .fromTo('.bulge', { x: 8 }, { x: -12, duration: 2, ease: "none" }, 0);
          
        document.getElementById('model').addEventListener('click', () => {
            gsap.killTweensOf('*');
            gsap.set('.bulge', { display: 'none' }); 
            
            gsap.to('.tine', {
                rotation: 720,
                transformOrigin: "50% 100%",
                x: window.innerWidth,
                y: -window.innerHeight/2,
                duration: 1,
                ease: "power2.in"
            });
        });
    </script>
</body>
</html>
