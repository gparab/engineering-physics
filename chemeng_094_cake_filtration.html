<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Filtration</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; cursor: pointer; overflow: hidden; }
        #container { width: 50px; height: 70px; position: relative; border-left: 2px solid #555; border-right: 2px solid #555; }
        .mesh { position: absolute; bottom: 20px; width: 100%; height: 4px; background: repeating-linear-gradient(90deg, #ccc, #ccc 2px, transparent 2px, transparent 4px); }
        .cake-container { position: absolute; bottom: 24px; width: 100%; height: 30px; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; overflow: hidden; }
        .solid { width: 6px; height: 6px; background-color: #8B4513; border-radius: 2px; margin: 1px; opacity: 0; }
        .filtrate-drop { position: absolute; width: 4px; height: 6px; background-color: rgba(255,255,255,0.7); border-radius: 50%; bottom: 15px; }
    </style>
</head>
<body>
    <div id="container">
        <div class="mesh" id="mesh"></div>
        <div class="cake-container" id="cake"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('container');
        const cakeContainer = document.getElementById('cake');
        const solids = [];

        // Generate solids in cake
        for (let i = 0; i < 24; i++) {
            let s = document.createElement('div');
            s.className = 'solid';
            cakeContainer.appendChild(s);
            solids.push(s);
        }

        // Idle animation: particles accumulating
        let cakeTl = gsap.timeline({ repeat: -1 });
        cakeTl.to(solids, {
            opacity: 1,
            yFrom: -30,
            duration: 0.1,
            stagger: 0.2
        });

        // Clear filtrate dripping
        function createDrop() {
            let drop = document.createElement('div');
            drop.className = 'filtrate-drop';
            drop.style.left = (Math.random() * 40 + 5) + 'px';
            container.appendChild(drop);
            
            gsap.to(drop, {
                y: 20,
                scaleY: 1.5,
                opacity: 0,
                duration: 0.8,
                ease: "power1.in",
                onComplete: () => drop.remove()
            });
        }
        
        let dropInterval = setInterval(createDrop, 400);

        let clicked = false;
        document.body.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;

            clearInterval(dropInterval);
            cakeTl.kill();
            
            // Backwash pulse blows entire cake upwards
            gsap.to(solids, {
                y: -window.innerHeight,
                x: () => (Math.random() - 0.5) * 300,
                rotation: () => (Math.random() - 0.5) * 720,
                opacity: 0,
                duration: 1,
                ease: "power3.out",
                stagger: {
                    amount: 0.1,
                    from: "bottom"
                }
            });
            
            // Mesh shakes
            gsap.to('#mesh', { y: -5, duration: 0.1, yoyo: true, repeat: 3 });
        });
    </script>
</body>
</html>
