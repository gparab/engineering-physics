<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #scene { position: relative; width: 40px; height: 40px; cursor: pointer; }
  .atom { position: absolute; width: 4px; height: 4px; background: #e74c3c; border-radius: 50%; transform: translate(-50%, -50%); }
  .core { position: absolute; width: 8px; height: 8px; background: rgba(231, 76, 60, 0.4); border-radius: 50%; transform: translate(-50%, -50%); filter: blur(2px); pointer-events: none;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="scene"></div>
<script>
  const scene = document.getElementById('scene');
  const spacing = 8;
  const atoms = [];
  
  for(let r=0; r<5; r++) {
    const isTop = r < 2;
    const colCount = isTop ? 6 : 5;
    for(let c=0; c<colCount; c++) {
      const atom = document.createElement('div');
      atom.className = 'atom';
      let x = c * spacing;
      let y = r * spacing;
      if (!isTop) {
        x += spacing/2;
      }
      
      const dx = x - (2.5 * spacing);
      const dy = y - (1.5 * spacing);
      const dist = Math.hypot(dx, dy);
      if (dist > 0.1) {
        x += (dx/dist) * (2/dist);
      }

      atom.style.left = x + 'px';
      atom.style.top = y + 'px';
      scene.appendChild(atom);
      atoms.push({el: atom, r, c, x, y, isTop});
    }
  }

  const core = document.createElement('div');
  core.className = 'core';
  core.style.left = (2.5 * spacing) + 'px';
  core.style.top = (1.5 * spacing) + 'px';
  scene.appendChild(core);

  atoms.forEach(a => {
    gsap.to(a.el, { x: "+=1", y: "+=1", duration: 1+Math.random(), yoyo: true, repeat: -1, ease: "sine.inOut" });
  });
  gsap.to(core, { scale: 1.5, opacity: 0.8, duration: 1, yoyo: true, repeat: -1, ease: "sine.inOut" });

  scene.addEventListener('click', () => {
    gsap.killTweensOf(".atom");
    gsap.killTweensOf(core);
    core.style.display = 'none';

    atoms.forEach(a => {
      if (a.isTop && a.c >= 2) {
        gsap.to(a.el, { x: `+=${window.innerWidth}`, duration: 2, ease: "power2.in" });
      } else {
        gsap.to(a.el, { x: a.isTop ? a.x - spacing/2 : a.x, y: a.y, duration: 1, ease: "power2.out", onComplete: () => {
          gsap.to(a.el, { opacity: 0, duration: 1, delay: 1 });
        }});
      }
    });
  });
</script>
</body>
</html>
