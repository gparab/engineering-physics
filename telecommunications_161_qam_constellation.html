<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .container { position: relative; cursor: pointer; }
  canvas { display: block; }
  .label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 1px; color: #8b949e; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="container" id="container">
  <canvas id="simCanvas" width="400" height="400"></canvas>
  <div class="label">QAM Constellation</div>
</div>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let points = [];
const GRID_SIZE = 4;
const SPACING = 40;
const COLOR = '#3498DB';
const CENTER_X = 200, CENTER_Y = 200;

for(let i=0; i<GRID_SIZE; i++) {
  for(let j=0; j<GRID_SIZE; j++) {
    points.push({ x: CENTER_X + (i - 1.5) * SPACING, y: CENTER_Y + (j - 1.5) * SPACING });
  }
}

let activePoint = points[0];
let state = 'idle';
let particles = [];

setInterval(() => {
  if (state === 'idle') activePoint = points[Math.floor(Math.random() * points.length)];
}, 500);

document.getElementById('container').addEventListener('click', () => {
  if (state !== 'idle') return;
  state = 'clicked';
  for(let i=0; i<1000; i++) {
    particles.push({
      x: activePoint.x, y: activePoint.y,
      vx: (Math.random() - 0.5) * 50, vy: (Math.random() - 0.5) * 50,
      life: 1.0, decay: 0.01 + Math.random() * 0.02
    });
  }
});

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  if (state === 'idle') {
    ctx.fillStyle = '#30363d';
    for(let p of points) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = COLOR;
    ctx.shadowBlur = 10;
    ctx.shadowColor = COLOR;
    ctx.beginPath(); ctx.arc(activePoint.x, activePoint.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (state === 'clicked') {
    ctx.fillStyle = COLOR;
    for(let p of particles) {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life > 0) {
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1.0;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
