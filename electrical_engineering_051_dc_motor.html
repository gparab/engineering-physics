<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>51. DC Motor</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  .container {
    position: relative;
    width: 250px;
    height: 150px;
    cursor: pointer;
    perspective: 600px;
  }
  
  .stator {
    position: absolute;
    width: 140px;
    height: 140px;
    left: 55px;
    top: 5px;
    border: 10px solid #222;
    border-radius: 50%;
    box-sizing: border-box;
    clip-path: polygon(0% 20%, 100% 20%, 100% 80%, 0% 80%);
  }
  
  .rotor-group {
    position: absolute;
    width: 100px;
    height: 100px;
    left: 75px;
    top: 25px;
    transform-style: preserve-3d;
  }
  
  .armature {
    position: absolute;
    width: 80px;
    height: 30px;
    left: 10px;
    top: 35px;
    background: #C0392B;
    border-radius: 5px;
    transform-style: preserve-3d;
    box-shadow: 0 0 10px rgba(192, 57, 43, 0.5);
  }
  
  .commutator {
    position: absolute;
    width: 20px;
    height: 20px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    background: #f1c40f;
    box-sizing: border-box;
    /* split ring look */
    background: linear-gradient(90deg, #f39c12 45%, #000 45%, #000 55%, #f39c12 55%);
  }
  
  .brush {
    position: absolute;
    width: 10px;
    height: 8px;
    background: #7f8c8d;
    top: 46px;
  }
  .brush.left { left: 30px; }
  .brush.right { left: 60px; }
  
  .spark {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #f1c40f;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  
  .straight-wire {
    position: absolute;
    width: 0px;
    height: 4px;
    background: #C0392B;
    left: 125px;
    top: 73px;
    opacity: 0;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #C0392B;
  }
  
  .surge {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, #f39c12 0%, transparent 60%);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div class="container" id="motor">
  <div class="stator"></div>
  
  <div class="brush left"></div>
  <div class="brush right"></div>
  
  <div class="surge" id="surge"></div>
  
  <div class="rotor-group" id="rotor">
    <div class="armature" id="armature"></div>
    <div class="commutator" id="commutator"></div>
  </div>
  
  <div class="straight-wire" id="straightWire"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  // Idle Animation
  let rotation = { angle: 0 };
  
  const idleTween = gsap.to(rotation, {
    angle: 360,
    duration: 1,
    repeat: -1,
    ease: "none",
    onUpdate: () => {
      gsap.set("#rotor", { rotationZ: rotation.angle });
      
      // Sparks
      if (Math.random() > 0.8) {
        createSpark();
      }
    }
  });
  
  function createSpark() {
    const isLeft = Math.random() > 0.5;
    const spark = document.createElement('div');
    spark.className = 'spark';
    document.getElementById('motor').appendChild(spark);
    
    const startX = isLeft ? 40 : 60;
    const startY = 46 + Math.random() * 8;
    
    gsap.set(spark, { x: startX + 75, y: startY + 25, opacity: 1 });
    
    gsap.to(spark, {
      x: startX + 75 + (isLeft ? -1 : 1) * (10 + Math.random() * 20),
      y: startY + 25 + (Math.random() * 30 - 15),
      opacity: 0,
      duration: 0.2 + Math.random() * 0.2,
      ease: "power1.out",
      onComplete: () => spark.remove()
    });
  }

  // Click Animation
  const container = document.getElementById('motor');
  let clicked = false;

  container.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    
    idleTween.kill();
    
    const clickTl = gsap.timeline();
    
    // Back-EMF Surge
    clickTl.to("#surge", {
      opacity: 1,
      scale: 2,
      duration: 0.1
    })
    .to("#surge", {
      opacity: 0,
      duration: 0.4
    }, "+=0.1")
    
    // Reverse violently and unwind
    .to(rotation, {
      angle: rotation.angle - 720,
      duration: 0.6,
      ease: "power2.in",
      onUpdate: () => {
        gsap.set("#rotor", { rotationZ: rotation.angle });
      }
    }, 0)
    
    // Unwind into straight wire
    .to("#rotor, .stator, .brush", {
      opacity: 0,
      duration: 0.1
    }, 0.5)
    .to("#straightWire", {
      opacity: 1,
      width: "400px",
      duration: 0.3,
      ease: "power2.out"
    }, 0.5)
    
    // Wire vanishes
    .to("#straightWire", {
      scaleY: 0,
      opacity: 0,
      duration: 0.3,
      ease: "power1.in"
    }, "+=0.2");
  });
</script>
</body>
</html>
