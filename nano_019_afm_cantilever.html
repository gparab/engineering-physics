<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFM Cantilever</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    cursor: pointer;
    width: 100px;
    height: 60px;
  }
  .surface {
    position: absolute;
    bottom: 0; left: -50vw;
    width: 200vw; height: 10px;
    background: repeating-linear-gradient(45deg, #bdc3c7, #bdc3c7 5px, #95a5a6 5px, #95a5a6 10px);
  }
  .cantilever-base {
    position: absolute;
    right: 0; top: 10px;
    width: 20px; height: 10px;
    background: #34495e;
  }
  .cantilever-beam {
    position: absolute;
    right: 20px; top: 12px;
    width: 60px; height: 4px;
    background: #2980b9;
    transform-origin: right center;
  }
  .tip {
    position: absolute;
    left: 0; top: 4px;
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 10px solid #2980b9;
  }
  .laser-in {
    position: absolute;
    width: 2px; height: 50px;
    background: #e74c3c;
    top: -40px; right: 20px;
    transform: rotate(30deg);
    opacity: 0.7;
  }
  .laser-out {
    position: absolute;
    width: 2px; height: 50px;
    background: #e74c3c;
    top: -40px; right: 60px;
    transform: rotate(-30deg);
    opacity: 0.7;
    transform-origin: bottom center;
  }
  .topo-map {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at 50% 50%, #2980b9 0%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 10;
  }
  .scan-line {
    position: fixed;
    top: 0; left: 0;
    width: 2px; height: 100vh;
    background: #2980b9;
    box-shadow: 0 0 10px #2980b9;
    opacity: 0;
    z-index: 9;
  }
</style>
</head>
<body>
<div class="topo-map" id="topoMap"></div>
<div class="scan-line" id="scanLine"></div>
<div class="surface"></div>
<div class="container" id="model">
  <div class="cantilever-base"></div>
  <div class="cantilever-beam" id="beam">
    <div class="laser-in"></div>
    <div class="laser-out" id="laserOut"></div>
    <div class="tip"></div>
  </div>
</div>
<script>
  const beam = document.getElementById('beam');
  const laserOut = document.getElementById('laserOut');
  const model = document.getElementById('model');

  // Tapping mode idle
  const idleTl = gsap.timeline({repeat: -1});
  idleTl.to(beam, { rotation: 5, duration: 0.05, ease: "sine.inOut", yoyo: true, repeat: 1 })
        .to(laserOut, { rotation: -35, duration: 0.05, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

  let isAnimating = false;
  model.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    idleTl.kill();
    
    const tl = gsap.timeline();
    // Engage contact mode
    tl.to(beam, { rotation: 8, duration: 0.2 })
      .to(laserOut, { rotation: -40, duration: 0.2 }, 0)
      // Drag across screen
      .to('#model', { x: "-120vw", duration: 1.5, ease: "power2.inOut" })
      .to(beam, { rotation: 2, duration: 0.1, yoyo: true, repeat: 14 }, 0.2) // bumpiness
      .to(laserOut, { rotation: -25, duration: 0.1, yoyo: true, repeat: 14 }, 0.2)
      // Render topology map
      .to('#scanLine', { opacity: 1, duration: 0.1 }, 0.2)
      .to('#scanLine', { x: "100vw", duration: 1.3, ease: "power2.inOut" }, 0.2)
      .to('#topoMap', { opacity: 0.8, duration: 0.5 }, 1.0)
      .to(['#scanLine', '#topoMap'], { opacity: 0, duration: 1 }, 1.5);
  });
</script>
</body>
</html>
