<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymerization</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; cursor: pointer; overflow: hidden; }
        #container { width: 100px; height: 100px; position: relative; }
        .monomer { position: absolute; width: 14px; height: 16px; background-color: #9370DB; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); transform-origin: center; display: flex; justify-content: center; align-items: center; }
        .monomer::after { content: ''; width: 6px; height: 8px; background-color: #1a1a1a; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        .active-site { position: absolute; width: 4px; height: 4px; background-color: #ff3366; border-radius: 50%; box-shadow: 0 0 5px #ff3366; top: -2px; left: 5px; opacity: 0; }
    </style>
</head>
<body>
    <div id="container">
        <!-- Main chain will be generated here -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('container');
        const chain = [];
        
        // Initial chain monomer
        let baseMonomer = document.createElement('div');
        baseMonomer.className = 'monomer';
        baseMonomer.style.left = '43px';
        baseMonomer.style.top = '70px';
        container.appendChild(baseMonomer);
        chain.push(baseMonomer);

        let activeSite = document.createElement('div');
        activeSite.className = 'active-site';
        baseMonomer.appendChild(activeSite);
        gsap.set(activeSite, { opacity: 1 });

        // Add new monomers snapping onto chain end
        let addMonomerTl = gsap.timeline({ repeat: -1 });
        
        for (let i = 1; i <= 4; i++) {
            let newMon = document.createElement('div');
            newMon.className = 'monomer';
            container.appendChild(newMon);
            chain.push(newMon);
            
            let startX = 43 + (Math.random() - 0.5) * 60;
            let startY = 70 - i * 14 + (Math.random() - 0.5) * 20;
            
            // final pos relative to container
            let finalX = 43 + (i%2===0 ? 0 : 0); 
            // just stack them with slight rotation
            let finalY = 70 - i * 13;
            let rot = (i % 2 === 0 ? 15 : -15);
            
            gsap.set(newMon, { x: startX, y: startY, opacity: 0, scale: 0.5 });
            
            addMonomerTl.to(newMon, {
                x: 43,
                y: finalY,
                rotation: rot,
                opacity: 1,
                scale: 1,
                duration: 0.5,
                ease: "back.out(1.7)"
            });
            
            // move active site to new monomer
            addMonomerTl.call(() => {
                newMon.appendChild(activeSite);
            });
        }

        // after all monomers snap, fade them out except base to restart loop visual
        addMonomerTl.to(chain.slice(1), { opacity: 0, duration: 0.2, delay: 0.5 });
        addMonomerTl.call(() => { baseMonomer.appendChild(activeSite); });


        let clicked = false;
        document.body.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;

            addMonomerTl.kill();
            gsap.to(activeSite, { opacity: 0, duration: 0.1 });
            gsap.to(chain, { opacity: 1, duration: 0.1 }); // show all

            // Chain terminated; polymer coils into random walk sphere, shrinks away
            gsap.to(chain, {
                x: () => 43 + (Math.random() - 0.5) * 30,
                y: () => 40 + (Math.random() - 0.5) * 30,
                rotation: () => Math.random() * 360,
                duration: 0.5,
                ease: "power2.inOut"
            });
            
            gsap.to(chain, {
                scale: 0,
                x: 43,
                y: 40,
                opacity: 0,
                duration: 0.8,
                delay: 0.6,
                ease: "power3.in"
            });
        });
    </script>
</body>
</html>
