<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Consolidation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model">
        <svg width="40" height="40" viewBox="0 0 40 40" overflow="visible">
            <g class="matrix">
                <circle class="grain" cx="16" cy="24" r="3" fill="#8B4513"/>
                <circle class="grain" cx="24" cy="24" r="3" fill="#8B4513"/>
                <circle class="grain" cx="20" cy="28" r="3" fill="#8B4513"/>
                <circle class="grain" cx="18" cy="20" r="3" fill="#8B4513"/>
                <circle class="grain" cx="22" cy="20" r="3" fill="#8B4513"/>
                <circle class="water" cx="20" cy="18" r="1.5" fill="#007AFF" opacity="0" />
            </g>
            <line class="plate" x1="12" y1="16" x2="28" y2="16" stroke="#444" stroke-width="1"/>
        </svg>
    </div>
    <script>
        const tl = gsap.timeline({ repeat: -1, yoyo: true });
        tl.to('.plate', { y: 2, duration: 1.5, ease: "sine.inOut" }, 0)
          .to('.grain', { y: 1, duration: 1.5, ease: "sine.inOut" }, 0)
          .to('.water', { y: -4, opacity: 0.8, duration: 1.5, ease: "power1.out" }, 0);

        document.getElementById('model').addEventListener('click', () => {
            gsap.killTweensOf('*');
            gsap.to('.plate, .water', { opacity: 0, duration: 0.2 });
            gsap.to('.grain', {
                y: window.innerHeight,
                x: () => (Math.random() - 0.5) * 100,
                rotation: () => Math.random() * 360,
                duration: 1,
                ease: "power2.in",
                stagger: 0.05
            });
        });
    </script>
</body>
</html>
