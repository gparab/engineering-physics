<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Solubilization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model">
        <svg width="40" height="40" viewBox="0 0 40 40" overflow="visible">
            <rect x="10" y="4" width="20" height="32" fill="rgba(224, 242, 254, 0.2)" rx="2"/>
            <rect x="16" y="32" width="8" height="4" fill="#888" rx="1"/>
            
            <circle class="bub b1" cx="20" cy="30" r="2.5" fill="#E0F2FE" />
            <circle class="bub b2" cx="16" cy="30" r="2" fill="#E0F2FE" />
            <circle class="bub b3" cx="24" cy="30" r="1.5" fill="#E0F2FE" />
        </svg>
    </div>
    <script>
        function animateBubble(sel, delay, xOffset) {
            gsap.fromTo(sel, 
                { y: 0, x: 0, scale: 1, opacity: 1 },
                { y: -26, x: xOffset, scale: 0, opacity: 0, duration: 2, delay: delay, repeat: -1, ease: "power1.inOut" }
            );
        }
        animateBubble('.b1', 0, 2);
        animateBubble('.b2', 0.6, -3);
        animateBubble('.b3', 1.2, 1);

        document.getElementById('model').addEventListener('click', () => {
            gsap.killTweensOf('*');
            const svg = document.querySelector('svg');
            const boilGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            for(let i=0; i<60; i++) {
                let c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", 10 + Math.random()*20);
                c.setAttribute("cy", 4 + Math.random()*32);
                c.setAttribute("r", Math.random() * 1.5);
                c.setAttribute("fill", "#E0F2FE");
                c.setAttribute("class", "boil-bub");
                boilGroup.appendChild(c);
            }
            svg.appendChild(boilGroup);
            gsap.set('.bub, rect', { display: 'none' });
            
            gsap.to('.boil-bub', {
                r: () => Math.random() * 10 + 5,
                x: () => (Math.random() - 0.5) * window.innerWidth,
                y: () => (Math.random() - 0.5) * window.innerHeight,
                opacity: 0,
                duration: 1,
                ease: "expo.out",
                stagger: 0.01
            });
        });
    </script>
</body>
</html>
