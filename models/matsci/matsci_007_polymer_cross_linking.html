<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #scene { width: 40px; height: 40px; position: relative; cursor: pointer; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .chain { fill: none; stroke: #1abc9c; stroke-width: 2; stroke-linecap: round; }
  .crosslink { stroke: #16a085; stroke-width: 1.5; stroke-dasharray: 2; opacity: 0.5; }
  .shard { position: absolute; background: #1abc9c; width: 4px; height: 10px; opacity: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="scene">
  <svg>
    <path class="chain c1" d="M 0 10 Q 10 5, 20 10 T 40 10" />
    <path class="chain c2" d="M 0 30 Q 10 35, 20 30 T 40 30" />
    <line class="crosslink cl1" x1="10" y1="10" x2="10" y2="30" />
    <line class="crosslink cl2" x1="30" y1="10" x2="30" y2="30" />
  </svg>
</div>
<script>
  const idle = gsap.to(".chain", { y: (i) => i===0 ? 2 : -2, duration: 0.4, yoyo: true, repeat: -1, ease: "sine.inOut" });

  document.getElementById('scene').addEventListener('click', () => {
    idle.kill();
    const svg = document.querySelector('svg');
    for(let i=5; i<=35; i+=5) {
      if(i===10 || i===30) continue;
      const cl = document.createElementNS("http://www.w3.org/2000/svg", "line");
      cl.setAttribute("x1", i); cl.setAttribute("y1", 10);
      cl.setAttribute("x2", i); cl.setAttribute("y2", 30);
      cl.setAttribute("class", "crosslink");
      svg.appendChild(cl);
    }
    
    gsap.to(".crosslink", { opacity: 1, strokeDasharray: 0, duration: 0.5, onComplete: () => {
      svg.style.display = 'none';
      for(let i=0; i<20; i++){
        const shard = document.createElement('div');
        shard.className = 'shard';
        document.getElementById('scene').appendChild(shard);
        gsap.set(shard, { x: Math.random()*40, y: Math.random()*40, rotation: Math.random()*360, opacity: 1 });
        gsap.to(shard, { 
          y: "+=" + (window.innerHeight),
          x: "+=" + (Math.random()-0.5)*100,
          rotation: "+=" + (Math.random()*720),
          duration: 1 + Math.random(),
          ease: "power1.in"
        });
      }
    }});
  });
</script>
</body>
</html>
