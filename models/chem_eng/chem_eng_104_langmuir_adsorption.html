<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langmuir Adsorption Isotherm</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: grid;
            grid-template-columns: repeat(4, 8px);
            grid-template-rows: repeat(4, 8px);
        }

        .site {
            width: 8px;
            height: 8px;
            border: 1px solid rgba(64, 224, 208, 0.3);
            box-sizing: border-box;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .molecule {
            width: 4px;
            height: 4px;
            background-color: #40E0D0;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0);
        }
        
        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #40E0D0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <!-- 16 sites generated by JS -->
    </div>

    <script>
        const container = document.getElementById('model-container');
        const molecules = [];

        // Create grid
        for(let i=0; i<16; i++) {
            let site = document.createElement('div');
            site.className = 'site';
            let mol = document.createElement('div');
            mol.className = 'molecule';
            site.appendChild(mol);
            container.appendChild(site);
            molecules.push(mol);
        }
        
        let flash = document.createElement('div');
        flash.className = 'flash';
        container.appendChild(flash);

        // Idle Animation - random bind/release
        function bindRelease() {
            let idx = Math.floor(Math.random() * molecules.length);
            let mol = molecules[idx];
            let isBound = mol.style.opacity === '1';
            
            if(isBound) {
                gsap.to(mol, { scale: 0, opacity: 0, duration: 0.3 });
            } else {
                gsap.to(mol, { scale: 1, opacity: 1, duration: 0.3 });
            }
        }
        
        let idleInterval = setInterval(bindRelease, 200);

        // Click Animation
        container.addEventListener('click', () => {
            clearInterval(idleInterval);
            
            const clickTL = gsap.timeline();
            
            // Total saturation
            clickTL.to('.molecule', { scale: 1, opacity: 1, duration: 0.2 })
                   // Flash monolayer
                   .to(flash, { opacity: 0.8, duration: 0.1 })
                   .to(flash, { opacity: 0, duration: 0.2 })
                   // Desorb at once
                   .to('.molecule', {
                       y: () => -50 - Math.random() * 50,
                       x: () => (Math.random() - 0.5) * 100,
                       opacity: 0,
                       scale: 2,
                       duration: 0.6,
                       ease: "power2.out"
                   }, "+=0.1")
                   .to('.site', { borderColor: "transparent", duration: 0.2 }, "<")
                   .to(container, { display: 'none', duration: 0 });
        });
    </script>
</body>
</html>
