<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fick's Law of Diffusion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #00BFFF;
            border-radius: 50%;
            left: 18px;
            top: 18px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <!-- Particles generated by JS -->
    </div>

    <script>
        const container = document.getElementById('model-container');
        const numParticles = 30;
        const particles = [];

        for(let i=0; i<numParticles; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            container.appendChild(p);
            particles.push(p);
        }

        // Idle Animation - Brownian motion dispersing slightly
        const anims = [];
        particles.forEach(p => {
            function brownianStep() {
                // keeps them somewhat clustered
                let dist = Math.random() * 15;
                let angle = Math.random() * Math.PI * 2;
                let tx = Math.cos(angle) * dist;
                let ty = Math.sin(angle) * dist;
                
                let anim = gsap.to(p, {
                    x: tx,
                    y: ty,
                    duration: 0.5 + Math.random() * 0.5,
                    ease: "sine.inOut",
                    onComplete: brownianStep
                });
                anims.push(anim);
            }
            brownianStep();
        });

        // Click Animation
        container.addEventListener('click', () => {
            // Kill all idle tweens
            gsap.killTweensOf('.particle');
            
            // Scatter evenly across screen
            particles.forEach(p => {
                let tx = (Math.random() - 0.5) * window.innerWidth;
                let ty = (Math.random() - 0.5) * window.innerHeight;
                
                gsap.to(p, {
                    x: tx,
                    y: ty,
                    opacity: 0,
                    duration: 0.8 + Math.random() * 0.4,
                    ease: "power2.out"
                });
            });
            
            setTimeout(() => {
                container.style.display = 'none';
            }, 1500);
        });
    </script>
</body>
</html>
