<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear - Gas Centrifuge</title>
<style>
  body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; perspective: 400px; }
  #container { position: relative; width: 20px; height: 40px; cursor: pointer; transform-style: preserve-3d; }
  .rotor { position: absolute; width: 100%; height: 100%; border: 2px solid #4B0082; border-radius: 10px / 4px; box-sizing: border-box; }
  .particle { position: absolute; width: 2px; height: 2px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .u235 { background: #00ffff; box-shadow: 0 0 2px #00ffff; }
  .u238 { background: #ff00ff; box-shadow: 0 0 2px #ff00ff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="container">
  <div class="rotor" id="rotor"></div>
</div>
<script>
  const container = document.getElementById('container');
  const particles = [];
  
  for(let i=0; i<30; i++) {
    let p = document.createElement('div');
    let is235 = i % 3 === 0;
    p.className = 'particle ' + (is235 ? 'u235' : 'u238');
    container.appendChild(p);
    
    // Idle positioning: 235 near center, 238 near edge
    let r = is235 ? 2 + Math.random()*2 : 6 + Math.random()*2;
    let theta = Math.random() * Math.PI * 2;
    let y = (Math.random() - 0.5) * 30;
    
    particles.push({el: p, r, theta, y, is235});
  }

  let spinning = true;
  let angle = 0;
  
  function animate() {
    if(!spinning) return;
    angle += 0.2;
    
    particles.forEach(p => {
      let currentTheta = p.theta + angle;
      let x = p.r * Math.cos(currentTheta);
      let z = p.r * Math.sin(currentTheta);
      // simulate 3D cylinder
      p.el.style.transform = `translate3d(${x}px, ${p.y}px, ${z}px)`;
    });
    
    requestAnimationFrame(animate);
  }
  animate();

  container.addEventListener('click', () => {
    spinning = false;
    
    // Rotor halts, field collapses
    gsap.to('#rotor', {borderColor: '#222', duration: 0.5});
    
    // Remix and fade across screen
    particles.forEach(p => {
      gsap.to(p.el, {
        x: (Math.random() - 0.5) * window.innerWidth * 0.8,
        y: (Math.random() - 0.5) * window.innerHeight * 0.8,
        z: (Math.random() - 0.5) * 500,
        opacity: 0,
        duration: 1.5 + Math.random(),
        ease: "power3.out"
      });
    });
    
    gsap.to(container, {opacity: 0, duration: 2, delay: 0.5});
  });
</script>
</body>
</html>
