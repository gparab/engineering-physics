<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 30px;
    height: 20px;
    cursor: pointer;
  }
  .stream-tube {
    position: absolute;
    width: 100%;
    height: 100%;
    border-top: 1px dashed rgba(135, 206, 235, 0.4);
    border-bottom: 1px dashed rgba(135, 206, 235, 0.4);
    border-radius: 50% / 10%;
    animation: expand 3s infinite alternate ease-in-out;
  }
  .rotor {
    position: absolute;
    left: 8px;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    animation: spin 1s linear infinite;
  }
  .blade {
    position: absolute;
    width: 2px;
    height: 7px;
    background: #87CEEB;
    left: 6px;
    bottom: 7px;
    transform-origin: 50% 100%;
    border-radius: 1px;
  }
  .blade:nth-child(2) { transform: rotate(120deg); }
  .blade:nth-child(3) { transform: rotate(240deg); }
  .hub {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    left: 5px;
    top: 5px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes expand {
    0% { transform: scaleY(1); clip-path: polygon(0 20%, 100% 0%, 100% 100%, 0% 80%); }
    100% { transform: scaleY(1.3); clip-path: polygon(0 30%, 100% 0%, 100% 100%, 0% 70%); }
  }
  
  .wind-particle {
    position: absolute;
    width: 6px;
    height: 1px;
    background: rgba(135, 206, 235, 0.8);
    left: -10px;
    animation: wind 1.5s infinite linear;
  }
  @keyframes wind {
    100% { transform: translateX(40px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="container" id="model">
  <div class="stream-tube"></div>
  <div class="rotor" id="rotor">
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="hub"></div>
  </div>
  <div class="wind-particle" style="top: 4px; animation-delay: 0s;"></div>
  <div class="wind-particle" style="top: 10px; animation-delay: 0.5s;"></div>
  <div class="wind-particle" style="top: 16px; animation-delay: 0.2s;"></div>
</div>
<script>
  document.getElementById('model').onclick = function() {
    this.style.pointerEvents = 'none';
    let tube = this.querySelector('.stream-tube');
    tube.style.animation = 'none';
    tube.style.transition = 'all 0.4s';
    tube.style.opacity = '0';
    
    let rotor = document.getElementById('rotor');
    rotor.style.animation = 'none';
    
    let blades = document.querySelectorAll('.blade');
    blades.forEach((b, i) => {
      b.style.transition = 'all 1.5s cubic-bezier(0.5, 0, 0.2, 1)';
      let angle = i * 120;
      setTimeout(() => {
        // Spiral downwind (right)
        b.style.transform = `rotate(${angle + 720}deg) translate(200px, ${Math.sin(angle)*50}px) scale(0)`;
        b.style.opacity = '0';
      }, 50);
    });
    
    this.querySelector('.hub').style.transition = 'all 1s';
    this.querySelector('.hub').style.transform = 'translateX(250px) scale(0)';
    
    document.querySelectorAll('.wind-particle').forEach(p => {
      p.style.animationDuration = '0.2s';
      p.style.width = '20px';
      setTimeout(() => p.style.opacity = '0', 300);
    });
  };
</script>
</body>
</html>
