<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 24px;
    height: 24px;
    cursor: pointer;
  }
  .electrode {
    position: absolute;
    width: 4px;
    height: 24px;
    background: #555;
  }
  .el-left { left: 0; }
  .el-right { right: 0; }
  
  .grid {
    position: absolute;
    left: 4px;
    width: 16px;
    height: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 1px;
  }
  .node {
    background: rgba(0, 250, 154, 0.3);
    border: 0.5px solid #00FA9A;
    box-sizing: border-box;
  }
  .pulse {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    box-shadow: 0 0 4px #00FA9A;
    border-radius: 50%;
    left: 4px;
    top: 10px;
    animation: navigate 3s infinite ease-in-out;
  }
  @keyframes navigate {
    0% { transform: translate(0, 0); }
    20% { transform: translate(4px, 4px); }
    40% { transform: translate(8px, 0); }
    60% { transform: translate(12px, -4px); }
    80% { transform: translate(16px, 0); }
    100% { transform: translate(16px, 0); opacity: 0;}
  }
</style>
</head>
<body>
<div class="container" id="model">
  <div class="electrode el-left"></div>
  <div class="electrode el-right"></div>
  <div class="grid" id="grid"></div>
  <div class="pulse" id="pulse"></div>
</div>
<script>
  let grid = document.getElementById('grid');
  for(let i=0; i<24; i++) {
    let d = document.createElement('div');
    d.className = 'node';
    grid.appendChild(d);
  }
  
  document.getElementById('model').onclick = function() {
    this.style.pointerEvents = 'none';
    document.getElementById('pulse').style.display = 'none';
    
    document.querySelectorAll('.electrode').forEach(el => {
      el.style.transition = 'opacity 0.2s';
      el.style.opacity = '0';
    });
    
    let nodes = document.querySelectorAll('.node');
    nodes.forEach((n, i) => {
      n.style.transition = 'all 1.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
      n.style.position = 'absolute';
      
      let col = i % 4;
      let row = Math.floor(i / 4);
      n.style.left = (col * 4) + 'px';
      n.style.top = (row * 4) + 'px';
      
      setTimeout(() => {
        let angle = Math.random() * Math.PI * 2;
        let dist = 100 + Math.random() * 200;
        let x = Math.cos(angle) * dist;
        let y = Math.sin(angle) * dist;
        n.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*360}deg)`;
        n.style.opacity = '0';
      }, 50);
    });
  };
</script>
</body>
</html>
