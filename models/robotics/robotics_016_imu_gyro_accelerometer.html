<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMU (Gyro & Accelerometer)</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #111;
    overflow: hidden;
    cursor: pointer;
    perspective: 800px;
  }
  .gimbal-container {
    width: 40px;
    height: 40px;
    position: relative;
    transform-style: preserve-3d;
  }
  .ring {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1.5px solid #DAA520;
    transform-style: preserve-3d;
  }
  .ring1 {
    width: 40px; height: 40px;
  }
  .ring2 {
    width: 32px; height: 32px;
    top: 4px; left: 4px;
    border-color: #e6b840;
  }
  .ring3 {
    width: 24px; height: 24px;
    top: 8px; left: 8px;
    border-color: #ffd05c;
  }
  .mass {
    position: absolute;
    width: 8px; height: 8px;
    background-color: #DAA520;
    border-radius: 50%;
    top: 16px; left: 16px;
    transform-style: preserve-3d;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="gimbal-container" id="gimbal">
  <div class="ring ring1" id="r1">
    <div class="ring ring2" id="r2">
      <div class="ring ring3" id="r3">
        <div class="mass" id="mass"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Idle Animation: The gimbal rings slowly rotate while the inner mass bobs gently in the Z-axis.
  gsap.to("#r1", { rotationX: 360, duration: 8, ease: "linear", repeat: -1 });
  gsap.to("#r2", { rotationY: 360, duration: 6, ease: "linear", repeat: -1 });
  gsap.to("#r3", { rotationZ: 360, duration: 4, ease: "linear", repeat: -1 });
  
  gsap.to("#mass", { 
    z: 10, 
    duration: 1, 
    ease: "sine.inOut", 
    yoyo: true, 
    repeat: -1 
  });

  // Click Disappearance Motion: Loses its reference frame, spinning chaotically faster and faster until it blurs into nothing.
  document.body.addEventListener('click', () => {
    // Kill idle
    gsap.killTweensOf(["#r1", "#r2", "#r3", "#mass"]);
    
    const clickTl = gsap.timeline();
    
    // Spin chaotically faster
    clickTl.to("#r1", {
      rotationX: "+=2160",
      rotationY: "+=1080",
      duration: 1.5,
      ease: "power4.in"
    }, 0)
    .to("#r2", {
      rotationY: "+=2160",
      rotationZ: "+=1440",
      duration: 1.5,
      ease: "power4.in"
    }, 0)
    .to("#r3", {
      rotationZ: "+=2880",
      rotationX: "+=720",
      duration: 1.5,
      ease: "power4.in"
    }, 0)
    .to("#mass", {
      x: () => (Math.random()-0.5)*100,
      y: () => (Math.random()-0.5)*100,
      z: 500,
      scale: 5,
      opacity: 0,
      duration: 1.5,
      ease: "power3.in"
    }, 0)
    // Blur out and expand
    .to("#gimbal", {
      scale: 30,
      opacity: 0,
      filter: "blur(20px)",
      duration: 0.5,
      ease: "power2.in"
    }, 1.0);
  }, { once: true });
</script>
</body>
</html>
