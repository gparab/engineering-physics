<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Predictive Control</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #001a1a;
    overflow: hidden;
    cursor: pointer;
  }
  .container {
    width: 40px;
    height: 40px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .traj { stroke: #00CED1; fill: none; stroke-linecap: round; opacity: 0.4; stroke-width: 1; }
  .optimal { stroke: #00CED1; fill: none; stroke-linecap: round; stroke-width: 2; opacity: 1; }
  .dot { fill: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container" id="icon">
  <svg viewBox="0 0 40 40">
    <!-- Future Trajectories -->
    <path id="t1" class="traj" d="M 5 20 Q 15 5 35 10" />
    <path id="t2" class="traj" d="M 5 20 Q 20 10 35 15" />
    <path id="t3" class="traj" d="M 5 20 Q 20 30 35 25" />
    <path id="t4" class="traj" d="M 5 20 Q 15 35 35 30" />
    
    <!-- Optimal Trajectory -->
    <path id="opt" class="optimal" d="M 5 20 Q 20 20 35 20" />
    
    <!-- Current State Dot -->
    <circle cx="5" cy="20" r="2" class="dot" />
  </svg>
</div>

<script>
  // Idle Animation: Future trajectories recalculate and wiggle
  gsap.to("#t1", { attr: { d: "M 5 20 Q 15 10 35 5" }, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut" });
  gsap.to("#t2", { attr: { d: "M 5 20 Q 20 5 35 18" }, duration: 1.1, yoyo: true, repeat: -1, ease: "sine.inOut" });
  gsap.to("#t3", { attr: { d: "M 5 20 Q 20 35 35 22" }, duration: 0.9, yoyo: true, repeat: -1, ease: "sine.inOut" });
  gsap.to("#t4", { attr: { d: "M 5 20 Q 15 30 35 35" }, duration: 1.2, yoyo: true, repeat: -1, ease: "sine.inOut" });
  
  gsap.to("#opt", { attr: { d: "M 5 20 Q 20 18 35 20" }, duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" });
  
  // Forward motion feel
  gsap.to("#icon", { x: 2, duration: 1, yoyo: true, repeat: -1, ease: "sine.inOut" });

  // Click Disappearance Motion: Time horizon stretches to infinity, thinning trajectories until they snap.
  document.body.addEventListener('click', () => {
    gsap.killTweensOf("*");
    
    const clickTl = gsap.timeline();
    
    clickTl.to(".traj, .optimal", {
      attr: { d: "M 5 20 Q 50 20 200 20" },
      strokeWidth: 0.1,
      opacity: 0.8,
      duration: 0.6,
      ease: "power2.in"
    }, 0)
    .to(".dot", {
      cx: 200,
      duration: 0.6,
      ease: "power2.in"
    }, 0)
    // Snap
    .to(".traj, .optimal", {
      opacity: 0,
      duration: 0.1
    }, 0.6)
    .to(".dot", {
      opacity: 0,
      duration: 0.1
    }, 0.6)
    .to("body", {
      backgroundColor: "#003333",
      duration: 0.2,
      yoyo: true,
      repeat: 1
    }, 0.6);
  }, { once: true });
</script>
</body>
</html>
