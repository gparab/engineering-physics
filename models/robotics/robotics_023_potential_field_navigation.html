<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potential Field Navigation</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1a1a12;
    overflow: hidden;
    cursor: pointer;
  }
  .container {
    width: 60px;
    height: 60px;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .contour { fill: none; stroke: #BDB76B; stroke-width: 0.8; opacity: 0.5; }
  .goal { fill: none; stroke: #5e5b35; stroke-width: 1.5; opacity: 0.8; }
  .particle { fill: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
</head>
<body>

<div class="container" id="icon">
  <svg viewBox="0 0 60 60">
    <!-- Goal valley -->
    <circle cx="50" cy="50" r="2" class="goal" />
    <circle cx="50" cy="50" r="6" class="contour" />
    <circle cx="50" cy="50" r="12" class="contour" />
    <circle cx="50" cy="50" r="20" class="contour" />
    <circle cx="50" cy="50" r="30" class="contour" />
    
    <!-- Obstacle Hill -->
    <circle cx="30" cy="25" r="4" class="contour" />
    <circle cx="30" cy="25" r="8" class="contour" />
    <circle cx="30" cy="25" r="14" class="contour" />
    
    <!-- Path -->
    <path id="path" d="M 5 5 C 20 10, 15 35, 30 40 C 40 40, 45 45, 50 50" fill="none" />
    
    <circle id="particle" cx="0" cy="0" r="2" class="particle" />
  </svg>
</div>

<script>
  gsap.registerPlugin(MotionPathPlugin);

  // Idle Animation: Particle rolls smoothly down the gradient, sliding around a hill.
  const idle = gsap.to("#particle", {
    motionPath: {
      path: "#path",
      align: "#path",
      alignOrigin: [0.5, 0.5]
    },
    duration: 3,
    ease: "power1.inOut",
    repeat: -1
  });

  // Click Disappearance Motion: Trapped in local minimum and spirals infinitely fast into the ground.
  document.body.addEventListener('click', () => {
    idle.kill();
    
    const clickTl = gsap.timeline();
    
    // Jump to the local minimum (the hill center)
    gsap.set("#particle", { x: 30, y: 25 });
    
    // Create a spiral path
    const spiralPath = [];
    let r = 10;
    let angle = 0;
    for(let i=0; i<50; i++) {
      angle += 0.5;
      r *= 0.9; // shrink radius
      spiralPath.push({ x: 30 + Math.cos(angle)*r, y: 25 + Math.sin(angle)*r });
    }
    
    clickTl.to("#particle", {
      motionPath: {
        path: spiralPath
      },
      duration: 1,
      ease: "power3.in"
    }, 0)
    .to("#particle", {
      scale: 0,
      duration: 0.5,
      ease: "power2.in"
    }, 0.5)
    .to(".contour", {
      strokeDasharray: "1 5",
      opacity: 0,
      duration: 0.4,
      stagger: 0.05
    }, 0.6)
    .to("body", {
      backgroundColor: "#2e2d1d",
      duration: 0.2,
      yoyo: true,
      repeat: 1
    }, 0.8);
  }, { once: true });
</script>
</body>
</html>
