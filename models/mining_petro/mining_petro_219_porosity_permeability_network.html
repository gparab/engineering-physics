<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porosity/Permeability Network</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 24px;
    height: 24px;
    cursor: pointer;
  }

  .pore {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: #D8BFD8;
    border-radius: 50%;
    transform-origin: center center;
  }

  .throat {
    position: absolute;
    background-color: #D8BFD8;
    transform-origin: 0 50%;
  }

  .fluid {
    position: absolute;
    width: 2px;
    height: 2px;
    background-color: #00BFFF;
    border-radius: 50%;
    opacity: 0.8;
  }

  /* Full screen ejection */
  .fluid-eject {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background-color: #00BFFF;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    box-shadow: 0 0 10px #00BFFF;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container" id="model">
  <!-- Pores -->
  <div class="pore" style="top: 0; left: 0;"></div>
  <div class="pore" style="top: 0; left: 16px;"></div>
  <div class="pore" style="top: 16px; left: 8px;"></div>
  
  <!-- Throats -->
  <div class="throat" style="top: 4px; left: 4px; width: 14px; height: 2px; transform: rotate(0deg);"></div>
  <div class="throat" style="top: 6px; left: 4px; width: 14px; height: 2px; transform: rotate(63deg);"></div>
  <div class="throat" style="top: 6px; left: 16px; width: 12px; height: 2px; transform: rotate(120deg);"></div>

  <div class="fluid" id="f1" style="top: 3px; left: 3px;"></div>
</div>

<script>
  // Idle fluid trickle
  gsap.to("#f1", {
    x: 14,
    duration: 1,
    ease: "none",
    onComplete: function() {
      gsap.to("#f1", {
        x: 8,
        y: 14,
        duration: 1,
        ease: "none",
        onComplete: function() {
          gsap.set("#f1", {x: 0, y: 0});
        }
      });
    },
    repeat: -1
  });

  const model = document.getElementById('model');

  model.addEventListener('click', () => {
    gsap.killTweensOf("#f1");
    gsap.to("#f1", {opacity: 0, duration: 0.1});

    // Stress crushes spheres flat
    gsap.to(".pore", {
      scaleY: 0.2,
      scaleX: 1.5,
      backgroundColor: "#555",
      duration: 0.2,
      ease: "power2.in"
    });
    
    gsap.to(".throat", {
      height: 0,
      opacity: 0,
      duration: 0.2
    });

    // Fluid ejects sideways across screen
    for(let i=0; i<30; i++) {
      let f = document.createElement('div');
      f.className = 'fluid-eject';
      document.body.appendChild(f);
      
      let angle = Math.random() * Math.PI * 2;
      // biased sideways (0 or PI)
      if(Math.random() > 0.5) {
        angle = (Math.random() * 0.4) - 0.2; // roughly right
      } else {
        angle = Math.PI + (Math.random() * 0.4) - 0.2; // roughly left
      }
      
      let dist = window.innerWidth * 0.8;
      
      gsap.fromTo(f,
        { opacity: 1, scale: 1 },
        {
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist,
          scale: 4,
          opacity: 0,
          duration: 0.6 + Math.random() * 0.4,
          ease: "expo.out"
        }
      );
    }
  });
</script>
</body>
</html>
