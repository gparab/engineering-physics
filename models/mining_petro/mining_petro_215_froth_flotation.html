<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Froth Flotation</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1e1e1e;
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 20px;
    height: 30px;
    cursor: pointer;
  }

  .tank {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 2px solid #555;
    border-top: none;
    border-radius: 0 0 4px 4px;
    box-sizing: border-box;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: 0;
    width: 4px;
    height: 4px;
    background-color: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
  }

  .gold-dot {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 2px;
    background-color: #FFD700;
    border-radius: 50%;
  }

  .gangue {
    position: absolute;
    top: 50%;
    width: 2px;
    height: 2px;
    background-color: #888;
    border-radius: 50%;
  }

  .cascade {
    position: fixed;
    top: -100vh;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(to bottom, #FFD700, #DAA520);
    z-index: 10;
    pointer-events: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container" id="model">
  <div class="tank" id="tank"></div>
</div>

<div class="cascade" id="cascade"></div>

<script>
  const tank = document.getElementById('tank');
  const model = document.getElementById('model');

  // Generate bubbles and gangue
  for(let i=0; i<6; i++) {
    let b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = (Math.random() * 12) + 'px';
    
    let gold = document.createElement('div');
    gold.className = 'gold-dot';
    b.appendChild(gold);
    tank.appendChild(b);

    gsap.fromTo(b, 
      { y: 30, opacity: 1 },
      {
        y: -10,
        opacity: 0,
        duration: 1 + Math.random(),
        repeat: -1,
        delay: Math.random() * 2,
        ease: "power1.in"
      }
    );

    let g = document.createElement('div');
    g.className = 'gangue';
    g.style.left = (Math.random() * 16) + 'px';
    tank.appendChild(g);

    gsap.fromTo(g,
      { y: -10 },
      {
        y: 30,
        duration: 1.5 + Math.random(),
        repeat: -1,
        delay: Math.random() * 2,
        ease: "linear"
      }
    );
  }

  model.addEventListener('click', () => {
    gsap.killTweensOf(".bubble");
    gsap.killTweensOf(".gangue");

    // Golden cascade covers UI
    gsap.to("#cascade", {
      top: 0,
      duration: 1.2,
      ease: "bounce.out"
    });
    
    gsap.to(model, {
      opacity: 0,
      duration: 0.3
    });
  });
</script>
</body>
</html>
