<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydraulic Fracturing</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #121212;
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 30px;
    height: 20px;
    cursor: pointer;
  }

  .wellbore {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 2px;
    background: #555;
    transform: translateY(-50%);
  }

  .crack {
    position: absolute;
    width: 2px;
    background: #9932CC;
    box-shadow: 0 0 3px #9932CC;
    transform-origin: bottom center;
  }
  
  .crack.up {
    bottom: 50%;
    height: 6px;
    clip-path: polygon(50% 0%, 100% 20%, 60% 50%, 100% 80%, 50% 100%, 0% 80%, 40% 50%, 0% 20%);
  }

  .crack.down {
    top: 50%;
    height: 6px;
    transform-origin: top center;
    clip-path: polygon(50% 0%, 100% 20%, 60% 50%, 100% 80%, 50% 100%, 0% 80%, 40% 50%, 0% 20%);
  }

  .macro-crack {
    position: absolute;
    background: #9932CC;
    box-shadow: 0 0 15px #9932CC, 0 0 30px #9932CC;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container" id="model">
  <div class="wellbore"></div>
  <div class="crack up" style="left: 20%"></div>
  <div class="crack down" style="left: 20%"></div>
  <div class="crack up" style="left: 50%"></div>
  <div class="crack down" style="left: 50%"></div>
  <div class="crack up" style="left: 80%"></div>
  <div class="crack down" style="left: 80%"></div>
</div>

<script>
  gsap.to(".crack", {
    scaleY: 1.3,
    scaleX: 1.5,
    opacity: 0.5,
    duration: 1,
    yoyo: true,
    repeat: -1,
    stagger: {
      each: 0.2,
      from: "center"
    },
    ease: "sine.inOut"
  });

  const model = document.getElementById('model');

  model.addEventListener('click', (e) => {
    gsap.killTweensOf(".crack");
    gsap.to(".container", {opacity: 0, duration: 0.1});
    
    const numCracks = 10;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    
    for(let i=0; i<numCracks; i++) {
      let div = document.createElement('div');
      div.className = 'macro-crack';
      document.body.appendChild(div);
      
      let angle = (i / numCracks) * Math.PI * 2 + (Math.random() * 0.5);
      let length = window.innerWidth * 1.2;
      
      div.style.left = centerX + 'px';
      div.style.top = centerY + 'px';
      div.style.width = length + 'px';
      div.style.height = (2 + Math.random() * 4) + 'px';
      div.style.transformOrigin = "0 50%";
      div.style.transform = `rotate(${angle}rad)`;
      
      gsap.fromTo(div, 
        { scaleX: 0, opacity: 1 },
        { 
          scaleX: 1, 
          duration: 0.3 + Math.random() * 0.4, 
          ease: "expo.inOut",
          delay: Math.random() * 0.1
        }
      );
      
      gsap.to(div, {
        height: (20 + Math.random() * 40) + 'px',
        opacity: 0,
        duration: 0.5,
        delay: 0.5 + Math.random() * 0.2,
        ease: "power2.in"
      });
    }

    gsap.fromTo("body", 
      { backgroundColor: "#9932CC" },
      { backgroundColor: "#121212", duration: 0.8, delay: 0.3, ease: "power2.out" }
    );
  });
</script>
</body>
</html>
