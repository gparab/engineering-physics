<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f7f9fa; overflow: hidden; perspective: 400px; }
  .container { position: relative; width: 60px; height: 60px; cursor: pointer; transform-style: preserve-3d; }
  .plane { fill: #34495E; stroke: #2C3E50; stroke-width: 0.5; }
  .axis { stroke: #E74C3C; stroke-width: 0.5; stroke-dasharray: 2 2; }
  .axis-y { stroke: #2ECC71; }
  .axis-z { stroke: #3498DB; }
</style>
</head>
<body>
  <div class="container" id="model">
    <svg viewBox="0 0 100 100" width="100%" height="100%" id="plane-svg" style="overflow:visible">
      <line class="axis axis-x" x1="10" y1="50" x2="90" y2="50" />
      <line class="axis axis-y" x1="50" y1="10" x2="50" y2="90" />
      
      <g id="aircraft" transform-origin="50 50">
        <path class="plane" d="M 80 50 L 50 45 L 30 20 L 25 20 L 40 47 L 15 48 L 5 35 L 0 35 L 5 50 L 0 65 L 5 65 L 15 52 L 40 53 L 25 80 L 30 80 L 50 55 Z" />
      </g>
    </svg>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const container = document.getElementById('model');
    
    gsap.to(container, {
      rotationX: 15,
      rotationY: -10,
      rotationZ: 5,
      duration: 1,
      yoyo: true,
      repeat: -1,
      ease: "sine.inOut"
    });

    container.addEventListener('click', () => {
      gsap.killTweensOf(container);
      
      gsap.to(container, {
        rotationZ: 1080, 
        rotationX: 80,   
        rotationY: 360,
        x: window.innerWidth,
        y: window.innerHeight,
        scale: 0.1,
        duration: 3,
        ease: "power2.in",
        opacity: 0
      });
    });
  </script>
</body>
</html>
