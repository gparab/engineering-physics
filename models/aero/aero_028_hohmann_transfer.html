<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fafafa; overflow: hidden; }
  .container { position: relative; width: 60px; height: 60px; cursor: pointer; }
  .orbit { stroke: #d0d0d0; stroke-width: 0.5; fill: none; stroke-dasharray: 1 2; }
  .transfer { stroke: #2ECC71; stroke-width: 0.5; fill: none; opacity: 0.5; stroke-dasharray: 2 4; }
  .planet { fill: #555; }
  .ship { fill: #2ECC71; }
</style>
</head>
<body>
  <div class="container" id="model">
    <svg viewBox="0 0 100 100" width="100%" height="100%" id="svg-element">
      <circle class="planet" cx="50" cy="50" r="4" />
      <circle class="orbit" cx="50" cy="50" r="15" id="innerOrbit" />
      <circle class="orbit" cx="50" cy="50" r="35" id="outerOrbit" />
      <path class="transfer" d="M 50 35 A 25 25 0 0 1 50 85" id="transferPath" />
      <circle class="ship" cx="50" cy="35" r="2" id="ship" />
    </svg>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(MotionPathPlugin);
    const ship = document.getElementById('ship');
    const container = document.getElementById('model');
    
    let tl = gsap.timeline({ repeat: -1 });
    
    tl.to(ship, {
      duration: 2, ease: "none",
      motionPath: { path: "#innerOrbit", start: 0, end: 1 }
    })
    .to(ship, { fill: "#E74C3C", duration: 0.1, yoyo: true, repeat: 3 })
    .to(ship, {
      duration: 1.5, ease: "power1.inOut",
      motionPath: { path: "#transferPath", align: "#transferPath", alignOrigin: [0.5, 0.5] }
    })
    .to(ship, { fill: "#E74C3C", duration: 0.1, yoyo: true, repeat: 3 })
    .to(ship, {
      duration: 4, ease: "none",
      motionPath: { path: "#outerOrbit", start: 0.5, end: 1.5 }
    })
    .to(ship, {
      duration: 1.5, ease: "power1.inOut",
      motionPath: { path: "M 50 15 A 25 25 0 0 1 50 65", alignOrigin: [0.5, 0.5] }
    });

    container.addEventListener('click', () => {
      tl.kill();
      
      const currentX = gsap.getProperty(ship, "x");
      const currentY = gsap.getProperty(ship, "y");
      
      gsap.to(ship, {
        duration: 0.2,
        scale: 2,
        fill: "#E74C3C" 
      });
      
      gsap.to(ship, {
        x: currentX + 500,
        y: currentY - 500,
        duration: 2,
        ease: "power2.in",
        scale: 0.5,
        opacity: 0,
        delay: 0.2
      });
      
      gsap.to("#svg-element", {
        opacity: 0.1,
        duration: 1,
        delay: 0.5
      });
    });
  </script>
</body>
</html>
