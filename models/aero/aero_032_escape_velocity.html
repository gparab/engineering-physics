<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; overflow: hidden; perspective: 600px; }
  .container { position: relative; width: 80px; height: 80px; cursor: pointer; transform-style: preserve-3d; transform: rotateX(60deg); }
  
  .ring { position: absolute; border: 1px solid rgba(149, 165, 166, 0.4); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  
  .planet { position: absolute; width: 12px; height: 12px; background: #34495E; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%) translateZ(-40px); }
  
  .mass { position: absolute; width: 4px; height: 4px; background: #E74C3C; border-radius: 50%; left: 50%; top: 50%; }
</style>
</head>
<body>
  <div class="container" id="model">
    <div class="ring" style="width: 80px; height: 80px; transform: translate(-50%, -50%) translateZ(0px);"></div>
    <div class="ring" style="width: 60px; height: 60px; transform: translate(-50%, -50%) translateZ(-10px);"></div>
    <div class="ring" style="width: 40px; height: 40px; transform: translate(-50%, -50%) translateZ(-20px);"></div>
    <div class="ring" style="width: 20px; height: 20px; transform: translate(-50%, -50%) translateZ(-30px);"></div>
    
    <div class="planet"></div>
    <div class="mass" id="mass"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const container = document.getElementById('model');
    const mass = document.getElementById('mass');
    
    let angle = { val: 0 };
    let radius = 15;
    let depth = -25;
    
    let idleAnim = gsap.to(angle, {
      val: Math.PI * 2,
      duration: 1.5,
      repeat: -1,
      ease: "none",
      onUpdate: () => {
        let x = Math.cos(angle.val) * radius;
        let y = Math.sin(angle.val) * radius;
        let z = depth + Math.sin(angle.val * 2) * 2;
        mass.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${z}px)`;
      }
    });

    container.addEventListener('click', () => {
      idleAnim.kill();
      
      gsap.to(mass, {
        backgroundColor: "#2ECC71",
        duration: 0.5
      });
      
      let escapeAngle = { val: angle.val };
      let escapeRadius = { val: radius };
      let escapeDepth = { val: depth };
      
      gsap.to(escapeAngle, {
        val: angle.val + Math.PI * 4,
        duration: 2,
        ease: "power2.in"
      });
      
      gsap.to(escapeRadius, {
        val: 1000,
        duration: 2,
        ease: "power2.in"
      });
      
      gsap.to(escapeDepth, {
        val: 200, 
        duration: 2,
        ease: "power2.out",
        onUpdate: () => {
          let x = Math.cos(escapeAngle.val) * escapeRadius.val;
          let y = Math.sin(escapeAngle.val) * escapeRadius.val;
          mass.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${escapeDepth.val}px)`;
        },
        onComplete: () => {
          gsap.to(container, {opacity: 0, duration: 1});
        }
      });
    });
  </script>
</body>
</html>
