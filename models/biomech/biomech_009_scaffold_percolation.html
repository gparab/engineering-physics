<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaffold Percolation</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d0d0d; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #container { width: 40px; height: 40px; position: relative; cursor: pointer; }
        .lattice-line { position: absolute; background-color: rgba(126, 211, 33, 0.3); }
        .lattice-line.h { height: 1px; width: 100%; left: 0; }
        .lattice-line.v { width: 1px; height: 100%; top: 0; }
        .node { position: absolute; background-color: #7ED321; border-radius: 50%; width: 4px; height: 4px; transform: translate(-50%, -50%); }
        .tendril { position: absolute; background-color: #7ED321; height: 1px; transform-origin: 0 0; opacity: 0.6; }
        .dust { position: absolute; background-color: #7ED321; width: 1px; height: 1px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('container');
        const gridSize = 3; const spacing = 20;
        const nodes = []; const lines = []; const tendrils = [];

        for(let i = 0; i < gridSize; i++) {
            let hLine = document.createElement('div'); hLine.className = 'lattice-line h'; hLine.style.top = `${i * spacing}px`;
            container.appendChild(hLine); lines.push(hLine);
            let vLine = document.createElement('div'); vLine.className = 'lattice-line v'; vLine.style.left = `${i * spacing}px`;
            container.appendChild(vLine); lines.push(vLine);
        }

        for(let i = 0; i < gridSize; i++) {
            for(let j = 0; j < gridSize; j++) {
                let node = document.createElement('div'); node.className = 'node'; node.style.left = `${i * spacing}px`; node.style.top = `${j * spacing}px`;
                container.appendChild(node); nodes.push(node);
                gsap.to(node, { scale: 1.5, opacity: 0.8, duration: 1 + Math.random(), yoyo: true, repeat: -1, ease: "sine.inOut", delay: Math.random() });

                if (i < gridSize - 1) {
                    let t = document.createElement('div'); t.className = 'tendril'; t.style.left = `${i * spacing}px`; t.style.top = `${j * spacing}px`; t.style.width = `0px`;
                    container.appendChild(t); tendrils.push(t);
                    gsap.to(t, { width: `${spacing}px`, duration: 1.5 + Math.random(), yoyo: true, repeat: -1, ease: "power1.inOut", delay: Math.random() });
                }
                if (j < gridSize - 1) {
                    let t = document.createElement('div'); t.className = 'tendril'; t.style.left = `${i * spacing}px`; t.style.top = `${j * spacing}px`; t.style.width = `0px`; t.style.transform = `rotate(90deg)`;
                    container.appendChild(t); tendrils.push(t);
                    gsap.to(t, { width: `${spacing}px`, duration: 1.5 + Math.random(), yoyo: true, repeat: -1, ease: "power1.inOut", delay: Math.random() });
                }
            }
        }

        let clicked = false;
        container.addEventListener('click', () => {
            if(clicked) return; clicked = true;
            gsap.killTweensOf(".node"); gsap.killTweensOf(".tendril");
            gsap.to(".node, .tendril", { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" });

            lines.forEach(line => {
                line.style.display = 'none';
                let isH = line.classList.contains('h');
                for(let k = 0; k < 20; k++) {
                    let dust = document.createElement('div'); dust.className = 'dust'; container.appendChild(dust);
                    let startX = isH ? (k / 20) * spacing * 2 : 0; let startY = isH ? 0 : (k / 20) * spacing * 2;
                    dust.style.left = line.style.left || `${startX}px`; dust.style.top = line.style.top || `${startY}px`;
                    let angle = Math.random() * Math.PI * 2; let distance = 300 + Math.random() * 500;
                    gsap.to(dust, { x: Math.cos(angle) * distance, y: Math.sin(angle) * distance, opacity: 0, duration: 1 + Math.random(), ease: "expo.out" });
                }
            });

            nodes.forEach(node => {
                let angle = Math.random() * Math.PI * 2; let distance = 50 + Math.random() * 100;
                gsap.to(node, { x: Math.cos(angle) * distance, y: Math.sin(angle) * distance, scale: 0, duration: 0.6, ease: "back.in(2)" });
            });
        });
    </script>
</body>
</html>
