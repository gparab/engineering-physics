<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hemodynamic Bifurcation</title>
<style>
  body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #111; overflow: hidden; }
  #container { cursor: pointer; position: relative; width: 40px; height: 40px; }
  #vessel { transform-origin: center bottom; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="container">
  <svg viewBox="0 0 40 40" width="40" height="40" id="vessel">
    <path d="M15,40 L15,20 L5,0 L15,0 L20,10 L25,0 L35,0 L25,20 L25,40 Z" fill="rgba(208, 2, 27, 0.2)" stroke="#D0021B" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
  <div id="vectors" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible;"></div>
</div>
<script>
  let vCont = document.getElementById("vectors");
  let creating = true;
  function addVector() {
    if(!creating) return;
    let v = document.createElement("div");
    v.style.cssText = "position:absolute; width:1.5px; height:6px; background:#D0021B; left:19px; top:40px; border-radius:1px;";
    vCont.appendChild(v);
    
    let branchLeft = Math.random() > 0.5;
    let duration1 = 0.4 + Math.random()*0.2;
    let duration2 = 0.4 + Math.random()*0.3; // slower in branches
    
    gsap.to(v, {
      top: 15, duration: duration1, ease: "none",
      onComplete: () => {
        gsap.to(v, {
          x: branchLeft ? -10 : 10, y: -20, rotation: branchLeft ? -25 : 25,
          duration: duration2, ease: "none", onComplete: () => { if(creating) v.remove(); }
        });
      }
    });
  }
  setInterval(addVector, 120);
  gsap.to("#vessel", {scale: 1.05, duration: 0.4, repeat: -1, yoyo: true, ease: "sine.inOut"});

  document.getElementById("container").addEventListener("click", () => {
    creating = false;
    gsap.killTweensOf("#vessel");
    let vectors = document.querySelectorAll("#vectors div");
    vectors.forEach(v => {
      gsap.killTweensOf(v);
      gsap.to(v, {
        x: (Math.random()-0.5)*800, y: (Math.random()-0.5)*800,
        rotation: Math.random()*1080, scale: 3, opacity: 0,
        duration: 1.5 + Math.random(), ease: "power3.out"
      });
    });
    gsap.to("#vessel", {opacity: 0, scale: 2, filter: "blur(10px)", duration: 0.8, ease: "power2.in"});
  });
</script>
</body>
</html>
