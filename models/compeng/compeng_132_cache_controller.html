<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>132. Cache Controller</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d0d0d;
    overflow: hidden;
  }
  #container {
    position: relative;
    width: 20px;
    height: 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .layer {
    background: #D35400;
    margin-top: 1px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #l1 {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid rgba(211, 84, 0, 0.9);
    background: transparent;
    position: relative;
  }
  #l2 { width: 12px; height: 4px; opacity: 0.6; }
  #l3 { width: 20px; height: 4px; opacity: 0.3; }
  .dot {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
  }
  #main-mem {
    position: absolute;
    bottom: -100px;
    width: 100vw;
    height: 50px;
    background: #222;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="main-mem"></div>
<div id="container">
  <div id="l1"><div class="dot" id="dot1" style="top: 2px;"></div></div>
  <div id="l2" class="layer"><div class="dot" id="dot2"></div></div>
  <div id="l3" class="layer"><div class="dot" id="dot3"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  
  // Idle animation
  let tl1 = gsap.timeline({repeat: -1});
  tl1.to('#dot1', {opacity: 1, duration: 0.1})
     .to('#dot1', {y: 2, x: 1, duration: 0.1, yoyo: true, repeat: 3})
     .to('#dot1', {opacity: 0, duration: 0.1});
     
  let tl2 = gsap.timeline({repeat: -1, delay: 0.5});
  tl2.to('#dot2', {opacity: 1, duration: 0.2})
     .to('#dot2', {x: -2, duration: 0.2, yoyo: true, repeat: 1})
     .to('#dot2', {opacity: 0, duration: 0.2});

  let tl3 = gsap.timeline({repeat: -1, delay: 1});
  tl3.to('#dot3', {opacity: 1, duration: 0.4})
     .to('#dot3', {x: 4, duration: 0.4, yoyo: true, repeat: 1})
     .to('#dot3', {opacity: 0, duration: 0.4});

  container.addEventListener('click', () => {
    tl1.kill(); tl2.kill(); tl3.kill();
    gsap.set('.dot', {opacity: 0});
    gsap.to('#main-mem', {opacity: 1, y: -100, duration: 1, ease: 'power2.out'});
    gsap.to(container, {
      rotation: 180,
      duration: 0.4,
      ease: "power2.in"
    });
    gsap.to(container, {
      y: window.innerHeight / 2 + 50,
      scale: 0.2,
      duration: 0.8,
      delay: 0.4,
      ease: "power2.in",
      onComplete: () => container.remove()
    });
    // ripple main memory
    gsap.to('#main-mem', {
      height: 200,
      duration: 0.5,
      delay: 1.2,
      yoyo: true,
      repeat: 1,
      ease: "sine.inOut"
    });
  });
</script>
</body>
</html>
