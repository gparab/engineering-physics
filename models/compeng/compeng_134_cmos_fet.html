<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>134. CMOS FET</title>
<style>
  body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #0d0d0d; overflow: hidden; }
  #container { position: relative; width: 20px; height: 16px; cursor: pointer; }
  .term { position: absolute; background: #BDC3C7; }
  .gate { width: 14px; height: 2px; top: 0; left: 3px; }
  .oxide { width: 14px; height: 2px; top: 2px; left: 3px; background: #333; }
  .source { width: 4px; height: 6px; top: 4px; left: 0; }
  .drain { width: 4px; height: 6px; top: 4px; right: 0; }
  .substrate { width: 20px; height: 6px; bottom: 0; left: 0; background: #222; }
  .channel { position: absolute; width: 10px; height: 2px; top: 6px; left: 5px; background: #BDC3C7; box-shadow: 0 0 6px #BDC3C7; opacity: 0.1; }
  .spark { position: absolute; width: 2px; height: 2px; background: #fff; box-shadow: 0 0 10px #fff; opacity: 0; top: 50%; left: 50%; transform: translate(-50%, -50%);}
</style>
</head>
<body>
<div id="container">
  <div class="substrate term"></div>
  <div class="source term"></div>
  <div class="drain term"></div>
  <div class="oxide"></div>
  <div class="gate term"></div>
  <div class="channel" id="channel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  const channel = document.getElementById('channel');
  
  let t = gsap.to(channel, {
    opacity: 1,
    duration: 0.8,
    yoyo: true,
    repeat: -1,
    ease: "sine.inOut"
  });

  container.addEventListener('click', () => {
    t.kill();
    gsap.to(channel, {
      scaleX: 0,
      opacity: 1,
      duration: 0.2,
      ease: "power4.in"
    });
    
    setTimeout(() => {
      let spark = document.createElement('div');
      spark.className = 'spark';
      container.appendChild(spark);
      
      gsap.to(spark, {
        opacity: 1,
        scale: 50,
        duration: 0.1,
        yoyo: true,
        repeat: 1
      });
      
      gsap.to(container.children, {
        opacity: 0,
        duration: 0.1,
        delay: 0.05
      });
      
      const fragments = [];
      for(let i=0; i<10; i++) {
        let f = document.createElement('div');
        f.style.position = 'absolute';
        f.style.width = '2px';
        f.style.height = '2px';
        f.style.background = '#BDC3C7';
        f.style.left = '10px';
        f.style.top = '8px';
        container.appendChild(f);
        fragments.push(f);
      }
      
      gsap.to(fragments, {
        x: () => (Math.random() - 0.5) * 400,
        y: () => (Math.random() - 0.5) * 400,
        opacity: 0,
        duration: 1,
        ease: "power2.out",
        onComplete: () => container.remove()
      });
    }, 200);
  });
</script>
</body>
</html>
