<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>135. FPGA LUT</title>
<style>
  body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #0d0d0d; overflow: hidden; color: #2980B9;}
  #container { position: relative; width: 24px; height: 24px; cursor: pointer; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px;}
  .node { background: #111; border: 1px solid #333; position: relative; display: flex; justify-content: center; align-items: center; font-family: monospace; font-size: 8px;}
  .active { background: rgba(41, 128, 185, 0.4); border-color: #2980B9; box-shadow: 0 0 5px #2980B9;}
  .bitstream { position: absolute; font-family: monospace; font-size: 14px; opacity: 0; font-weight: bold;}
</style>
</head>
<body>
<div id="container">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  const nodes = [];
  
  for(let i=0; i<9; i++) {
    let n = document.createElement('div');
    n.className = 'node';
    container.appendChild(n);
    nodes.push(n);
  }
  
  let activePath = [0, 1, 4, 7, 8];
  
  function updatePath() {
    nodes.forEach(n => n.classList.remove('active'));
    activePath.forEach(i => nodes[i].classList.add('active'));
    
    // random path next time
    activePath = [];
    let curr = 0;
    activePath.push(curr);
    while(curr !== 8) {
      if(curr % 3 === 2) curr += 3;
      else if (Math.floor(curr/3) === 2) curr += 1;
      else curr += Math.random() > 0.5 ? 1 : 3;
      activePath.push(curr);
    }
  }
  
  updatePath();
  let interval = setInterval(updatePath, 800);
  
  container.addEventListener('click', () => {
    clearInterval(interval);
    
    for(let i=0; i<200; i++) {
      let b = document.createElement('div');
      b.className = 'bitstream';
      b.innerText = Math.random() > 0.5 ? '1' : '0';
      b.style.left = (Math.random() * window.innerWidth) + 'px';
      b.style.top = (Math.random() * window.innerHeight) + 'px';
      document.body.appendChild(b);
      
      gsap.to(b, {
        opacity: Math.random() * 0.8 + 0.2,
        duration: 0.1,
        delay: Math.random() * 0.5
      });
      
      gsap.to(b, {
        y: '+=200',
        opacity: 0,
        duration: 1 + Math.random(),
        delay: 0.5 + Math.random() * 0.5,
        ease: "power1.in"
      });
    }
    
    gsap.to('.node', {
      scale: 0,
      rotation: () => Math.random() * 180,
      duration: 0.5,
      stagger: 0.05,
      ease: "back.in(1.7)",
      onComplete: () => container.remove()
    });
  });
</script>
</body>
</html>
