<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instruction Pipeline</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 300px;
    height: 150px;
    cursor: pointer;
    position: relative;
  }
  .tube-segment {
    fill: rgba(52, 73, 94, 0.4);
    stroke: #34495E;
    stroke-width: 2;
  }
  .separator {
    stroke: #34495E;
    stroke-width: 2;
    stroke-dasharray: 4;
  }
  .packet {
    opacity: 0.8;
  }
  .shard {
    fill: rgba(52, 73, 94, 0.6);
    stroke: #34495E;
    stroke-width: 1;
    opacity: 0;
  }
</style>
</head>
<body>
<div class="container" id="model">
  <svg viewBox="0 0 200 100" id="svg-element">
    <g id="tube">
      <rect class="tube-segment" x="20" y="35" width="160" height="30" rx="5" />
      <line class="separator" x1="60" y1="35" x2="60" y2="65" />
      <line class="separator" x1="100" y1="35" x2="100" y2="65" />
      <line class="separator" x1="140" y1="35" x2="140" y2="65" />
      <text x="35" y="25" fill="#34495E" font-size="8" font-family="monospace">F</text>
      <text x="75" y="25" fill="#34495E" font-size="8" font-family="monospace">D</text>
      <text x="115" y="25" fill="#34495E" font-size="8" font-family="monospace">E</text>
      <text x="155" y="25" fill="#34495E" font-size="8" font-family="monospace">W</text>
    </g>
    
    <g id="packets">
      <rect class="packet" x="-10" y="40" width="15" height="20" fill="#E74C3C" id="p1" />
      <rect class="packet" x="-10" y="40" width="15" height="20" fill="#F1C40F" id="p2" />
      <rect class="packet" x="-10" y="40" width="15" height="20" fill="#2ECC71" id="p3" />
    </g>
    
    <g id="shards"></g>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  gsap.set(["#p1", "#p2", "#p3"], { opacity: 0 });
  
  const tl = gsap.timeline({ repeat: -1 });
  
  function flowPacket(id, delay) {
    tl.to(id, { opacity: 1, duration: 0.1 }, delay)
      .fromTo(id, { x: 10 }, { x: 170, duration: 4, ease: "none" }, delay)
      .to(id, { opacity: 0, duration: 0.1 }, delay + 4);
  }
  
  flowPacket("#p1", 0);
  flowPacket("#p2", 1.3);
  flowPacket("#p3", 2.6);

  const shardsGrp = document.getElementById('shards');
  for(let i=0; i<20; i++) {
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    const x = 20 + Math.random() * 160;
    const y = 35 + Math.random() * 30;
    poly.setAttribute('points', `${x},${y} ${x+10},${y-5} ${x+15},${y+10}`);
    poly.setAttribute('class', 'shard');
    shardsGrp.appendChild(poly);
  }

  const model = document.getElementById('model');
  model.addEventListener('click', () => {
    tl.kill();
    gsap.killTweensOf(".packet");
    
    const clickTl = gsap.timeline();
    // Pile up
    clickTl.to("#p1", { x: 140, duration: 0.3, ease: "power1.out" }, 0)
           .to("#p2", { x: 120, duration: 0.4, ease: "power1.out" }, 0)
           .to("#p3", { x: 100, duration: 0.5, ease: "power1.out" }, 0)
           // Shake tube
           .to("#tube", { x: "+=3", y: "-=2", duration: 0.05, yoyo: true, repeat: 10 }, 0)
           // Shatter
           .to("#tube", { opacity: 0, duration: 0.1 }, "+=0.1");
           
    const shards = document.querySelectorAll('.shard');
    shards.forEach(s => {
      clickTl.to(s, {
        opacity: 1,
        x: (Math.random() - 0.5) * 100,
        y: (Math.random() - 0.5) * 100 + 50,
        rotation: Math.random() * 360,
        transformOrigin: "50% 50%",
        duration: 0.8,
        ease: "power2.out",
        opacity: 0
      }, "-=0.1");
    });
    
    clickTl.to(".packet", { scale: 0, opacity: 0, duration: 0.3, stagger: 0.1 }, "-=0.8");
  });
</script>
</body>
</html>
