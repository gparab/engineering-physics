<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Minimalist UI</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #111114;
    --ink: #e0e0e0;
    --muted: #5a5a66;
    --border: #222226;
    
    /* Scientific Pale Tints */
    --c-fluid: #7eb3c1;
    --c-air:   #c4c4cc;
    --c-fire:  #c98a73;
    --c-space: #9084b8;
    --c-earth: #8bb397;
  }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    margin: 0; padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 50px;
    user-select: none;
  }

  /* Typography & Layout */
  .header { text-align: center; max-width: 600px; }
  h1 { font-weight: 400; font-size: 11px; letter-spacing: 6px; margin: 0 0 8px 0; color: #aaa; }
  p { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin: 0; text-transform: uppercase; }

  .instrument-panel {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  }

  @media (max-width: 800px) {
    .instrument-panel { flex-direction: column; }
  }

  .module {
    background: var(--panel);
    width: 140px;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    transition: background 0.3s;
  }
  .module:hover { background: #141418; }

  /* Labels */
  .mod-id { font-size: 8px; color: var(--muted); letter-spacing: 1px; position: absolute; top: 12px; left: 12px; }
  .mod-name { font-size: 9px; letter-spacing: 2px; color: #888; position: absolute; bottom: 35px; text-transform: uppercase; }
  
  .reset-btn {
    position: absolute; bottom: 12px;
    background: transparent; color: var(--muted); border: 1px solid transparent;
    font-family: inherit; font-size: 8px; letter-spacing: 1px; padding: 2px 6px; border-radius: 2px;
    cursor: pointer; opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .reset-btn:hover { color: var(--ink); border-color: var(--muted); }
  
  /* Reveal reset button when active */
  .module.completed .reset-btn { opacity: 1; pointer-events: auto; }

  /* =======================================================================
     MICRO-SVG SETUP
     ======================================================================= */
  .sensor-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; cursor: pointer;
  }
  
  svg {
    width: 24px; height: 24px;
    stroke: var(--muted); stroke-width: 1px;
    stroke-linecap: round; stroke-linejoin: round; fill: none;
    overflow: visible; transition: 0.3s ease;
  }

  .sensor-area:hover svg { stroke: var(--ink); }

  /* =======================================================================
     01. FLUID (Capillary Evaporation)
     ======================================================================= */
  .f-drop { fill: var(--muted); stroke: none; transition: 0.3s; transform-origin: 12px 14px; }
  .f-line { transform-origin: 12px 14px; transition: 0.3s; }
  
  .sensor-area:hover .f-drop { fill: var(--c-fluid); transform: scale(1.2, 0.8) translateY(1px); }
  .sensor-area:hover .f-line { stroke: var(--c-fluid); }

  .active .f-drop { animation: fluid-evaporate 1s cubic-bezier(0.5, 0, 0.2, 1) forwards; }
  .active .f-line { animation: line-dissolve 1s cubic-bezier(0.5, 0, 0.2, 1) forwards; }

  @keyframes fluid-evaporate {
    10% { transform: scale(1.5, 0.5) translateY(2px); opacity: 1; fill: var(--c-fluid); }
    100% { transform: scale(0.1, 4) translateY(-15px); opacity: 0; fill: var(--c-fluid); }
  }
  @keyframes line-dissolve {
    20% { transform: scaleX(1.1); stroke: var(--c-fluid); opacity: 1; }
    100% { transform: scaleX(0); stroke: var(--c-fluid); opacity: 0; }
  }

  /* =======================================================================
     02. AIR (Brownian Dispersion)
     ======================================================================= */
  .a-pt { fill: var(--muted); stroke: none; transition: 0.3s; }
  
  .sensor-area:hover .a-pt { fill: var(--c-air); }
  .sensor-area:hover .a-pt.p1 { transform: translateY(-1px); }
  .sensor-area:hover .a-pt.p3 { transform: translateY(1px); }

  .active .a-pt.p1 { animation: air-disp1 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards; fill: var(--c-air); }
  .active .a-pt.p2 { animation: air-disp2 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; fill: var(--c-air); }
  .active .a-pt.p3 { animation: air-disp3 1.4s cubic-bezier(0.2, 1, 0.3, 1) forwards; fill: var(--c-air); }

  @keyframes air-disp1 { 100% { transform: translate(-10px, -15px) scale(0); opacity: 0; } }
  @keyframes air-disp2 { 100% { transform: translate(2px, -20px) scale(0); opacity: 0; } }
  @keyframes air-disp3 { 100% { transform: translate(12px, -12px) scale(0); opacity: 0; } }

  /* =======================================================================
     03. FIRE (Thermal Entropy)
     ======================================================================= */
  .z-ring { transform-origin: 12px 12px; transition: 0.3s; }
  .z-core { fill: var(--muted); stroke: none; transition: 0.3s; transform-origin: 12px 12px; }

  .sensor-area:hover .z-ring { stroke: var(--c-fire); stroke-dasharray: 2 4; transform: rotate(45deg); }
  .sensor-area:hover .z-core { fill: var(--c-fire); transform: scale(1.5); }

  .active .z-ring { animation: fire-shatter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; stroke: var(--c-fire); }
  .active .z-core { animation: fire-burnout 0.8s cubic-bezier(0.8, 0, 0.2, 1) forwards; fill: var(--c-fire); }

  @keyframes fire-shatter {
    10% { transform: scale(0.9); stroke-dasharray: 2 6; opacity: 1; }
    100% { transform: scale(3) rotate(90deg); stroke-dasharray: 1 12; opacity: 0; stroke-width: 0; }
  }
  @keyframes fire-burnout {
    20% { transform: scale(4); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* =======================================================================
     04. SPACE (Singularity Collapse)
     ======================================================================= */
  .s-ring { stroke-dasharray: 18.84 37.68; stroke-dashoffset: 0; transform-origin: 12px 12px; transition: 0.4s; }
  .s-mass { fill: var(--muted); stroke: none; transition: 0.4s; }

  .sensor-area:hover .s-ring { stroke: var(--c-space); transform: rotate(-45deg); }
  .sensor-area:hover .s-mass { fill: var(--c-space); transform: translate(3px, 3px); }

  .active .s-ring { animation: space-collapse 1s cubic-bezier(0.8, 0, 0.2, 1) forwards; stroke: var(--c-space); }
  .active .s-mass { animation: space-consume 1s cubic-bezier(0.8, 0, 0.2, 1) forwards; fill: var(--c-space); }

  @keyframes space-collapse {
    30% { stroke-dasharray: 37.68 37.68; transform: rotate(-90deg) scale(1); opacity: 1; stroke-width: 1.5px; }
    100% { stroke-dasharray: 37.68 37.68; transform: rotate(-90deg) scale(0); opacity: 0; stroke-width: 0px; }
  }
  @keyframes space-consume {
    30% { transform: translate(0, 8px) scale(0.5); opacity: 1; }
    100% { transform: translate(0, 8px) scale(0); opacity: 0; }
  }

  /* =======================================================================
     05. EARTH (Lattice Decay)
     ======================================================================= */
  .y-lat { transform-origin: 12px 12px; transition: 0.4s; }
  
  .sensor-area:hover .y-lat { stroke: var(--c-earth); }

  .active .y-lat { animation: lattice-decay 1.2s cubic-bezier(0.8, 0, 0.2, 1) forwards; stroke: var(--c-earth); }

  @keyframes lattice-decay {
    30% { transform: scaleX(0.05) scaleY(1); opacity: 1; }
    60% { transform: scaleX(0.05) scaleY(0.05); opacity: 1; stroke-width: 2px;}
    100% { transform: scaleX(0) scaleY(0); opacity: 0; stroke-width: 0; }
  }

</style>
</head>
<body>

  <div class="header">
    <h1>INSTRUMENTATION</h1>
    <p>Micro-scientific physics models. Click to trigger decay state.</p>
  </div>

  <div class="instrument-panel">

    <!-- FLUID -->
    <div class="module">
      <span class="mod-id">01</span>
      <div class="sensor-area" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24">
          <line class="f-line" x1="6" y1="14" x2="18" y2="14" />
          <circle class="f-drop" cx="12" cy="12" r="1.5" />
        </svg>
      </div>
      <span class="mod-name">Fluid</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- AIR -->
    <div class="module">
      <span class="mod-id">02</span>
      <div class="sensor-area" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24">
          <circle class="a-pt p1" cx="7" cy="12" r="1" />
          <circle class="a-pt p2" cx="12" cy="12" r="1" />
          <circle class="a-pt p3" cx="17" cy="12" r="1" />
        </svg>
      </div>
      <span class="mod-name">Air</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- FIRE -->
    <div class="module">
      <span class="mod-id">03</span>
      <div class="sensor-area" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24">
          <circle class="z-ring" cx="12" cy="12" r="6" />
          <circle class="z-core" cx="12" cy="12" r="1" />
        </svg>
      </div>
      <span class="mod-name">Fire</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- SPACE -->
    <div class="module">
      <span class="mod-id">04</span>
      <div class="sensor-area" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24">
          <!-- Arc is exactly half a circle length (2 * PI * 6 / 2 = 18.84) -->
          <circle class="s-ring" cx="12" cy="12" r="6" stroke-dasharray="18.84 37.68" stroke-dashoffset="0" />
          <circle class="s-mass" cx="12" cy="4" r="1.5" />
        </svg>
      </div>
      <span class="mod-name">Space</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- EARTH -->
    <div class="module">
      <span class="mod-id">05</span>
      <div class="sensor-area" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24">
          <polygon class="y-lat" points="12,4 20,12 12,20 4,12" />
        </svg>
      </div>
      <span class="mod-name">Earth</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

  </div>

  <script>
    function triggerAnim(element) {
      if (element.classList.contains('active')) return;
      element.classList.add('active');
      const module = element.closest('.module');
      // Show reset button after animation completes (~1.5s)
      setTimeout(() => {
        module.classList.add('completed');
      }, 1200);
    }

    function resetAnim(btn) {
      const module = btn.closest('.module');
      const area = module.querySelector('.sensor-area');
      module.classList.remove('completed');
      area.classList.remove('active');
      // Force DOM reflow
      void area.offsetWidth;
    }
  </script>
</body>
</html>
