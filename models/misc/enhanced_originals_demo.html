<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Original Easter Eggs</title>
<style>
  :root {
    --ink: #ededed;
    --paper: #111;
  }
  body {
    background-color: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 500px;
  }
  .card {
    background: var(--paper);
    padding: 25px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  /* Orb Base */
  .orb {
    display: block;
    width: 44px;
    height: 44px;
    flex: none;
    overflow: visible;
    color: var(--ink);
    transform-origin: 50% 50%;
    cursor: pointer;
    text-decoration: none;
    outline: none;
  }
  .orb * { transform-box: fill-box; }
  .orb svg { overflow: visible; }

  /* ------------------- 1. UFO ------------------- */
  .ufo-body { transition: transform 0.3s ease; animation: ufo-bob 3s ease-in-out infinite; }
  .ufo-beam { opacity: 0; transition: opacity 0.3s ease; transform-origin: 22px 24px;}
  .ufo-light { animation: ufo-blink 2s infinite; }
  .ufo-light.l2 { animation-delay: 0.3s; }
  .ufo-light.l3 { animation-delay: 0.6s; }

  .orb:hover .ufo-beam { opacity: 0.4; animation: beam-pulse 1.5s infinite; }
  .orb:hover .ufo-body { animation: ufo-bob-fast 0.8s ease-in-out infinite; }
  
  .orb.warp .ufo-body { animation: ufo-warp 0.6s cubic-bezier(0.5, 0, 0.2, 1) forwards; }
  .orb.warp .ufo-beam { opacity: 0; }

  @keyframes ufo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes ufo-bob-fast { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  @keyframes beam-pulse { 0%, 100% { transform: scaleX(1); opacity: 0.3; } 50% { transform: scaleX(1.2); opacity: 0.6; } }
  @keyframes ufo-blink { 0%, 100% { fill: #0ff; opacity: 1; } 50% { fill: #fff; opacity: 0.3; } }
  @keyframes ufo-warp { 
    0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px #0ff); } 
    20% { transform: translateY(10px) scale(1.1); } 
    100% { transform: translateY(-300px) scale(0.2); opacity: 0; } 
  }

  /* ------------------- 2. CHALK ------------------- */
  .chalk-body { transform-origin: 16px 32px; animation: chalk-float 4s ease-in-out infinite; }
  .chalk-dust { opacity: 0; }
  
  .orb:hover .chalk-body { animation: chalk-shake 0.3s infinite; }
  .orb:hover .chalk-dust.d1 { animation: dust-fall 1s infinite; }
  .orb:hover .chalk-dust.d2 { animation: dust-fall 1s infinite 0.3s; }
  .orb:hover .chalk-dust.d3 { animation: dust-fall 1s infinite 0.6s; }

  .orb.writing .chalk-body { animation: chalk-write 0.8s ease-in-out, chalk-drop 1s cubic-bezier(0.5, 0, 1, 1) 0.8s forwards; }

  @keyframes chalk-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(3deg); } }
  @keyframes chalk-shake { 0%, 100% { transform: rotate(0deg) translate(0); } 50% { transform: rotate(-5deg) translate(-1px, 1px); } }
  @keyframes dust-fall { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(15px); } }
  @keyframes chalk-write { 
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-10px, -5px); }
    40% { transform: translate(5px, 0px); }
    60% { transform: translate(-8px, -2px); }
    80% { transform: translate(10px, 2px); }
  }
  @keyframes chalk-drop { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(300px) rotate(-45deg); opacity: 0; } }

  /* ------------------- 3. FIREFLIES ------------------- */
  .wisp-center { transform-origin: 22px 22px; animation: wisp-spin 8s linear infinite; }
  .wisp { filter: drop-shadow(0 0 4px #adff2f); animation: wisp-pulse 2s infinite; }
  .wisp.w1 { animation-delay: 0s; transform-origin: 22px 12px; }
  .wisp.w2 { animation-delay: 0.5s; transform-origin: 14px 26px; }
  .wisp.w3 { animation-delay: 1s; transform-origin: 30px 26px; }

  .orb:hover .wisp-center { animation: wisp-spin 3s linear infinite; filter: drop-shadow(0 0 8px #adff2f); }
  .orb:hover .wisp { animation: wisp-pulse-fast 0.5s infinite; }

  .orb.scatter .wisp.w1 { animation: wisp-shoot-1 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  .orb.scatter .wisp.w2 { animation: wisp-shoot-2 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  .orb.scatter .wisp.w3 { animation: wisp-shoot-3 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }

  @keyframes wisp-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes wisp-pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }
  @keyframes wisp-pulse-fast { 0%, 100% { transform: scale(1.2); opacity: 0.8; } 50% { transform: scale(1.6); opacity: 1; } }
  
  @keyframes wisp-shoot-1 { 100% { transform: translate(0, -100px) scale(0); opacity: 0; } }
  @keyframes wisp-shoot-2 { 100% { transform: translate(-80px, 80px) scale(0); opacity: 0; } }
  @keyframes wisp-shoot-3 { 100% { transform: translate(80px, 80px) scale(0); opacity: 0; } }

  /* ------------------- 4. SAPLING ------------------- */
  .plant-wrapper { transform-origin: 22px 36px; transition: transform 0.3s; animation: plant-breathe 4s infinite; }
  .raindrop { opacity: 0; transform-origin: 22px 4px; }
  .leaf { transform-origin: 22px 26px; transition: transform 0.3s; }

  .orb:hover .plant-wrapper { animation: plant-wiggle 1s infinite; }
  .orb:hover .raindrop { animation: rain-fall 1.2s infinite; }

  .orb.bloom .plant-wrapper { animation: plant-grow 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  .orb.bloom .leaf { animation: leaf-bloom 1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  .orb.bloom .raindrop { display: none; }

  @keyframes plant-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.05); } }
  @keyframes plant-wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes rain-fall { 0% { opacity: 0; transform: translateY(-10px); } 50% { opacity: 1; transform: translateY(10px); } 100% { opacity: 0; transform: translateY(20px) scale(0.5); } }
  @keyframes plant-grow { 0% { transform: scaleY(1); } 50% { transform: scale(1.5) translateY(-5px); filter: drop-shadow(0 0 10px #32cd32); } 100% { transform: scale(2) translateY(-20px); opacity: 0; } }
  @keyframes leaf-bloom { 0% { transform: scale(1); } 100% { transform: scale(1.8) rotate(15deg); } }

  .hint {
    margin-top: 25px;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    grid-column: span 2;
  }
</style>
</head>
<body>

  <div class="grid-container">
    
    <!-- UFO -->
    <div class="card">
      <h1 class="title">Home
        <a class="orb ufo-orb" href="#" onclick="this.classList.add('warp'); setTimeout(() => this.classList.remove('warp'), 1500); return false;" title="UFO">
          <svg viewBox="0 0 44 44" width="44" height="44" fill="none" aria-hidden="true">
            <g class="ufo-body">
              <polygon class="ufo-beam" points="22,24 8,44 36,44" fill="rgba(0, 255, 255, 0.2)"/>
              <path d="M 16,22 C 16,14 28,14 28,22" fill="#c0d0f0"/>
              <ellipse cx="22" cy="22" rx="14" ry="4" fill="#888"/>
              <circle class="ufo-light l1" cx="12" cy="22" r="1.2" fill="#0ff"/>
              <circle class="ufo-light l2" cx="22" cy="23" r="1.2" fill="#0ff"/>
              <circle class="ufo-light l3" cx="32" cy="22" r="1.2" fill="#0ff"/>
            </g>
          </svg>
        </a>
      </h1>
    </div>

    <!-- CHALK -->
    <div class="card">
      <h1 class="title">Writing
        <a class="orb chalk-orb" href="#" onclick="this.classList.add('writing'); setTimeout(() => this.classList.remove('writing'), 2000); return false;" title="Chalk">
          <svg viewBox="0 0 44 44" width="44" height="44" fill="none" aria-hidden="true">
            <g class="chalk-body">
              <polygon points="26,10 32,12 22,34 16,32" fill="#eee" />
              <polygon points="16,32 22,34 18,36" fill="#ccc" />
              <circle class="chalk-dust d1" cx="18" cy="38" r="1" fill="#fff"/>
              <circle class="chalk-dust d2" cx="22" cy="40" r="1" fill="#fff"/>
              <circle class="chalk-dust d3" cx="14" cy="36" r="1" fill="#fff"/>
            </g>
          </svg>
        </a>
      </h1>
    </div>

    <!-- FIREFLIES -->
    <div class="card">
      <h1 class="title">CV
        <a class="orb wisp-orb" href="#" onclick="this.classList.add('scatter'); setTimeout(() => this.classList.remove('scatter'), 1500); return false;" title="Wisp">
          <svg viewBox="0 0 44 44" width="44" height="44" fill="none" aria-hidden="true">
            <g class="wisp-center">
              <circle class="wisp w1" cx="22" cy="12" r="2.5" fill="#adff2f"/>
              <circle class="wisp w2" cx="14" cy="26" r="1.5" fill="#adff2f"/>
              <circle class="wisp w3" cx="30" cy="26" r="2" fill="#adff2f"/>
            </g>
          </svg>
        </a>
      </h1>
    </div>

    <!-- SAPLING -->
    <div class="card">
      <h1 class="title">Sitemap
        <a class="orb sapling-orb" href="#" onclick="this.classList.add('bloom'); setTimeout(() => this.classList.remove('bloom'), 1500); return false;" title="Sapling">
          <svg viewBox="0 0 44 44" width="44" height="44" fill="none" aria-hidden="true">
            <line x1="8" y1="36" x2="36" y2="36" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round"/>
            <path class="raindrop" d="M 22,4 Q 24,8 22,12 Q 20,8 22,4" fill="#00bfff"/>
            <g class="plant-wrapper">
              <path d="M 22,36 Q 22,26 22,20" stroke="#32cd32" stroke-width="2" fill="none" stroke-linecap="round"/>
              <path class="leaf" d="M 22,26 Q 16,24 16,20 Q 20,20 22,26" fill="#32cd32"/>
              <path class="leaf" d="M 22,22 Q 28,18 28,14 Q 24,14 22,22" fill="#32cd32"/>
            </g>
          </svg>
        </a>
      </h1>
    </div>

    <div class="hint">Hover to excite • Click to transition</div>
  </div>

</body>
</html>
