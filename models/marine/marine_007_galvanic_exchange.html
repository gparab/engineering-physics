<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galvanic Exchange</title>
<style>
  body { margin: 0; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .icon-container { position: relative; width: 40px; height: 30px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .electrolyte { position: absolute; width: 40px; height: 20px; background: rgba(0,0,255,0.1); bottom: 0; border-radius: 2px; }
  .anode { position: absolute; width: 10px; height: 15px; background: #D0021B; left: 5px; bottom: 2px; }
  .cathode { position: absolute; width: 10px; height: 15px; background: #4A4A4A; right: 5px; bottom: 2px; }
  .wire { position: absolute; width: 22px; height: 1px; background: #333; top: 8px; left: 9px; }
  .ion { position: absolute; width: 2px; height: 2px; background: #D0021B; border-radius: 50%; opacity: 0; }
  .rust-pixel { position: absolute; width: 4px; height: 4px; background: #D0021B; opacity: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div class="icon-container" id="icon">
    <div class="electrolyte"></div>
    <div class="wire"></div>
    <div class="anode" id="anode"></div>
    <div class="cathode" id="cathode"></div>
  </div>
  <script>
    const icon = document.getElementById('icon');
    const anode = document.getElementById('anode');
    let isAnimating = false;

    // Idle: microscopic ions detach and drift
    let ionInterval = setInterval(() => {
      if(isAnimating) return;
      let i = document.createElement('div');
      i.className = 'ion';
      icon.appendChild(i);
      gsap.set(i, { x: 10, y: 15 + Math.random() * 10, opacity: 1 });
      
      gsap.to(i, {
        x: 25,
        y: 15 + Math.random() * 10,
        duration: 1.5,
        ease: "sine.inOut",
        onComplete: () => {
          gsap.to(i, { opacity: 0, duration: 0.2, onComplete: () => i.remove() });
        }
      });
    }, 600);

    icon.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;
      clearInterval(ionInterval);

      // Flash wire to show massive stray current
      gsap.to('.wire', { backgroundColor: '#FFD700', height: 2, duration: 0.2, yoyo: true, repeat: 3 });

      // Anode rapid oxidation
      gsap.to(anode, { opacity: 0, duration: 0.5, delay: 0.4 });
      
      // Cloud of rust pixels
      setTimeout(() => {
        for(let i=0; i<100; i++) {
          let p = document.createElement('div');
          p.className = 'rust-pixel';
          document.body.appendChild(p);
          
          let rect = anode.getBoundingClientRect();
          gsap.set(p, {
            x: rect.left + Math.random()*10,
            y: rect.top + Math.random()*15,
            opacity: 1
          });
          
          let angle = Math.random() * Math.PI * 2;
          let dist = Math.random() * window.innerWidth / 2;
          
          gsap.to(p, {
            x: `+=${Math.cos(angle) * dist}`,
            y: `+=${Math.sin(angle) * dist}`,
            opacity: 0,
            rotation: Math.random() * 360,
            duration: 1.5 + Math.random(),
            ease: "power2.out"
          });
        }
      }, 400);
    });
  </script>
</body>
</html>
