<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase Shift Keying (PSK)</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0d0d0d;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 600px;
        height: 200px;
        cursor: pointer;
    }
    svg {
        width: 100%;
        height: 100%;
    }
    .axis {
        stroke: #555;
        stroke-width: 1;
    }
    .wave {
        fill: none;
        stroke: #2980B9;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
</style>
</head>
<body>
<div id="container">
    <svg viewBox="0 0 600 200">
        <line x1="0" y1="100" x2="600" y2="100" class="axis" />
        <path class="wave" id="wave-path" d="" />
    </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const path = document.getElementById('wave-path');
    let bits = [1, 0, 1, 1, 0, 1]; // PSK bits
    let tOffset = 0;
    let isJittering = false;
    let jitterAmount = 0;
    let flatRatio = 0;

    function renderWave() {
        let d = `M 0 100 `;
        for(let x=0; x<=600; x+=2) {
            // determine bit index based on x
            let realX = x + tOffset;
            let bitIdx = Math.floor((realX / 100) % bits.length);
            let phase = bits[bitIdx] === 1 ? 0 : Math.PI;
            
            // add jitter if needed
            let currentPhase = phase + (Math.random() - 0.5) * jitterAmount;
            
            // calculate y
            let y = Math.sin(realX * 0.05 + currentPhase) * 50;
            
            // flatten
            y = y * (1 - flatRatio);
            
            d += `L ${x} ${100 - y} `;
        }
        path.setAttribute('d', d);
    }

    let loop = setInterval(() => {
        tOffset += 2;
        renderWave();
    }, 16);

    let clicked = false;
    document.getElementById('container').addEventListener('click', () => {
        if(clicked) return;
        clicked = true;
        
        // click: phase jitter increases, then flattens to DC line, vanishes
        gsap.to(window, { jitterAmount: Math.PI * 4, duration: 1, ease: "power1.in" });
        gsap.to(window, { flatRatio: 1, duration: 0.5, delay: 1, ease: "power2.out" });
        gsap.to(path, { opacity: 0, duration: 0.5, delay: 1.5, onComplete: () => clearInterval(loop) });
    });
</script>
</body>
</html>
