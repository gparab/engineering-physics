<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spread Spectrum (CDMA)</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0d0d0d;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 400px;
        height: 300px;
        cursor: pointer;
        border-bottom: 2px solid #555;
    }
    .noise-floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: repeating-linear-gradient(
            45deg,
            #222,
            #222 5px,
            #333 5px,
            #333 10px
        );
        opacity: 0.7;
    }
    
    .signal-wide {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 30px;
        background-color: rgba(231, 76, 60, 0.4);
    }
    
    .signal-spike {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 200px;
        background-color: #E74C3C;
        opacity: 0;
    }
    
    .shard {
        position: absolute;
        bottom: 0;
        width: 2px;
        height: 20px;
        background-color: #E74C3C;
        opacity: 0;
    }
</style>
</head>
<body>
<div id="container">
    <div class="signal-wide" id="wide"></div>
    <div class="noise-floor" id="noise"></div>
    <div class="signal-spike" id="spike"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const wide = document.getElementById('wide');
    const container = document.getElementById('container');
    
    // Idle: smearing effect
    const idleTL = gsap.to(wide, {
        width: "320px", 
        height: "28px", 
        opacity: 0.3,
        duration: 0.1, 
        yoyo: true, 
        repeat: -1,
        ease: "rough({ template: none.out, strength: 1, points: 20, taper: none, randomize: true, clamp: false })"
    });

    let clicked = false;
    container.addEventListener('click', () => {
        if(clicked) return;
        clicked = true;
        idleTL.kill();
        
        // click: wide signal snaps back to spike, then shatters
        gsap.to(wide, { width: "10px", height: "200px", opacity: 1, duration: 0.2, ease: "power4.in", onComplete: () => {
            wide.style.display = 'none';
            gsap.set('#spike', { opacity: 1 });
            
            // shatter
            gsap.set('#spike', { opacity: 0 });
            for(let i=0; i<30; i++) {
                const shard = document.createElement('div');
                shard.className = 'shard';
                shard.style.left = '50%';
                shard.style.bottom = (Math.random() * 200) + 'px';
                container.appendChild(shard);
                
                const angle = (Math.random() - 0.5) * Math.PI;
                const distance = 100 + Math.random() * 200;
                gsap.to(shard, {
                    x: Math.sin(angle) * distance,
                    y: -Math.cos(angle) * distance,
                    rotation: Math.random() * 720,
                    opacity: 0,
                    duration: 0.6 + Math.random() * 0.4,
                    ease: "power2.out"
                });
            }
        }});
    });
</script>
</body>
</html>
