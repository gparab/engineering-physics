<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength Division Multiplexing</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0d0d0d;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 400px;
        height: 300px;
        cursor: pointer;
    }
    .fiber {
        position: absolute;
        top: 140px;
        left: 200px;
        width: 180px;
        height: 20px;
        border: 2px solid #333;
        border-radius: 10px;
        overflow: hidden;
        background: rgba(255,255,255,0.05);
    }
    .prism {
        position: absolute;
        top: 110px;
        left: 100px;
        width: 0;
        height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 80px solid rgba(142, 68, 173, 0.4);
        transform-origin: center;
    }
    .laser-in {
        position: absolute;
        width: 80px;
        height: 2px;
        left: 20px;
    }
    .laser-in.red { top: 120px; background: #e74c3c; transform: rotate(15deg); }
    .laser-in.green { top: 150px; background: #2ecc71; }
    .laser-in.blue { top: 180px; background: #3498db; transform: rotate(-15deg); }
    
    .wave {
        position: absolute;
        top: 0;
        left: -180px;
        width: 180px;
        height: 20px;
        opacity: 0.8;
    }
    .wave svg { width: 100%; height: 100%; }
    
    .rainbow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        background: transparent;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: none;
        opacity: 0;
    }
</style>
</head>
<body>
<div id="container">
    <div class="laser-in red" id="r-in"></div>
    <div class="laser-in green" id="g-in"></div>
    <div class="laser-in blue" id="b-in"></div>
    
    <div class="prism" id="prism"></div>
    
    <div class="fiber" id="fiber">
        <div class="wave" id="w1">
            <svg viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0,10 Q25,0 50,10 T100,10" fill="none" stroke="#e74c3c" stroke-width="2"/>
            </svg>
        </div>
        <div class="wave" id="w2">
            <svg viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0,10 Q25,20 50,10 T100,10" fill="none" stroke="#2ecc71" stroke-width="2"/>
            </svg>
        </div>
        <div class="wave" id="w3">
            <svg viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0,10 Q25,5 50,10 T100,10" fill="none" stroke="#3498db" stroke-width="2"/>
            </svg>
        </div>
    </div>
    <div class="rainbow" id="rainbow"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const idleTL = gsap.timeline({ repeat: -1 });
    idleTL.to(['#w1', '#w2', '#w3'], {
        x: 360,
        duration: 2,
        ease: "none",
        stagger: 0.1
    });

    let clicked = false;
    document.getElementById('container').addEventListener('click', () => {
        if(clicked) return;
        clicked = true;
        idleTL.kill();
        
        // click: prism shatters, colors separate violently
        gsap.to(['#r-in', '#g-in', '#b-in'], { opacity: 0, duration: 0.2 });
        gsap.to('#fiber', { opacity: 0, duration: 0.2 });
        
        gsap.to('#prism', { 
            scale: 2, 
            opacity: 0, 
            rotation: 180, 
            duration: 0.5, 
            ease: "power2.out" 
        });
        
        const rainbow = document.getElementById('rainbow');
        gsap.to(rainbow, {
            opacity: 1,
            duration: 0.1
        });
        
        const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6'];
        let shadow = '';
        for(let i=0; i<50; i++) {
            const r = Math.random() * 300;
            const a = Math.random() * Math.PI * 2;
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            const color = colors[Math.floor(Math.random() * colors.length)];
            shadow += `${x}px ${y}px 0 2px ${color}${i<49?',':''}`;
        }
        
        gsap.set(rainbow, { boxShadow: shadow });
        gsap.to(rainbow, {
            scale: 5,
            opacity: 0,
            duration: 1.5,
            ease: "expo.out"
        });
    });
</script>
</body>
</html>
