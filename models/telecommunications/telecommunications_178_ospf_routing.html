<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPF Routing</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0d0d0d;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 400px;
        height: 300px;
        cursor: pointer;
    }
    svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    .link {
        stroke: #333;
        stroke-width: 2;
        transition: stroke 0.3s, stroke-width 0.3s;
    }
    .link.active {
        stroke: #3498DB;
        stroke-width: 3;
    }
    .router {
        position: absolute;
        width: 30px;
        height: 30px;
        background: #222;
        border: 2px solid #3498DB;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #3498DB;
        font-family: sans-serif;
        font-size: 10px;
        font-weight: bold;
    }
    .lsa {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 2px solid #f1c40f;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
    }
    .packet {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #e74c3c;
        border-radius: 2px;
        transform: translate(-50%, -50%);
        opacity: 0;
    }
</style>
</head>
<body>
<div id="container">
    <svg id="links-svg"></svg>
    <div class="router" id="r1" style="left: 200px; top: 50px;">R1</div>
    <div class="router" id="r2" style="left: 100px; top: 150px;">R2</div>
    <div class="router" id="r3" style="left: 300px; top: 150px;">R3</div>
    <div class="router" id="r4" style="left: 200px; top: 250px;">R4</div>
    <div class="packet" id="packet"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const svg = document.getElementById('links-svg');
    const container = document.getElementById('container');
    
    const nodes = {
        r1: {x: 200, y: 50},
        r2: {x: 100, y: 150},
        r3: {x: 300, y: 150},
        r4: {x: 200, y: 250}
    };
    
    const links = [
        ['r1', 'r2', 'l12'],
        ['r1', 'r3', 'l13'],
        ['r2', 'r4', 'l24'],
        ['r3', 'r4', 'l34'],
        ['r2', 'r3', 'l23']
    ];
    
    links.forEach(l => {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', nodes[l[0]].x);
        line.setAttribute('y1', nodes[l[0]].y);
        line.setAttribute('x2', nodes[l[1]].x);
        line.setAttribute('y2', nodes[l[1]].y);
        line.setAttribute('class', 'link');
        line.setAttribute('id', l[2]);
        svg.appendChild(line);
    });

    // Idle: LSA flashing, tree recalculates
    let activeTree = 0;
    let idleLoop = setInterval(() => {
        // flash LSA from random router
        const rKeys = Object.keys(nodes);
        const r = nodes[rKeys[Math.floor(Math.random()*rKeys.length)]];
        
        const lsa = document.createElement('div');
        lsa.className = 'lsa';
        lsa.style.left = r.x + 'px';
        lsa.style.top = r.y + 'px';
        container.appendChild(lsa);
        
        gsap.to(lsa, { scale: 5, opacity: 0, duration: 1, onComplete: () => lsa.remove() });
        
        // toggle shortest path tree
        document.querySelectorAll('.link').forEach(el => el.classList.remove('active'));
        if(activeTree === 0) {
            ['l12', 'l13', 'l24'].forEach(id => document.getElementById(id).classList.add('active'));
            activeTree = 1;
        } else {
            ['l12', 'l23', 'l34'].forEach(id => document.getElementById(id).classList.add('active'));
            activeTree = 0;
        }
    }, 2000);

    // Initial tree
    ['l12', 'l13', 'l24'].forEach(id => document.getElementById(id).classList.add('active'));

    let clicked = false;
    container.addEventListener('click', () => {
        if(clicked) return;
        clicked = true;
        clearInterval(idleLoop);
        
        // activate loop links (R2 -> R3 -> R4 -> R2)
        document.querySelectorAll('.link').forEach(el => el.classList.remove('active'));
        ['l23', 'l34', 'l24'].forEach(id => document.getElementById(id).classList.add('active'));
        
        const pkt = document.getElementById('packet');
        gsap.set(pkt, { opacity: 1, left: nodes.r2.x, top: nodes.r2.y });
        
        // TTL loop
        let tl = gsap.timeline();
        for(let i=0; i<4; i++) {
            tl.to(pkt, { left: nodes.r3.x, top: nodes.r3.y, duration: 0.3, ease: "none" })
              .to(pkt, { left: nodes.r4.x, top: nodes.r4.y, duration: 0.3, ease: "none" })
              .to(pkt, { left: nodes.r2.x, top: nodes.r2.y, duration: 0.3, ease: "none" });
        }
        
        // vaporize
        tl.to(pkt, { scale: 3, opacity: 0, background: '#fff', duration: 0.5 });
        tl.to('.link', { stroke: '#333', duration: 0.5 }, "-=0.5");
    });
</script>
</body>
</html>
