<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .container { position: relative; cursor: pointer; }
  canvas { display: block; }
  .label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 1px; color: #8b949e; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="container" id="container">
  <canvas id="simCanvas" width="400" height="400"></canvas>
  <div class="label">Hamming Code</div>
</div>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const COLOR = '#34495E';
const SENTINEL_COLOR = '#E74C3C';
let state = 'idle';
let time = 0;
let bits = [0,1,1,0,1,0,1];
let isParity = [true, true, false, true, false, false, false];
let flipIdx = -1;
let flipTimer = 0;
let particles = [];

document.getElementById('container').addEventListener('click', () => {
  if (state === 'idle') {
    state = 'clicked';
    for(let i=0; i<300; i++) {
       particles.push({
         x: 100 + Math.random()*200, y: 200,
         vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15 + 5,
         life: 1
       });
    }
  }
});

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  time += 1;
  
  if (state === 'idle') {
    if (time % 120 === 0) {
      flipIdx = Math.floor(Math.random()*7);
      if(!isParity[flipIdx]) {
        bits[flipIdx] = 1 - bits[flipIdx];
        flipTimer = 60;
      }
    }
    if (flipTimer > 0) {
      flipTimer--;
      if (flipTimer === 0 && flipIdx !== -1) {
        bits[flipIdx] = 1 - bits[flipIdx]; 
      }
    }
    
    for(let i=0; i<7; i++) {
      let x = 80 + i * 35;
      if (isParity[i]) {
        ctx.fillStyle = (flipTimer > 0) ? SENTINEL_COLOR : '#8b949e';
      } else {
        ctx.fillStyle = (i === flipIdx && flipTimer > 0) ? '#fff' : COLOR;
      }
      ctx.fillRect(x, 185, 25, 30);
      ctx.fillStyle = '#000';
      ctx.font = '16px monospace';
      ctx.fillText(bits[i], x+8, 205);
    }
  } else {
    ctx.fillStyle = '#111';
    for(let p of particles) {
      p.x += p.vx; p.y += p.vy; p.life -= 0.01;
      if (p.life > 0) {
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 10, 10);
      }
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
