<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photonic Crystal Bandgap</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        overflow: hidden;
        font-family: sans-serif;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
        cursor: pointer;
    }
    .lattice {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        width: 100%;
        height: 100%;
    }
    .sphere {
        width: 8px;
        height: 8px;
        background: radial-gradient(circle at 30% 30%, #e67e22, #a04000);
        border-radius: 50%;
        box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    
    .wave-pass {
        position: absolute;
        top: 5px; left: -20px;
        width: 15px; height: 2px;
        background: #3498db;
        opacity: 0.6;
        animation: passThru 3s infinite linear;
    }
    .wave-reflect {
        position: absolute;
        top: 25px; left: -20px;
        width: 15px; height: 2px;
        background: #e74c3c;
        box-shadow: 0 0 4px #e74c3c;
        animation: reflectBack 3s infinite linear;
    }

    @keyframes passThru {
        0% { left: -20px; opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { left: 50px; opacity: 0; }
    }
    @keyframes reflectBack {
        0% { left: -20px; opacity: 0; }
        20% { opacity: 1; }
        45% { left: -2px; opacity: 1; }
        55% { left: -2px; opacity: 1; }
        80% { opacity: 1; }
        100% { left: -20px; opacity: 0; }
    }

    /* Click Animation Elements */
    .defect-channel {
        position: absolute;
        top: 50%; left: 0;
        width: 100vw; height: 10px;
        transform: translateY(-50%);
        display: none;
        pointer-events: none;
    }
    .glowing-path {
        position: absolute;
        top: 0; left: 0;
        width: 0; height: 100%;
        background: #e67e22;
        box-shadow: 0 0 20px #e67e22, 0 0 40px #e67e22, 0 0 80px #e67e22;
        transition: width 0.3s cubic-bezier(0.8, 0, 0.2, 1);
        border-radius: 5px;
    }
</style>
</head>
<body>

<div id="container" onclick="triggerDefect()">
    <div class="lattice" id="lattice">
        <!-- 16 spheres -->
        <div class="sphere"></div><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div>
        <div class="sphere"></div><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div>
        <div class="sphere"></div><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div>
        <div class="sphere"></div><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div>
    </div>
    <div class="wave-pass" id="wp"></div>
    <div class="wave-reflect" id="wr"></div>
</div>

<div class="defect-channel" id="defectCh">
    <div class="glowing-path" id="gPath"></div>
</div>

<script>
    function triggerDefect() {
        const lattice = document.getElementById('lattice');
        const wp = document.getElementById('wp');
        const wr = document.getElementById('wr');
        const defectCh = document.getElementById('defectCh');
        const gPath = document.getElementById('gPath');
        const container = document.getElementById('container');
        
        // Create defect by hiding middle row spheres
        const spheres = lattice.getElementsByClassName('sphere');
        spheres[4].style.opacity = 0;
        spheres[5].style.opacity = 0;
        spheres[6].style.opacity = 0;
        spheres[7].style.opacity = 0;
        
        wp.style.display = 'none';
        wr.style.display = 'none';
        
        setTimeout(() => {
            container.style.display = 'none';
            defectCh.style.display = 'block';
            
            // Trapped light races through
            setTimeout(() => {
                gPath.style.width = '100vw';
                
                setTimeout(() => {
                    gPath.style.opacity = '0';
                    gPath.style.transition = 'opacity 0.5s';
                }, 300);
            }, 50);
        }, 300);
    }
</script>

</body>
</html>
