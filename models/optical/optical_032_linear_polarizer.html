<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Polarizer</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        overflow: hidden;
        font-family: sans-serif;
    }
    #container {
        position: relative;
        width: 60px;
        height: 40px;
        cursor: pointer;
    }
    .grid {
        position: absolute;
        top: 0; left: 30px;
        width: 4px; height: 40px;
        background: repeating-linear-gradient(0deg, #34495e, #34495e 2px, transparent 2px, transparent 4px);
        border-left: 1px solid #34495e;
        border-right: 1px solid #34495e;
    }
    .unpolarized {
        position: absolute;
        top: 15px; left: 0;
        width: 25px; height: 10px;
        display: flex;
        align-items: center;
    }
    .u-wave {
        position: absolute;
        width: 25px; height: 2px;
        background: #fff;
        opacity: 0.5;
        animation: waveMove 1s infinite linear;
    }
    .u1 { transform: rotate(0deg); }
    .u2 { transform: rotate(45deg); }
    .u3 { transform: rotate(90deg); }
    .u4 { transform: rotate(135deg); }
    
    .polarized {
        position: absolute;
        top: 19px; left: 35px;
        width: 25px; height: 2px;
        background: #fff;
        opacity: 0.8;
        box-shadow: 0 0 4px #fff;
        animation: waveMove 1s infinite linear;
    }

    @keyframes waveMove {
        0% { filter: blur(0px); opacity: 0.3; }
        50% { filter: blur(1px); opacity: 1; }
        100% { filter: blur(0px); opacity: 0.3; }
    }

    /* Click Animation Elements */
    .analyzer {
        position: absolute;
        top: 50%; left: 50%;
        width: 200px; height: 200px;
        margin-top: -100px; margin-left: -100px;
        background: repeating-linear-gradient(0deg, #34495e, #34495e 4px, transparent 4px, transparent 8px);
        border: 2px solid #34495e;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        transition: transform 1s ease-in-out, opacity 0.3s;
        z-index: 10;
    }
    .pitch-black {
        position: absolute;
        top: 50%; left: 50%;
        width: 0; height: 0;
        background: #000;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 5;
    }
</style>
</head>
<body>

<div id="container" onclick="triggerAnalyzer()">
    <div class="unpolarized">
        <div class="u-wave u1"></div>
        <div class="u-wave u2"></div>
        <div class="u-wave u3"></div>
        <div class="u-wave u4"></div>
    </div>
    <div class="grid"></div>
    <div class="polarized"></div>
</div>

<div class="analyzer" id="analyzer"></div>
<div class="pitch-black" id="blackout"></div>

<script>
    function triggerAnalyzer() {
        const analyzer = document.getElementById('analyzer');
        const blackout = document.getElementById('blackout');
        const container = document.getElementById('container');
        
        container.style.display = 'none';
        
        analyzer.style.opacity = '1';
        
        // Rotate analyzer 90 degrees
        setTimeout(() => {
            analyzer.style.transform = 'rotate(90deg)';
            
            // As it rotates, blackout the screen
            setTimeout(() => {
                blackout.style.transition = 'width 1s ease-in, height 1s ease-in';
                blackout.style.width = '300vw';
                blackout.style.height = '300vw';
                
                setTimeout(() => {
                    analyzer.style.opacity = '0';
                }, 800);
            }, 200);
        }, 100);
    }
</script>

</body>
</html>
