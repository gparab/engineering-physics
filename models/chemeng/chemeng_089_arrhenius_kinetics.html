<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrhenius Kinetics</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; cursor: pointer; overflow: hidden; }
        #container { width: 80px; height: 60px; position: relative; }
        svg { width: 100%; height: 100%; overflow: visible; }
        .curve { fill: none; stroke: #555; stroke-width: 2; stroke-linecap: round; }
        .particle { position: absolute; width: 8px; height: 8px; background-color: #DC143C; border-radius: 50%; box-shadow: 0 0 5px #DC143C; }
    </style>
</head>
<body>
    <div id="container">
        <svg viewBox="0 0 80 60">
            <!-- Reactant well at x=15, barrier at x=40, product well at x=65 -->
            <path class="curve" d="M 0,30 C 10,30 10,50 20,50 C 30,50 30,10 40,10 C 50,10 50,60 65,60 C 75,60 80,60 80,60" id="energyCurve"/>
        </svg>
        <!-- The visual particle -->
        <div class="particle" id="particle"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- MotionPathPlugin for the particle to follow the path -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
    <script>
        gsap.registerPlugin(MotionPathPlugin);

        const particle = document.getElementById('particle');
        
        // Start position in the reactant well
        gsap.set(particle, { x: 16, y: 46 });

        // Idle vibration and occasionally creeping up slightly
        let idleTimeline = gsap.timeline({ repeat: -1 });
        idleTimeline.to(particle, { x: "+=2", y: "-=1", duration: 0.1, yoyo: true, repeat: 5 })
                    .to(particle, { x: 25, y: 35, duration: 0.5, ease: "power1.inOut" })
                    .to(particle, { x: 16, y: 46, duration: 0.5, ease: "power1.inOut" })
                    .to(particle, { x: "-=2", y: "-=1", duration: 0.1, yoyo: true, repeat: 5 });

        let clicked = false;
        document.body.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;

            idleTimeline.kill();

            // Particle glows and gains energy
            gsap.to(particle, { scale: 1.5, boxShadow: "0 0 15px #DC143C", duration: 0.3 });

            // Leap over barrier and slide into product well
            gsap.to(particle, {
                motionPath: {
                    path: "#energyCurve",
                    align: "#energyCurve",
                    alignOrigin: [0.5, 0.5],
                    start: 0.2, // ~x=16
                    end: 0.85   // ~x=65
                },
                duration: 1.5,
                ease: "power1.inOut",
                onComplete: () => {
                    // Flash and dissolve
                    gsap.to(particle, { scale: 3, opacity: 0, duration: 0.5 });
                }
            });
        });
    </script>
</body>
</html>
