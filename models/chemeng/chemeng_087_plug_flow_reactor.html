<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plug Flow Reactor</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; cursor: pointer; overflow: hidden; }
        #container { width: 60px; height: 20px; position: relative; }
        .tube { position: absolute; width: 100%; height: 100%; border: 2px solid #555; border-radius: 10px; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; }
        .plug { position: absolute; width: 15px; height: 100%; border-radius: 5px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="container">
        <div class="tube" id="tube"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const tube = document.getElementById('tube');
        const plugs = [];
        
        for (let i = 0; i < 5; i++) {
            let plug = document.createElement('div');
            plug.className = 'plug';
            tube.appendChild(plug);
            plugs.push(plug);
            
            gsap.set(plug, { x: -20, backgroundColor: "#FF8C00" });
            
            // Loop animation
            gsap.to(plug, {
                x: 60,
                backgroundColor: "#2ECC71", // fading to product
                duration: 2,
                repeat: -1,
                delay: i * 0.4,
                ease: "none"
            });
        }

        let clicked = false;
        document.body.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;

            // Stop normal flow
            plugs.forEach(p => gsap.killTweensOf(p));
            
            // High velocity purge
            gsap.to(plugs, {
                x: window.innerWidth + 100,
                duration: 0.3,
                ease: "power2.in",
                stagger: 0.05
            });
            
            gsap.to(tube, {
                scaleX: 0,
                transformOrigin: "left center",
                opacity: 0,
                duration: 0.5,
                delay: 0.2,
                ease: "power2.in"
            });
        });
    </script>
</body>
</html>
