<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppler Effect</title>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #fdfdfd;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 100px;
        height: 60px;
        cursor: pointer;
    }
    #source {
        position: absolute;
        top: 28px;
        left: 20px;
        width: 4px;
        height: 4px;
        background-color: #e74c3c;
        border-radius: 50%;
        z-index: 10;
    }
    .wavefront {
        position: absolute;
        border: 1px solid rgba(231, 76, 60, 0.5);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
    .mach-cone {
        position: absolute;
        top: 50%;
        left: 0;
        width: 0;
        height: 0;
        border-top: 100vh solid transparent;
        border-bottom: 100vh solid transparent;
        border-left: 200vw solid rgba(231, 76, 60, 0.3);
        transform: translateY(-50%) translateX(-200vw);
        pointer-events: none;
        z-index: 20;
    }
    .muter {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #333;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
    }
</style>
</head>
<body>

<div class="muter" id="muter"></div>
<div class="mach-cone" id="machCone"></div>

<div id="container">
    <div id="source"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const container = document.getElementById('container');
    const source = document.getElementById('source');
    
    let isIdle = true;
    let sourcePos = 20;

    // Source moves right slowly
    gsap.to(source, {
        left: 80,
        duration: 4,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        onUpdate: function() {
            sourcePos = parseFloat(source.style.left);
        }
    });

    function spawnWavefront() {
        if (!isIdle) return;
        
        const wf = document.createElement('div');
        wf.classList.add('wavefront');
        wf.style.left = sourcePos + 2 + 'px'; // center of source
        wf.style.top = '30px';
        wf.style.width = '0px';
        wf.style.height = '0px';
        container.appendChild(wf);
        
        gsap.to(wf, {
            width: 40,
            height: 40,
            opacity: 0,
            duration: 1.5,
            ease: "none",
            onComplete: () => wf.remove()
        });
        
        setTimeout(spawnWavefront, 250);
    }
    spawnWavefront();

    let clicked = false;
    container.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        isIdle = false;
        
        gsap.killTweensOf(source);
        
        // Remove old waves
        document.querySelectorAll('.wavefront').forEach(el => el.remove());

        // Accelerate past Mach 1
        const cone = document.getElementById('machCone');
        const muter = document.getElementById('muter');

        gsap.to(source, {
            left: '200vw',
            duration: 1.5,
            ease: "power2.in"
        });

        // The Mach cone follows
        setTimeout(() => {
            gsap.to(cone, {
                x: '100vw',
                duration: 1,
                ease: "none"
            });
            gsap.to(muter, {
                opacity: 1,
                duration: 1,
                ease: "none"
            });
            gsap.to(container, {opacity: 0, duration: 0.5});
        }, 500);
    });
</script>
</body>
</html>
