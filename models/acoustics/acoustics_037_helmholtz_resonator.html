<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helmholtz Resonator</title>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f3f4;
        overflow: hidden;
    }
    #resonator {
        position: relative;
        width: 24px;
        height: 30px;
        cursor: pointer;
    }
    .neck {
        position: absolute;
        top: 0;
        left: 8px;
        width: 8px;
        height: 10px;
        border-left: 2px solid #16a085;
        border-right: 2px solid #16a085;
        box-sizing: border-box;
    }
    .cavity {
        position: absolute;
        top: 10px;
        left: 0;
        width: 24px;
        height: 20px;
        border: 2px solid #16a085;
        border-top: none;
        border-radius: 0 0 12px 12px;
        box-sizing: border-box;
    }
    .cavity::before, .cavity::after {
        content: '';
        position: absolute;
        top: 0;
        width: 6px;
        height: 2px;
        background-color: #16a085;
    }
    .cavity::before { left: 0; }
    .cavity::after { right: 0; }

    .air-mass {
        position: absolute;
        top: 2px;
        left: 10px;
        width: 4px;
        height: 6px;
        background-color: rgba(22, 160, 133, 0.5);
        border-radius: 2px;
    }
    
    .radiate {
        position: absolute;
        top: -10px;
        left: 12px;
        width: 0px;
        height: 0px;
        border: 1px solid rgba(22, 160, 133, 0.5);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .shatter-piece {
        position: absolute;
        background-color: #16a085;
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="resonator">
    <div class="neck"></div>
    <div class="cavity"></div>
    <div class="air-mass" id="airMass"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const airMass = document.getElementById('airMass');
    const resonator = document.getElementById('resonator');

    // Idle animation: Air mass bobbing
    const bob = gsap.to(airMass, {
        y: 6,
        duration: 0.3,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut",
        onRepeat: () => {
            // Radiate sound
            const wave = document.createElement('div');
            wave.classList.add('radiate');
            resonator.appendChild(wave);
            gsap.to(wave, {
                width: 40,
                height: 40,
                opacity: 0,
                duration: 1,
                ease: "power1.out",
                onComplete: () => wave.remove()
            });
        }
    });

    let clicked = false;
    resonator.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        
        bob.kill();

        // Build up oscillation
        gsap.to(airMass, {
            y: 15,
            duration: 0.05,
            yoyo: true,
            repeat: 20,
            ease: "sine.inOut",
            onComplete: shatter
        });
        
        gsap.to(resonator, {
            scale: 1.2,
            duration: 1,
            ease: "power2.in"
        });
    });

    function shatter() {
        resonator.innerHTML = ''; // Clear contents
        
        // Create shatter pieces
        for (let i = 0; i < 30; i++) {
            const piece = document.createElement('div');
            piece.classList.add('shatter-piece');
            piece.style.width = Math.random() * 4 + 2 + 'px';
            piece.style.height = Math.random() * 4 + 2 + 'px';
            piece.style.left = '10px';
            piece.style.top = '15px';
            resonator.appendChild(piece);

            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 500 + 200;
            
            gsap.to(piece, {
                x: Math.cos(angle) * dist,
                y: Math.sin(angle) * dist,
                rotation: Math.random() * 720 - 360,
                opacity: 0,
                duration: Math.random() * 1 + 0.5,
                ease: "power4.out"
            });
        }
        
        // Massive sound wave
        const giantWave = document.createElement('div');
        giantWave.style.position = 'absolute';
        giantWave.style.border = '5px solid #16a085';
        giantWave.style.borderRadius = '50%';
        giantWave.style.left = '50%';
        giantWave.style.top = '50%';
        giantWave.style.transform = 'translate(-50%, -50%)';
        document.body.appendChild(giantWave);
        
        gsap.to(giantWave, {
            width: '200vw',
            height: '200vw',
            borderWidth: 0,
            opacity: 0,
            duration: 1.5,
            ease: "power2.out"
        });
    }
</script>
</body>
</html>
