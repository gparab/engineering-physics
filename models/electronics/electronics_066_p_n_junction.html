<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
  #container { position: relative; width: 60px; height: 40px; cursor: pointer; }
  .block { position: absolute; top: 0; width: 30px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.7); border: 2px solid #F39C12; box-sizing: border-box; }
  #p-block { left: 0; border-right: none; border-radius: 4px 0 0 4px; }
  #n-block { right: 0; border-left: none; border-radius: 0 4px 4px 0; }
  .depletion { position: absolute; left: 26px; top: 2px; width: 8px; height: 36px; background: rgba(243, 156, 18, 0.2); }
  .carrier { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #F39C12; opacity: 0.8; }
</style>
</head>
<body>
<div id="container">
  <div class="block" id="p-block">P</div>
  <div class="block" id="n-block">N</div>
  <div class="depletion" id="depletion"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const container = document.getElementById('container');
  const carriers = [];
  for(let i=0; i<10; i++) {
    let c = document.createElement('div');
    c.className = 'carrier';
    container.appendChild(c);
    carriers.push(c);
    let isP = i < 5;
    gsap.set(c, { x: isP ? gsap.utils.random(4, 20) : gsap.utils.random(36, 52), y: gsap.utils.random(4, 32) });
    gsap.to(c, {
      x: isP ? '+=8' : '-=8',
      y: 'random(-4, 4)',
      duration: 'random(0.5, 1.5)',
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut'
    });
  }

  let clicked = false;
  container.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    gsap.killTweensOf('.carrier');
    
    gsap.to('#depletion', { width: 60, left: 0, opacity: 0.5, duration: 1, ease: 'power2.in' });
    gsap.to('#p-block', { x: -300, rotation: -45, opacity: 0, duration: 1, ease: 'power3.in', delay: 1 });
    gsap.to('#n-block', { x: 300, rotation: 45, opacity: 0, duration: 1, ease: 'power3.in', delay: 1 });
    gsap.to('#depletion', { scaleX: 10, scaleY: 10, opacity: 0, duration: 1, ease: 'power3.out', delay: 1 });
    carriers.forEach((c, i) => {
      gsap.to(c, {
        x: (i < 5 ? -1 : 1) * gsap.utils.random(200, 500),
        y: gsap.utils.random(-200, 200),
        scale: 0,
        opacity: 0,
        duration: 1,
        delay: 1,
        ease: 'power3.out'
      });
    });
  });
</script>
</body>
</html>
