<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Table</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 80px;
            height: 60px;
            cursor: pointer;
        }

        .col {
            position: absolute;
            top: 10px;
            width: 15px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .virtual { left: 0; }
        .physical { right: 0; }

        .block {
            width: 100%;
            height: 10px;
            border: 1px solid #9B59B6;
            box-sizing: border-box;
            background: white;
        }

        .line {
            position: absolute;
            height: 1px;
            background-color: #9B59B6;
            transform-origin: left;
            z-index: -1;
        }

        /* Map v1 -> p2 */
        .l1 { top: 15px; left: 15px; width: 51px; transform: rotate(23deg); animation: pulse 2s infinite; }
        /* Map v3 -> p1 */
        .l2 { top: 45px; left: 15px; width: 58px; transform: rotate(-31deg); animation: pulse 2s infinite 1s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; stroke-width: 2px; }
        }

        /* Disk block */
        .disk-block {
            position: absolute;
            width: 15px;
            height: 10px;
            background-color: #7f8c8d;
            bottom: -50px;
            right: 0;
            opacity: 0;
        }

        .fault-line {
            position: absolute;
            top: 30px;
            left: 15px;
            width: 50px;
            height: 2px;
            background-color: red;
            opacity: 0;
        }

        /* Click animation */
        .clicked .fault-line {
            opacity: 1;
            animation: flashRed 0.2s 3;
        }
        .clicked .disk-block {
            opacity: 1;
            animation: haulDisk 1.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .clicked .physical .block:nth-child(3) {
            animation: hideEmpty 0.1s forwards 1.4s;
        }

        @keyframes flashRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes haulDisk {
            0% { bottom: -100px; right: 0; }
            100% { bottom: 10px; right: 0; background-color: #9B59B6; }
        }
        
        @keyframes hideEmpty {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container" id="model">
        <div class="col virtual">
            <div class="block" style="background:#9B59B6"></div>
            <div class="block"></div>
            <div class="block" style="background:#9B59B6"></div>
        </div>
        
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="fault-line"></div>

        <div class="col physical">
            <div class="block" style="background:#9B59B6"></div>
            <div class="block" style="background:#9B59B6"></div>
            <div class="block"></div>
        </div>

        <div class="disk-block"></div>
    </div>

    <script>
        document.getElementById('model').addEventListener('click', function() {
            this.classList.add('clicked');
        });
    </script>
</body>
</html>
