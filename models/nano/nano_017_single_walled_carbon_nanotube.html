<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single-Walled Carbon Nanotube</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    cursor: pointer;
    width: 60px;
    height: 20px;
    perspective: 500px;
  }
  .tube {
    width: 100%;
    height: 100%;
    background: linear-gradient(0deg, #1a252f, #34495e, #1a252f);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
  }
  .electron {
    position: absolute;
    width: 3px; height: 3px;
    background: #00ffff;
    border-radius: 50%;
    box-shadow: 0 0 5px #00ffff;
    top: 8px; left: -10px;
  }
  .graphene-sheet {
    position: absolute;
    top: 50%; left: 50%;
    width: 150vw; height: 150vh;
    background: repeating-linear-gradient(60deg, #2c3e50 0, #2c3e50 2px, transparent 2px, transparent 20px),
                repeating-linear-gradient(-60deg, #2c3e50 0, #2c3e50 2px, transparent 2px, transparent 20px),
                repeating-linear-gradient(0deg, #2c3e50 0, #2c3e50 2px, transparent 2px, transparent 20px);
    background-size: 40px 69px;
    transform-origin: center;
    transform: translate(-50%, -50%) scaleX(0);
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="graphene-sheet" id="sheet"></div>
<div class="container" id="model">
  <div class="tube" id="tube"></div>
</div>
<script>
  const tube = document.getElementById('tube');
  const model = document.getElementById('model');

  // Idle Animation: Electrons whizzing
  function spawnElectron() {
    const el = document.createElement('div');
    el.className = 'electron';
    el.style.top = (4 + Math.random() * 10) + 'px';
    tube.appendChild(el);
    gsap.to(el, {
      x: 80,
      duration: 0.5 + Math.random() * 0.3,
      ease: "none",
      onComplete: () => el.remove()
    });
  }
  
  const idleInterval = setInterval(spawnElectron, 150);

  let isAnimating = false;
  model.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    clearInterval(idleInterval);
    
    // Unroll tube
    const tl = gsap.timeline();
    tl.to('#tube', { scaleY: 4, scaleX: 1.5, opacity: 0, duration: 0.5, ease: "power2.inOut" })
      .set('#sheet', { opacity: 0.3 })
      .to('#sheet', { scaleX: 1, duration: 1, ease: "power3.out" }, "-=0.2")
      // Ripple effect
      .to('#sheet', { 
        skewY: 10, skewX: 5, yoyo: true, repeat: 3, duration: 0.2, ease: "sine.inOut" 
      })
      // Fly off screen
      .to('#sheet', { x: '100vw', rotation: 20, duration: 1, ease: "power2.in" });
  });
</script>
</body>
</html>
