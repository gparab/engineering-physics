<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAC (Digital-to-Analog)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="dacCanvas" width="300" height="200"></canvas>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const container = document.getElementById('container');
        const canvas = document.getElementById('dacCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const color = '#D35400';
        
        let time = 0;
        let isDestroyed = false;
        let glitchY = 0;
        let glitchActive = false;
        let waveOffsets = [];
        
        for (let i = 0; i < width; i++) {
            waveOffsets.push(0);
        }

        function drawResistorLadder() {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            // Draw a basic R-2R ladder outline at the top left
            let startX = 20;
            let startY = 40;
            
            for (let i = 0; i < 4; i++) {
                // Horizontal R
                ctx.moveTo(startX + i * 30, startY);
                ctx.lineTo(startX + i * 30 + 10, startY);
                // Zigzag
                ctx.lineTo(startX + i * 30 + 12, startY - 5);
                ctx.lineTo(startX + i * 30 + 17, startY + 5);
                ctx.lineTo(startX + i * 30 + 20, startY);
                ctx.lineTo(startX + i * 30 + 30, startY);
                
                // Vertical 2R
                ctx.moveTo(startX + i * 30 + 30, startY);
                ctx.lineTo(startX + i * 30 + 30, startY + 10);
                // Zigzag
                ctx.lineTo(startX + i * 30 + 25, startY + 12);
                ctx.lineTo(startX + i * 30 + 35, startY + 17);
                ctx.lineTo(startX + i * 30 + 30, startY + 20);
                ctx.lineTo(startX + i * 30 + 30, startY + 30);
                
                // Switch
                ctx.fillStyle = (Math.sin(time * (i + 1) * 2) > 0 && !glitchActive) ? color : '#333';
                if (glitchActive && i === 3) ctx.fillStyle = color; // MSB stuck
                ctx.beginPath();
                ctx.arc(startX + i * 30 + 30, startY + 35, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.stroke();
        }
        
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            drawResistorLadder();
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            
            let currentGlitch = glitchActive ? (Math.random() * 150 - 75) : 0;
            if (glitchActive) glitchY += currentGlitch;
            
            for (let x = 0; x < width; x++) {
                // Smooth wave generated by bits
                let y = height / 2 + 30 + Math.sin(x * 0.05 + time) * 30;
                
                if (glitchActive) {
                    waveOffsets[x] = currentGlitch;
                    y += waveOffsets[x];
                }
                
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            time -= 0.05;
            
            requestAnimationFrame(draw);
        }
        
        draw();
        
        container.addEventListener('click', () => {
            if (isDestroyed) return;
            isDestroyed = true;
            glitchActive = true;
            
            gsap.to(container, {
                y: -1000,
                opacity: 0,
                duration: 1,
                delay: 0.5,
                ease: 'power4.in'
            });
        });
    </script>
</body>
</html>
