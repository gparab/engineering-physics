<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vapor Compression Refrigeration</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; cursor: pointer; }
  #container { position: relative; width: 80px; height: 80px; }
  .pipe { position: absolute; border: 2px solid #555; border-radius: 8px; width: 60px; height: 60px; left: 10px; top: 10px; box-sizing: border-box; }
  .compressor { position: absolute; left: 30px; bottom: 0; width: 20px; height: 20px; background: #444; border-radius: 50% 50% 10% 10%; z-index: 2; }
  .valve { position: absolute; left: 35px; top: 5px; width: 10px; height: 10px; background: #777; clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 2; }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; opacity: 0.8; z-index: 1; margin: -3px; }
  
  .frost-wave { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #00CEC9 0%, transparent 70%); transform: translate(-50%, -50%) scale(0); pointer-events: none; opacity: 0.8; mix-blend-mode: screen; z-index: 10; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
</head>
<body>
<div id="container">
  <div class="pipe"></div>
  <div class="compressor"></div>
  <div class="valve"></div>
</div>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  const container = document.getElementById('container');
  
  const path = [
    {x: 40, y: 70}, // compressor out (hot gas)
    {x: 70, y: 70}, 
    {x: 70, y: 10}, // condenser (hot to warm liquid)
    {x: 40, y: 10}, // valve in
    {x: 40, y: 10}, // valve out (cold mix)
    {x: 10, y: 10},
    {x: 10, y: 70}, // evaporator (cold gas)
    {x: 40, y: 70}  // compressor in
  ];

  let particles = [];
  for(let i=0; i<12; i++){
    let p = document.createElement('div');
    p.className = 'particle';
    container.appendChild(p);
    particles.push(p);
    
    let tl = gsap.timeline({repeat: -1, delay: i * 0.33});
    
    // Animate along path and change color
    tl.to(p, {
      motionPath: {
        path: [path[0], path[1], path[2]],
      },
      backgroundColor: '#E74C3C', // hot red
      duration: 1.5,
      ease: "none"
    })
    .to(p, {
      motionPath: { path: [path[2], path[3]] },
      backgroundColor: '#E67E22', // warm liquid
      duration: 0.5,
      ease: "none"
    })
    .to(p, {
      motionPath: { path: [path[4], path[5], path[6]] },
      backgroundColor: '#00CEC9', // cold blue
      duration: 1.5,
      ease: "none"
    })
    .to(p, {
      motionPath: { path: [path[6], path[7]] },
      backgroundColor: '#3498DB', // cool gas
      duration: 0.5,
      ease: "none"
    });
  }

  let clicked = false;
  document.body.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    
    // Valve freezes open, frost wave
    gsap.to('.valve', { backgroundColor: '#00CEC9', scale: 1.5, duration: 0.3 });
    
    particles.forEach(p => gsap.killTweensOf(p));
    
    // Liquid slugs compressor -> BOOM frost
    gsap.to('.compressor', { 
      x: () => (Math.random()-0.5)*10,
      y: () => (Math.random()-0.5)*10,
      duration: 0.05,
      repeat: 20,
      onComplete: () => {
        gsap.to('.compressor', { scale: 2, backgroundColor: '#00CEC9', opacity: 0, duration: 0.2 });
        
        // Frost wave covers screen
        let wave = document.createElement('div');
        wave.className = 'frost-wave';
        document.body.appendChild(wave);
        
        gsap.to(wave, {
          scale: 300,
          opacity: 1,
          duration: 1.5,
          ease: "power3.out",
          onComplete: () => {
            gsap.to(wave, { opacity: 0.9, duration: 1 });
            document.body.style.background = '#0a1a1a';
          }
        });
        
        // scatter particles
        particles.forEach(p => {
          gsap.to(p, {
            x: "+=" + (Math.random()-0.5)*500,
            y: "+=" + (Math.random()-0.5)*500,
            scale: 3,
            backgroundColor: '#ffffff',
            opacity: 0,
            duration: 1
          });
        });
        gsap.to('.pipe', { opacity: 0, duration: 0.5 });
      }
    });
  });
</script>
</body>
</html>
