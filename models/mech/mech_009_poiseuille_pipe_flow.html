<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poiseuille Pipe Flow</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 20px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const COLOR = '#2980B9';
    let clicked = false;
    let particles = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const pipeW = 40;
    const pipeH = 20;

    class Arrow {
        constructor(yOffset) {
            this.x = cx - pipeW / 2 + Math.random() * pipeW;
            this.yOffset = yOffset;
            this.y = cy + yOffset;
            let r = Math.abs(yOffset) / (pipeH / 2);
            this.speed = (1 - r * r) * 1.5 + 0.2;
        }
        update() {
            this.x += this.speed;
            if (this.x > cx + pipeW / 2) {
                this.x = cx - pipeW / 2;
            }
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + 4, this.y);
            ctx.lineTo(this.x + 2, this.y - 1.5);
            ctx.moveTo(this.x + 4, this.y);
            ctx.lineTo(this.x + 2, this.y + 1.5);
            ctx.strokeStyle = COLOR;
            ctx.lineWidth = 0.8;
            ctx.stroke();
        }
    }

    class EddyParticle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 15;
            this.vy = (Math.random() - 0.5) * 15;
            this.size = Math.random() * 2 + 1;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
            this.angle = Math.random() * Math.PI * 2;
            this.vAngle = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.angle += this.vAngle;
            this.vx += Math.cos(this.angle) * 0.5;
            this.vy += Math.sin(this.angle) * 0.5;
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(41, 128, 185, ${this.life})`;
            ctx.fill();
        }
    }

    let arrows = [];
    for (let i = 0; i < 15; i++) {
        let yOff = (Math.random() * pipeH) - pipeH/2;
        arrows.push(new Arrow(yOff));
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        for(let i=0; i<100; i++) {
            let x = cx + (Math.random() - 0.5) * pipeW;
            let y = cy + (Math.random() - 0.5) * pipeH;
            particles.push(new EddyParticle(x, y));
        }
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked) {
            ctx.beginPath();
            ctx.moveTo(cx - pipeW/2, cy - pipeH/2);
            ctx.lineTo(cx + pipeW/2, cy - pipeH/2);
            ctx.moveTo(cx - pipeW/2, cy + pipeH/2);
            ctx.lineTo(cx + pipeW/2, cy + pipeH/2);
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.stroke();

            arrows.forEach(a => {
                a.update();
                a.draw(ctx);
            });
        } else {
            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
