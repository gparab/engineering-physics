<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Involute Gear Pair</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let fragments = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const color = '#7F8C8D';

    let angle1 = 0;
    let angle2 = 0;
    
    // Gear params
    const r1 = 12;
    const n1 = 8;
    const r2 = 18;
    const n2 = 12;
    const x1 = cx - r1;
    const x2 = cx + r2;

    class Fragment {
        constructor(x, y, vAngle) {
            this.x = x;
            this.y = y;
            let speed = Math.random() * 15 + 5;
            this.vx = Math.cos(vAngle) * speed + (Math.random()-0.5)*5;
            this.vy = Math.sin(vAngle) * speed + (Math.random()-0.5)*5;
            this.angle = Math.random() * Math.PI * 2;
            this.vRot = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 3 + 2;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.angle += this.vRot;
            this.life -= 0.015;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.beginPath();
            ctx.moveTo(0, -this.size);
            ctx.lineTo(this.size, this.size);
            ctx.lineTo(-this.size, this.size);
            ctx.closePath();
            ctx.fillStyle = `rgba(127, 140, 141, ${this.life})`;
            ctx.fill();
            ctx.restore();
        }
    }

    function drawGear(ctx, x, y, r, n, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            let a = i * Math.PI * 2 / n;
            let aNext = (i + 1) * Math.PI * 2 / n;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            // tooth
            ctx.lineTo(Math.cos(a + 0.1) * (r + 4), Math.sin(a + 0.1) * (r + 4));
            ctx.lineTo(Math.cos(aNext - 0.1) * (r + 4), Math.sin(aNext - 0.1) * (r + 4));
            ctx.lineTo(Math.cos(aNext) * r, Math.sin(aNext) * r);
        }
        ctx.closePath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, r/2, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        
        // spawn fragments at contact point tangentially
        for(let i=0; i<60; i++) {
            let contactY = cy; // tangential fly off
            let contactX = cx + (r2-r1)/2;
            fragments.push(new Fragment(contactX, contactY, -Math.PI/2));
            fragments.push(new Fragment(contactX, contactY, Math.PI/2));
        }
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked) {
            angle1 += 0.05;
            angle2 -= 0.05 * (n1 / n2); // gear ratio
            drawGear(ctx, x1, cy, r1, n1, angle1);
            drawGear(ctx, x2, cy, r2, n2, angle2 + Math.PI/n2);
        } else {
            // Draw broken gears (no teeth)
            ctx.beginPath();
            ctx.arc(x1, cy, r1, 0, Math.PI*2);
            ctx.arc(x1, cy, r1/2, 0, Math.PI*2);
            ctx.strokeStyle = color;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x2, cy, r2, 0, Math.PI*2);
            ctx.arc(x2, cy, r2/2, 0, Math.PI*2);
            ctx.stroke();

            fragments.forEach((f, i) => {
                f.update();
                f.draw(ctx);
                if(f.life <= 0) fragments.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
