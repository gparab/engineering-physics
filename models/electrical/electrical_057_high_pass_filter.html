<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High-Pass Filter</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #111;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 32px;
    height: 32px;
    cursor: pointer;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .circuit-part {
    stroke: #2980B9;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .signal {
    stroke: rgba(41, 128, 185, 0.6);
    stroke-width: 1;
    fill: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="container" id="model">
  <svg viewBox="0 0 32 32">
    <!-- CR Circuit -->
    <g class="circuit">
      <path class="circuit-part c1" d="M2 16 H10" />
      <path class="circuit-part c2" d="M10 10 V22" />
      <path class="circuit-part c3" d="M14 10 V22" />
      <path class="circuit-part c4" d="M14 16 H30" />
      <path class="circuit-part c5" d="M22 16 V19 L19 20.5 L25 23.5 L19 26.5 L22 28 V30" />
      <path class="circuit-part c6" d="M19 30 H25" />
    </g>
    <!-- Signals -->
    <path class="signal in-signal" d="M 2 16 Q 4 12, 6 16 T 10 16" />
    <path class="signal out-signal" d="M 14 16 L 15 16 L 16 10 L 17 22 L 18 16 L 30 16" />
  </svg>
</div>

<script>
  const inSignal = document.querySelector('.in-signal');
  const outSignal = document.querySelector('.out-signal');
  
  gsap.to(inSignal, {
    y: 2,
    yoyo: true,
    repeat: -1,
    duration: 1.5,
    ease: "sine.inOut"
  });

  gsap.to(outSignal, {
    scaleY: 1.5,
    transformOrigin: "center",
    yoyo: true,
    repeat: -1,
    duration: 0.1,
    ease: "power1.inOut"
  });

  document.getElementById('model').addEventListener('click', () => {
    gsap.killTweensOf([inSignal, outSignal]);
    gsap.to(outSignal, { scaleY: 0, duration: 0.2, ease: "power4.out" });
    
    const parts = document.querySelectorAll('.circuit-part');
    parts.forEach((part, i) => {
      gsap.to(part, {
        x: (Math.random() - 0.5) * 500,
        y: (Math.random() - 0.5) * 500,
        rotation: (Math.random() - 0.5) * 720,
        opacity: 0,
        strokeWidth: 0,
        duration: 1.5,
        ease: "power3.out",
        delay: 0.2 + i * 0.05
      });
    });
    
    gsap.to([inSignal, outSignal], { opacity: 0, duration: 0.5, delay: 0.3 });
  });
</script>
</body>
</html>
