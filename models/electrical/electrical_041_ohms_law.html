<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohm's Law (Resistor)</title>
<style>
  body { margin: 0; padding: 0; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  #container { position: relative; width: 40px; height: 20px; cursor: pointer; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .resistor-path { fill: none; stroke: #F39C12; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s ease; }
  .particle { position: absolute; width: 3px; height: 3px; background-color: #F39C12; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="container">
  <svg viewBox="0 0 40 20" id="resistor-svg">
    <path class="resistor-path" d="M0,10 L5,10 L8,2 L14,18 L20,2 L26,18 L32,2 L35,10 L40,10" id="path"/>
  </svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  const container = document.getElementById('container');
  let dots = [];
  for (let i = 0; i < 4; i++) {
    let dot = document.createElement('div');
    dot.className = 'particle';
    container.appendChild(dot);
    dots.push(dot);
    gsap.to(dot, { duration: 3, repeat: -1, ease: "none", motionPath: { path: "#path", align: "#path", alignOrigin: [0.5, 0.5] } }).progress(i / 4);
  }
  container.addEventListener('click', () => {
    gsap.killTweensOf('.particle');
    gsap.to('.resistor-path', { stroke: '#e74c3c', duration: 0.2 });
    gsap.to('.particle', { backgroundColor: '#e74c3c', duration: 0.2 });
    setTimeout(() => {
      document.getElementById('resistor-svg').style.display = 'none';
      dots.forEach(dot => dot.remove());
      for (let i = 0; i < 30; i++) {
        let p = document.createElement('div');
        p.style.position = 'absolute';
        p.style.width = '2px';
        p.style.height = '2px';
        p.style.backgroundColor = '#e74c3c';
        p.style.borderRadius = '50%';
        p.style.left = '20px';
        p.style.top = '10px';
        container.appendChild(p);
        let angle = Math.random() * Math.PI;
        let dist = 100 + Math.random() * 200;
        gsap.to(p, { x: Math.cos(angle) * dist - dist/2, y: -Math.sin(angle) * dist - 50, opacity: 0, duration: 1 + Math.random() * 1.5, ease: "power2.out", onComplete: () => p.remove() });
      }
    }, 200);
  });
</script>
</body>
</html>
