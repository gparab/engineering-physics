<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cable Catenary</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e6f7ff; overflow: hidden; }
  .scene { position: relative; width: 500px; height: 300px; cursor: pointer; }
  
  .pylon { position: absolute; bottom: 50px; width: 20px; height: 200px; background-color: #555; border-radius: 2px 2px 0 0; }
  .p1 { left: 50px; }
  .p2 { right: 50px; }
  .ground { position: absolute; bottom: 30px; left: 0; width: 100%; height: 20px; background-color: #654321; }
  
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .chain { fill: none; stroke: #2F4F4F; stroke-width: 6; stroke-dasharray: 10 4; stroke-linecap: round; transition: d 0.2s; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="ground"></div>
  <div class="pylon p1"></div>
  <div class="pylon p2"></div>
  
  <svg viewBox="0 0 500 300">
    <!-- Pylons connect at x=60 and x=440, y=50 -->
    <path class="chain" id="chain" d="M 60 50 Q 250 200, 440 50" />
  </svg>
</div>
<script>
  const scene = document.getElementById('scene');
  const chain = document.getElementById('chain');
  
  let t = 0;
  let clicked = false;
  
  // Chain swaying
  let sway = setInterval(() => {
    t += 0.05;
    let sagX = 250 + Math.sin(t) * 20; // breeze pushes horizontally
    let sagY = 200 - Math.abs(Math.sin(t*0.5)) * 10; // slight lift
    chain.setAttribute('d', `M 60 50 Q ${sagX} ${sagY}, 440 50`);
  }, 50);

  scene.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    clearInterval(sway);
    
    // Tension -> infinite; taut horizontal
    chain.style.transition = 'd 0.3s cubic-bezier(0.8, 0, 1, 1)';
    chain.setAttribute('d', `M 60 50 Q 250 50, 440 50`);
    
    setTimeout(() => {
      // Snaps at supports, whips down
      chain.style.transition = 'd 0.5s cubic-bezier(0.5, 0, 1, 0.5)';
      chain.setAttribute('d', `M 250 250 Q 250 250, 250 250`); // falls to middle ground
      chain.style.opacity = '0';
    }, 400);
  });
</script>
</body>
</html>
