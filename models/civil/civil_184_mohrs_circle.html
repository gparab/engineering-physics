<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohr's Circle (Geotechnical)</title>
<style>
  body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5; overflow: hidden; }
  .container { position: relative; width: 60px; height: 60px; cursor: pointer; }
  .axis-x { position: absolute; top: 30px; left: 0; width: 60px; height: 1px; background: #999; }
  .axis-y { position: absolute; top: 0; left: 10px; width: 1px; height: 60px; background: #999; }
  .envelope { position: absolute; top: 5px; left: 10px; width: 50px; height: 1px; background: rgba(128,0,128,0.3); transform: rotate(-15deg); transform-origin: left; }
  
  .circle { position: absolute; top: 15px; left: 20px; width: 30px; height: 30px; border: 1px solid #800080; border-radius: 50%; box-sizing: border-box; }
  .diagonal { position: absolute; top: 14px; left: 14px; width: 30px; height: 1px; background: #800080; transform-origin: center; transform: rotate(45deg); }
  .point { position: absolute; top: 13px; left: -2px; width: 4px; height: 4px; background: #800080; border-radius: 50%; }
  .particle { position: absolute; width: 2px; height: 2px; background: #800080; display: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div class="container" id="icon">
    <div class="axis-x"></div>
    <div class="axis-y"></div>
    <div class="envelope"></div>
    <div class="circle" id="circle">
      <div class="diagonal" id="diagonal">
        <div class="point"></div>
      </div>
    </div>
  </div>
  <script>
    const icon = document.getElementById('icon');
    const circle = document.getElementById('circle');
    const diagonal = document.getElementById('diagonal');
    
    // Idle: rotate
    const idle = gsap.to(diagonal, { rotation: 405, duration: 4, repeat: -1, ease: "linear" });

    icon.addEventListener('click', () => {
      idle.kill();
      // Expand to envelope
      gsap.to(circle, {
        width: 44, height: 44, top: 8, left: 13, duration: 0.3, ease: "power1.in",
        onComplete: () => {
          circle.style.display = 'none';
          document.querySelector('.envelope').style.display = 'none';
          
          const rect = circle.getBoundingClientRect();
          for(let i=0; i<40; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.display = 'block';
            p.style.left = (rect.left + 22 + (Math.random()-0.5)*20) + 'px';
            p.style.top = (rect.top + 22 + (Math.random()-0.5)*20) + 'px';
            document.body.appendChild(p);
            
            gsap.to(p, {
              x: (Math.random()-0.5)*800,
              y: (Math.random()-0.5)*800,
              opacity: 0,
              duration: 1 + Math.random(),
              ease: "power2.out"
            });
          }
        }
      });
    });
  </script>
</body>
</html>
