<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Search Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #111;
    overflow: hidden;
    font-family: sans-serif;
  }
  #container {
    position: relative;
    width: 60px;
    height: 60px;
    cursor: pointer;
  }
  .node {
    position: absolute;
    width: 6px;
    height: 6px;
    background-color: #2ECC71;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .edge {
    position: absolute;
    background-color: rgba(46, 204, 113, 0.4);
    transform-origin: 0 0;
    height: 1px;
  }
  .probe {
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1px solid #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="container">
  <div class="probe" id="probe"></div>
</div>
<script>
  const container = document.getElementById('container');
  
  const nodesData = [
    { id: 0, x: 30, y: 10 },
    { id: 1, x: 15, y: 30 },
    { id: 2, x: 45, y: 30 },
    { id: 3, x: 5, y: 50 },
    { id: 4, x: 25, y: 50 },
    { id: 5, x: 35, y: 50 },
    { id: 6, x: 55, y: 50 }
  ];

  const edgesData = [
    [0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]
  ];

  const nodes = [];
  const edges = [];

  edgesData.forEach(([n1, n2]) => {
    const edge = document.createElement('div');
    edge.className = 'edge';
    const dx = nodesData[n2].x - nodesData[n1].x;
    const dy = nodesData[n2].y - nodesData[n1].y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    
    edge.style.width = `${len}px`;
    edge.style.left = `${nodesData[n1].x}px`;
    edge.style.top = `${nodesData[n1].y}px`;
    edge.style.transform = `rotate(${angle}deg)`;
    container.appendChild(edge);
    edges.push(edge);
  });

  nodesData.forEach(data => {
    const node = document.createElement('div');
    node.className = 'node';
    node.style.left = `${data.x}px`;
    node.style.top = `${data.y}px`;
    container.appendChild(node);
    nodes.push(node);
  });

  const probe = document.getElementById('probe');
  const paths = [
    [0, 1, 3], [0, 1, 4], [0, 2, 5], [0, 2, 6]
  ];

  let idleTl = gsap.timeline({ repeat: -1 });

  function playIdle() {
    idleTl.clear();
    const path = paths[Math.floor(Math.random() * paths.length)];
    
    idleTl.set(probe, { x: nodesData[path[0]].x, y: nodesData[path[0]].y, opacity: 1, scale: 1 });
    
    for (let i = 1; i < path.length; i++) {
      idleTl.to(probe, {
        x: nodesData[path[i]].x,
        y: nodesData[path[i]].y,
        duration: 0.6,
        ease: "power1.inOut"
      });
    }
    idleTl.to(probe, { opacity: 0, scale: 2, duration: 0.3 });
    idleTl.to({}, { duration: 0.5 });
  }
  
  playIdle();

  let clicked = false;
  container.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    idleTl.kill();
    gsap.killTweensOf(probe);
    gsap.set(probe, { opacity: 0 });

    const tl = gsap.timeline();
    
    // Balance into a flat line
    nodes.forEach((node, i) => {
      tl.to(node, {
        left: '50%',
        top: '50%',
        duration: 0.5,
        ease: "back.in(1.5)"
      }, 0);
    });
    edges.forEach((edge, i) => {
      tl.to(edge, {
        width: 0,
        opacity: 0,
        duration: 0.5
      }, 0);
    });

    // Snaps out of existence across screen
    tl.to(nodes, {
      scaleX: 100,
      scaleY: 0,
      opacity: 0,
      duration: 0.3,
      stagger: 0.02,
      ease: "power4.out"
    }, 0.6);
  });
</script>
</body>
</html>
