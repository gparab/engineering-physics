<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Descent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #111;
    overflow: hidden;
  }
  #container {
    position: relative;
    width: 80px;
    height: 50px;
    cursor: pointer;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .bowl {
    fill: none;
    stroke: rgba(231, 76, 60, 0.4);
    stroke-width: 1.5;
  }
  .ball {
    position: absolute;
    width: 6px;
    height: 6px;
    background-color: #E74C3C;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 4px #E74C3C;
    left: 10px;
    top: 10px;
  }
</style>
</head>
<body>
<div id="container">
  <svg viewBox="0 0 80 50">
    <path class="bowl" d="M 5,10 Q 40,60 75,10" />
    <path class="bowl" d="M 5,15 Q 40,65 75,15" style="opacity: 0.6;" />
    <path class="bowl" d="M 5,20 Q 40,70 75,20" style="opacity: 0.3;" />
  </svg>
  <div class="ball"></div>
</div>
<script>
  const container = document.getElementById('container');
  const ball = document.querySelector('.ball');
  
  let idleTl = gsap.timeline({ repeat: -1 });

  function playIdle() {
    gsap.set(ball, { left: 5, top: 10 });
    
    idleTl.to(ball, {
      left: 40,
      top: 35,
      duration: 1.2,
      ease: "power2.inOut"
    });
    idleTl.to(ball, {
      left: 60,
      top: 20,
      duration: 0.8,
      ease: "power2.out"
    });
    idleTl.to(ball, {
      left: 40,
      top: 35,
      duration: 0.8,
      ease: "power2.inOut"
    });
    idleTl.to(ball, {
      left: 50,
      top: 28,
      duration: 0.6,
      ease: "power2.out"
    });
    idleTl.to(ball, {
      left: 40,
      top: 35,
      duration: 0.6,
      ease: "power2.inOut"
    });
    idleTl.to({}, { duration: 1 });
  }

  playIdle();

  let clicked = false;
  container.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    idleTl.kill();

    const tl = gsap.timeline();
    
    // Learning rate too high: ricochet rapidly
    tl.to(ball, {
      left: 75,
      top: 10,
      duration: 0.2,
      ease: "none"
    });
    tl.to(ball, {
      left: -10,
      top: -20,
      duration: 0.2,
      ease: "none"
    });
    tl.to(ball, {
      left: 100,
      top: -60,
      duration: 0.2,
      ease: "none"
    });
    
    // Shoot into orbit across the page
    tl.to(ball, {
      left: window.innerWidth / 2,
      top: -window.innerHeight,
      scale: 3,
      duration: 1,
      ease: "power1.in"
    });
    
    tl.to('.bowl', {
      opacity: 0,
      duration: 0.5
    }, 0.5);
  });
</script>
</body>
</html>
