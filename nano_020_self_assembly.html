<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Assembly (Liposome)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    cursor: pointer;
    width: 60px;
    height: 60px;
  }
  .molecule {
    position: absolute;
    width: 6px;
    height: 20px;
    transform-origin: top center;
  }
  .head {
    width: 8px; height: 8px;
    background: #27ae60;
    border-radius: 50%;
    position: absolute;
    top: 0; left: -1px;
  }
  .tail {
    width: 2px; height: 12px;
    background: #2ecc71;
    position: absolute;
    top: 8px; left: 2px;
  }
  .water {
    position: absolute;
    width: 3px; height: 3px;
    background: #3498db;
    border-radius: 50%;
  }
  .liposome-ring {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border: 20px solid #27ae60;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    box-sizing: border-box;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="liposome-ring" id="liposome"></div>
<div class="container" id="model">
  <!-- Molecules will be generated via JS -->
</div>
<script>
  const model = document.getElementById('model');
  const numMolecules = 12;
  const molecules = [];
  const waters = [];

  // Create molecules
  for (let i = 0; i < numMolecules; i++) {
    const mol = document.createElement('div');
    mol.className = 'molecule';
    mol.innerHTML = '<div class="head"></div><div class="tail"></div>';
    // Random position within container
    gsap.set(mol, {
      x: 10 + Math.random() * 40,
      y: 10 + Math.random() * 40,
      rotation: Math.random() * 360
    });
    model.appendChild(mol);
    molecules.push(mol);
    
    // Animate idle wiggle
    gsap.to(mol, {
      rotation: "+=" + (Math.random() * 90 - 45),
      x: "+=" + (Math.random() * 10 - 5),
      y: "+=" + (Math.random() * 10 - 5),
      duration: 0.5 + Math.random(),
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  }

  // Create water dots
  for (let i = 0; i < 20; i++) {
    const w = document.createElement('div');
    w.className = 'water';
    gsap.set(w, {
      x: Math.random() * 60,
      y: Math.random() * 60
    });
    model.appendChild(w);
    waters.push(w);
    
    gsap.to(w, {
      x: "+=" + (Math.random() * 20 - 10),
      y: "+=" + (Math.random() * 20 - 10),
      duration: 0.3 + Math.random() * 0.5,
      repeat: -1,
      yoyo: true,
      ease: "power1.inOut"
    });
  }

  let isAnimating = false;
  model.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    
    gsap.killTweensOf('.molecule');
    gsap.killTweensOf('.water');
    
    const tl = gsap.timeline();
    
    // Water pushed away
    tl.to('.water', {
      scale: 0, opacity: 0, duration: 0.2
    });
    
    // Molecules form small ring first
    molecules.forEach((mol, i) => {
      const angle = (i / numMolecules) * Math.PI * 2;
      const r = 20;
      tl.to(mol, {
        x: 30 + Math.cos(angle) * r - 3,
        y: 30 + Math.sin(angle) * r - 10,
        rotation: (angle * 180 / Math.PI) - 90,
        duration: 0.5,
        ease: "back.out(1.5)"
      }, 0);
    });

    // Expand liposome to fill screen
    tl.to('#model', { opacity: 0, duration: 0.2 }, 0.8)
      .to('#liposome', { opacity: 1, duration: 0.1 }, 0.8)
      .to('#liposome', {
        width: '150vw',
        height: '150vw',
        borderWidth: '10vw',
        duration: 1.5,
        ease: "power2.inOut"
      }, 0.8)
      .to('#liposome', { opacity: 0, duration: 0.5 }, 2);
  });
</script>
</body>
</html>
