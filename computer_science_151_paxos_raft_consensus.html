<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paxos/Raft Consensus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }
        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #8E44AD;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .node-1 { top: 0; left: 16px; } /* Leader */
        .node-2 { bottom: 0; left: 0; }
        .node-3 { bottom: 0; right: 0; }
        
        .crown {
            position: absolute;
            top: -6px;
            left: -2px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 5px solid gold;
            opacity: 0.8;
        }

        .token {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #8E44AD;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .node-1 { animation: pulse 2s infinite; }

        @keyframes heartbeat12 {
            0% { top: 4px; left: 16px; opacity: 1; }
            90% { top: 32px; left: 4px; opacity: 1; }
            100% { top: 32px; left: 4px; opacity: 0; }
        }
        @keyframes heartbeat13 {
            0% { top: 4px; left: 24px; opacity: 1; }
            90% { top: 32px; left: 36px; opacity: 1; }
            100% { top: 32px; left: 36px; opacity: 0; }
        }
        @keyframes heartbeat23 {
            0% { top: 36px; left: 8px; opacity: 1; }
            90% { top: 36px; left: 32px; opacity: 1; }
            100% { top: 36px; left: 32px; opacity: 0; }
        }

        .t1 { animation: heartbeat12 1.5s infinite linear; }
        .t2 { animation: heartbeat13 1.5s infinite linear 0.5s; }
        .t3 { animation: heartbeat23 1.5s infinite linear 1s; }

        .partition-line {
            position: absolute;
            top: -10px;
            left: 20px;
            width: 2px;
            height: 60px;
            background-color: red;
            transform: rotate(15deg);
            display: none;
            clip-path: polygon(0 0, 100% 10%, 0 20%, 100% 30%, 0 40%, 100% 50%, 0 60%, 100% 70%, 0 80%, 100% 90%, 0 100%);
        }

        .clicked .partition-line {
            display: block;
            animation: slash 0.2s forwards;
        }
        @keyframes slash {
            0% { height: 0; }
            100% { height: 60px; }
        }

        .clicked .node-1 { animation: flyOut1 1s forwards cubic-bezier(0.1, 0.9, 0.2, 1); }
        .clicked .node-2 { animation: flyOut2 1s forwards cubic-bezier(0.1, 0.9, 0.2, 1); }
        .clicked .node-3 { animation: flyOut3 1s forwards cubic-bezier(0.1, 0.9, 0.2, 1); }
        .clicked .token, .clicked .crown { display: none; }

        @keyframes flyOut1 {
            to { transform: translate(-200vw, -100vh); opacity: 0; }
        }
        @keyframes flyOut2 {
            to { transform: translate(-200vw, 100vh); opacity: 0; }
        }
        @keyframes flyOut3 {
            to { transform: translate(200vw, 100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container" id="model">
        <div class="node node-1"><div class="crown"></div></div>
        <div class="node node-2"></div>
        <div class="node node-3"></div>
        
        <div class="token t1"></div>
        <div class="token t2"></div>
        <div class="token t3"></div>

        <div class="partition-line"></div>
    </div>

    <script>
        document.getElementById('model').addEventListener('click', function() {
            this.classList.add('clicked');
        });
    </script>
</body>
</html>
