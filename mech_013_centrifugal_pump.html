<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centrifugal Pump</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let particles = [];
    let bubbles = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const color = '#16A085';
    let angle = 0;

    class Bubble {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.r = 1;
            this.dr = Math.random() * 2 + 1;
        }
        update() {
            this.r += this.dr;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.strokeStyle = '#FFF';
            ctx.stroke();
        }
    }

    class Shrapnel {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            let a = Math.random() * Math.PI * 2;
            let s = Math.random() * 15 + 5;
            this.vx = Math.cos(a) * s;
            this.vy = Math.sin(a) * s;
            this.size = Math.random() * 4 + 2;
            this.rot = Math.random() * Math.PI;
            this.vrot = (Math.random() - 0.5) * 0.5;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.rot += this.vrot;
            this.life -= 0.015;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            ctx.fillStyle = `rgba(22, 160, 133, ${this.life})`;
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        
        for(let i=0; i<30; i++) {
            bubbles.push(new Bubble(cx + (Math.random()-0.5)*30, cy + (Math.random()-0.5)*30));
        }
        setTimeout(() => {
            for(let i=0; i<80; i++) {
                particles.push(new Shrapnel(cx, cy));
            }
        }, 150);
    });

    function drawVolute(ctx) {
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
            let a = i * Math.PI * 2 / 30;
            let r = 10 + i * 0.2;
            if (i === 0) ctx.moveTo(cx + r, cy);
            else ctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
        }
        // outlet
        ctx.lineTo(cx + 25, cy - 20);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked) {
            angle += 0.2;
            drawVolute(ctx);
            
            // Impeller
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.beginPath();
            for(let i=0; i<6; i++) {
                let a = i * Math.PI*2/6;
                ctx.moveTo(0, 0);
                // curved blade
                ctx.quadraticCurveTo(Math.cos(a+0.5)*6, Math.sin(a+0.5)*6, Math.cos(a)*12, Math.sin(a)*12);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
            
            // tiny fluid particles
            ctx.fillStyle = 'rgba(22, 160, 133, 0.5)';
            for(let i=0; i<5; i++) {
                let a = angle + i;
                ctx.beginPath();
                ctx.arc(cx + Math.cos(a)*8, cy + Math.sin(a)*8, 1, 0, Math.PI*2);
                ctx.fill();
            }

        } else {
            if (particles.length === 0) {
                drawVolute(ctx);
                bubbles.forEach(b => {
                    b.update();
                    b.draw(ctx);
                });
            } else {
                particles.forEach((p, i) => {
                    p.update();
                    p.draw(ctx);
                    if(p.life <= 0) particles.splice(i, 1);
                });
            }
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
