<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioluminescent Jellyfish Demo</title>
<style>
  :root {
    --ink: #ededed;
    --paper: #111;
  }
  body {
    background-color: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: var(--paper);
    padding: 30px 50px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 24px;
    font-weight: 600;
  }

  /* The Orb Container */
  .orb {
    display: block;
    width: 44px;
    height: 44px;
    flex: none;
    overflow: visible;
    color: var(--ink);
    transform-origin: 50% 50%;
    transition: transform 260ms ease, filter 260ms ease;
    cursor: pointer;
    text-decoration: none;
    outline: none;
  }
  .orb * { transform-box: fill-box; }
  .orb svg { overflow: visible; }
  
  /* Jellyfish specific */
  .jelly-bell {
    transform-origin: 22px 14px;
    animation: jelly-pulse 4s ease-in-out infinite;
  }
  .jelly-tentacle-1 {
    transform-origin: 16px 24px;
    animation: tentacle-wave 3s ease-in-out infinite;
  }
  .jelly-tentacle-2 {
    transform-origin: 22px 24px;
    animation: tentacle-wave 3s ease-in-out infinite 0.5s;
  }
  .jelly-tentacle-3 {
    transform-origin: 28px 24px;
    animation: tentacle-wave 3s ease-in-out infinite 1s;
  }
  .jelly-core {
    animation: core-glow 4s ease-in-out infinite;
  }

  /* Hover States */
  .jelly-orb:hover, .jelly-orb:focus {
    transform: scale(1.15) translateY(-2px);
    filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.7));
  }
  .jelly-orb:hover .jelly-bell {
    animation: jelly-pulse-fast 1.2s ease-in-out infinite;
  }
  .jelly-orb:hover .jelly-core {
    animation: core-glow-fast 1.2s ease-in-out infinite;
  }
  
  /* Clicked / Exit State (simulated on click via JS) */
  .jelly-orb.swimming {
    animation: swim-down 1.2s cubic-bezier(0.5, 0, 0.2, 1) forwards;
  }
  .jelly-orb.swimming .jelly-bell {
    animation: jelly-swim-pulse 0.4s ease-in-out infinite;
  }

  @keyframes jelly-pulse {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.05, 0.95); }
  }
  @keyframes jelly-pulse-fast {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.1, 0.9); }
  }
  @keyframes jelly-swim-pulse {
    0%, 100% { transform: scale(0.9, 1.1); }
    50%      { transform: scale(1.1, 0.8); }
  }
  @keyframes tentacle-wave {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  @keyframes core-glow {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.9; }
  }
  @keyframes core-glow-fast {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; filter: blur(3px); }
  }
  @keyframes swim-down {
    0%   { transform: translateY(0) scale(1.15); filter: drop-shadow(0 0 12px rgba(0, 255, 255, 1)); }
    15%  { transform: translateY(-15px) scale(1.1, 0.9); filter: drop-shadow(0 0 16px rgba(0, 255, 255, 1)); } /* Anticipation */
    100% { transform: translateY(300px) scale(0.85, 1.25); filter: drop-shadow(0 0 2px rgba(0, 255, 255, 0)); opacity: 0; }
  }
  
  .hint {
    margin-top: 30px;
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

</style>
</head>
<body>

  <div class="card">
    <h1 class="title">Dive
      <a class="orb jelly-orb" href="#" onclick="this.classList.add('swimming'); setTimeout(() => this.classList.remove('swimming'), 2000); return false;" title="Dive ( );">
        <svg viewBox="0 0 44 44" width="44" height="44" fill="none" aria-hidden="true">
          <!-- Tentacles -->
          <path class="jelly-tentacle-1" d="M 16,24 Q 13,32 17,38 T 15,46" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path class="jelly-tentacle-2" d="M 22,24 Q 25,32 21,38 T 23,48" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path class="jelly-tentacle-3" d="M 28,24 Q 31,32 27,38 T 29,46" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          
          <!-- Bell -->
          <path class="jelly-bell" d="M 12,24 C 12,10 16,6 22,6 C 28,6 32,10 32,24 C 28,26 26,23 22,24 C 18,23 16,26 12,24 Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="var(--paper)"/>
          
          <!-- Inner Core -->
          <circle class="jelly-core" cx="22" cy="16" r="3.5" fill="#0ff" opacity="0.8"/>
        </svg>
      </a>
    </h1>
    <div class="hint">Hover to excite • Click to dive</div>
  </div>

</body>
</html>
