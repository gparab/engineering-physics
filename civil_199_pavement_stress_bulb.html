<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavement Stress Bulb</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; overflow: hidden; }
  .scene { position: relative; width: 400px; height: 400px; cursor: pointer; }
  
  .surface-line { fill: none; stroke: #333; stroke-width: 4; transition: d 0.5s ease-out; }
  .wheel { position: absolute; top: 160px; left: 50px; width: 40px; height: 40px; background-color: #333; border-radius: 50%; border: 4px solid #696969; box-sizing: border-box; z-index: 10; }
  
  .stress-bulb { fill: none; stroke: #696969; stroke-width: 2; opacity: 0; transition: transform 0.5s, opacity 0.5s; transform-origin: 200px 200px; }
  
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <svg viewBox="0 0 400 400">
    <!-- Pavement Surface -->
    <path class="surface-line" id="surface" d="M 0 200 L 400 200" />
    
    <!-- Stress Bulbs group -->
    <g id="bulbsGroup">
      <path class="stress-bulb" id="b1" d="M 170 200 A 30 30 0 0 0 230 200" />
      <path class="stress-bulb" id="b2" d="M 140 200 A 60 60 0 0 0 260 200" />
      <path class="stress-bulb" id="b3" d="M 110 200 A 90 90 0 0 0 290 200" />
      <path class="stress-bulb" id="b4" d="M 80 200 A 120 120 0 0 0 320 200" />
    </g>
  </svg>
  
  <div class="wheel" id="wheel"></div>
</div>
<script>
  const scene = document.getElementById('scene');
  const wheel = document.getElementById('wheel');
  const surface = document.getElementById('surface');
  const bulbsGroup = document.getElementById('bulbsGroup');
  const bulbs = [
    document.getElementById('b1'),
    document.getElementById('b2'),
    document.getElementById('b3'),
    document.getElementById('b4')
  ];
  
  let t = 0;
  let clicked = false;
  
  // Wheel rolling
  let rollAnim = setInterval(() => {
    t += 0.05;
    let x = 180 + Math.sin(t) * 100;
    wheel.style.left = (x - 20) + 'px';
    wheel.style.transform = `rotate(${x * 2}deg)`;
    
    // Bulbs track wheel and pulse
    bulbsGroup.style.transform = `translateX(${x - 200}px)`;
    bulbs.forEach((b, i) => {
      let pulse = Math.abs(Math.sin(t * 2 - i * 0.5));
      b.style.opacity = pulse * 0.8;
    });
  }, 20);

  scene.addEventListener('click', () => {
    if(clicked) return;
    clicked = true;
    clearInterval(rollAnim);
    
    // Stop wheel at center
    wheel.style.transition = 'all 0.5s ease-out';
    wheel.style.left = '180px';
    bulbsGroup.style.transform = 'translateX(0px)';
    
    setTimeout(() => {
      // Excessive load: deep rut forms
      wheel.style.top = '190px'; // pushes down
      surface.setAttribute('d', 'M 0 200 Q 200 280, 400 200'); // curve surface down
      
      // Contours shoot off bottom
      bulbs.forEach((b, i) => {
        b.style.transition = 'transform 1s cubic-bezier(0.5, 0, 1, 0.5), opacity 1s';
        b.style.transform = `translateY(${200 + i * 50}px) scale(${1.5 + i * 0.2})`;
        b.style.opacity = '0';
      });
    }, 500);
  });
</script>
</body>
</html>
