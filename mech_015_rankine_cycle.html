<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rankine Cycle</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 40px;
        height: 40px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let steamParticles = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const color = '#34495E';
    
    let tracerT = 0;
    let domeScale = 1;

    class Steam {
        constructor() {
            this.x = cx;
            this.y = cy;
            let a = Math.random() * Math.PI * 2;
            let s = Math.random() * 25 + 5;
            this.vx = Math.cos(a) * s;
            this.vy = Math.sin(a) * s;
            this.size = Math.random() * 40 + 10;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
            this.size += 2;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(200, 210, 220, ${this.life * 0.5})`;
            ctx.fill();
        }
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        
        let interval = setInterval(() => {
            domeScale += 0.1;
            if(domeScale > 2.5) {
                clearInterval(interval);
                for(let i=0; i<150; i++) steamParticles.push(new Steam());
            }
        }, 30);
    });

    function getDomePoint(t) {
        // simple bell curve like shape
        let x = cx - 15 + (t * 30);
        let y = cy + 15 - Math.sin(t * Math.PI) * 20;
        return {x, y};
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked || domeScale <= 2.5) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(domeScale, domeScale);
            ctx.translate(-cx, -cy);

            // Axes
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy - 20);
            ctx.lineTo(cx - 20, cy + 20);
            ctx.lineTo(cx + 20, cy + 20);
            ctx.strokeStyle = '#999';
            ctx.stroke();

            // Dome
            ctx.beginPath();
            for(let t=0; t<=1; t+=0.05) {
                let p = getDomePoint(t);
                if(t===0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (!clicked) {
                tracerT += 0.01;
                if(tracerT > 1) tracerT = 0;
                let tp = getDomePoint(tracerT);
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, 2, 0, Math.PI*2);
                // color shifts from blue to red
                let r = Math.floor(255 * tracerT);
                let b = Math.floor(255 * (1-tracerT));
                ctx.fillStyle = `rgb(${r},0,${b})`;
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI*2);
                ctx.fillStyle = 'red';
                ctx.fill();
            }
            ctx.restore();
        } else {
            steamParticles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if(p.life <= 0) steamParticles.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
