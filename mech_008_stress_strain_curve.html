<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stress-Strain Curve</title>
<style>
  body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #1a1a1a; overflow: hidden; }
  .container { position: relative; width: 30px; height: 30px; cursor: pointer; }
  .axes { position: absolute; left: 2px; bottom: 2px; width: 26px; height: 26px; border-left: 1px solid #555; border-bottom: 1px solid #555; }
  .curve { position: absolute; left: 2px; bottom: 2px; width: 26px; height: 26px; overflow: visible; }
  .path { fill: none; stroke: #C0392B; stroke-width: 1.5; stroke-linecap: round; }
  .marker { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 4px #C0392B; transform: translate(-2px, -2px); left: 2px; top: 28px; }
  .fragment { position: absolute; width: 4px; height: 4px; background: #C0392B; border-radius: 50%; opacity: 0; }
</style>
</head>
<body>
<div class="container" id="ssc">
  <div class="axes"></div>
  <svg class="curve" viewBox="0 0 26 26">
    <path id="curvePath" class="path" d="M 0 26 L 8 16 Q 14 10, 18 10 T 26 18" />
  </svg>
  <div class="marker" id="marker"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  const container = document.getElementById('ssc');
  
  // Custom manual path trace for idle
  // top: 28px initially corresponds to (0,26) in SVG coords since marker is offset inside container
  const idle = gsap.to("#marker", {
    left: "+=8",
    top: "-=10",
    duration: 1.5,
    repeat: -1,
    yoyo: true,
    ease: "sine.inOut"
  });
  
  container.addEventListener('click', () => {
    idle.kill();
    // Offset reset because MotionPath takes over with absolute coordinates
    gsap.set("#marker", { left: 2, top: 2, transform: "translate(-2px, -2px)" });
    
    gsap.to("#marker", {
      duration: 1.5,
      ease: "power2.in",
      motionPath: { path: "#curvePath", align: "#curvePath", alignOrigin: [0.5, 0.5] },
      onComplete: () => {
        gsap.to("#curvePath", { strokeDasharray: "2, 4", stroke: "#ff0000", opacity: 0, duration: 0.1 });
        const markerPos = document.getElementById('marker').getBoundingClientRect();
        for(let i=0; i<20; i++) {
          let frag = document.createElement('div');
          frag.className = 'fragment';
          frag.style.left = markerPos.left + 'px';
          frag.style.top = markerPos.top + 'px';
          document.body.appendChild(frag);
          gsap.to(frag, {
            opacity: 1,
            x: (Math.random()-0.5)*500,
            y: (Math.random()-0.5)*500,
            duration: 1 + Math.random(),
            ease: "power3.out"
          });
        }
        gsap.to("#marker", { scale: 0, duration: 0.2 });
        setTimeout(() => container.remove(), 1500);
      }
    });
  });
</script>
</body>
</html>
