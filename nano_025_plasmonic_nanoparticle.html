<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plasmonic Nanoparticle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    cursor: pointer;
    width: 60px;
    height: 60px;
  }
  .em-wave {
    position: absolute;
    top: 50%; left: -50px;
    width: 160px; height: 40px;
    transform: translateY(-50%);
    opacity: 0.5;
  }
  .em-wave svg {
    width: 100%; height: 100%;
  }
  .em-wave path {
    fill: none;
    stroke: #3498db;
    stroke-width: 2;
  }
  .nanoparticle {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    background: #f39c12;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #f39c12;
  }
  .electron-cloud {
    position: absolute;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    background: rgba(241, 196, 15, 0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    filter: blur(2px);
  }
  .hot-spot {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: radial-gradient(circle, #fff, #f39c12, transparent 70%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    mix-blend-mode: multiply;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="hot-spot" id="hotSpot"></div>
<div class="container" id="model">
  <div class="em-wave" id="emWave">
    <svg viewBox="0 0 100 20" preserveAspectRatio="none">
      <path d="M0,10 Q12.5,0 25,10 T50,10 T75,10 T100,10" id="wavePath"></path>
    </svg>
  </div>
  <div class="electron-cloud" id="cloud"></div>
  <div class="nanoparticle" id="particle"></div>
</div>
<script>
  const cloud = document.getElementById('cloud');
  const wavePath = document.getElementById('wavePath');
  const model = document.getElementById('model');

  // Idle Animation: Cloud sloshes back and forth
  const idleTl = gsap.timeline({repeat: -1, yoyo: true});
  idleTl.to(cloud, { x: 5, duration: 0.5, ease: "sine.inOut" }, 0)
        .to(wavePath, { attr: { d: "M0,10 Q12.5,20 25,10 T50,10 T75,10 T100,10" }, duration: 0.5, ease: "sine.inOut" }, 0);

  let isAnimating = false;
  model.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    idleTl.kill();
    
    const tl = gsap.timeline();
    // LSPR peaks
    tl.to(cloud, { x: 15, scale: 1.5, duration: 0.1, yoyo: true, repeat: 10, ease: "sine.inOut" }, 0)
      .to(wavePath, { opacity: 0, duration: 0.2 }, 0)
      // Scorches glowing hot spot
      .to('#hotSpot', { opacity: 1, width: '200vw', height: '200vw', duration: 1.5, ease: "power2.in" }, 0.5)
      // Explode into photons
      .add(() => {
        for(let i=0; i<50; i++) {
          const p = document.createElement('div');
          p.style.position = 'absolute';
          p.style.width = '4px'; p.style.height = '4px';
          p.style.background = '#fff';
          p.style.boxShadow = '0 0 5px #f39c12';
          p.style.borderRadius = '50%';
          p.style.top = '50%'; p.style.left = '50%';
          model.appendChild(p);
          const angle = Math.random() * Math.PI * 2;
          const dist = 500 + Math.random() * 500;
          gsap.to(p, {
            x: Math.cos(angle) * dist,
            y: Math.sin(angle) * dist,
            opacity: 0,
            duration: 1 + Math.random(),
            ease: "power2.out"
          });
        }
        gsap.set(['#particle', '#cloud'], { opacity: 0 });
      }, 2.0)
      .to('#hotSpot', { opacity: 0, duration: 1 }, 2.5);
  });
</script>
</body>
</html>
