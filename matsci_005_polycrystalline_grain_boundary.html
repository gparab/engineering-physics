<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #scene { width: 40px; height: 40px; position: relative; cursor: pointer; overflow: hidden; border-radius: 50%; }
  
  .grain { position: absolute; width: 100%; height: 100%; background-size: 4px 4px; }
  .g1 { background-image: repeating-linear-gradient(0deg, #f1c40f, #f1c40f 1px, transparent 1px, transparent 4px); clip-path: polygon(50% 50%, 0 0, 100% 0, 100% 50%); }
  .g2 { background-image: repeating-linear-gradient(60deg, #f39c12, #f39c12 1px, transparent 1px, transparent 4px); clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 0 100%); }
  .g3 { background-image: repeating-linear-gradient(-60deg, #e67e22, #e67e22 1px, transparent 1px, transparent 4px); clip-path: polygon(50% 50%, 0 100%, 0 0); }
  
  .boundary { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="scene">
  <div class="grain g1"></div>
  <div class="grain g2"></div>
  <div class="grain g3"></div>
  <svg class="boundary" viewBox="0 0 40 40">
    <path d="M 20 20 L 40 20 M 20 20 L 0 40 M 20 20 L 0 0" stroke="#f1c40f" stroke-width="1.5" stroke-dasharray="1 1" id="bdPath" />
  </svg>
</div>
<script>
  const bdPath = document.getElementById('bdPath');
  gsap.to(bdPath, { strokeDashoffset: 10, duration: 1, repeat: -1, ease: "linear" });

  document.getElementById('scene').addEventListener('click', () => {
    gsap.to(".g2, .g3", { opacity: 0, duration: 0.5 });
    gsap.to(".boundary", { opacity: 0, duration: 0.5 });
    
    gsap.to("#scene", { scale: 100, duration: 1.5, ease: "power2.inOut", onComplete: () => {
      gsap.to("#scene", { opacity: 0, duration: 0.5 });
    }});
  });
</script>
</body>
</html>
