<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Counter</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  .container {
    position: relative;
    width: 200px;
    height: 100px;
    cursor: pointer;
  }
  .dial-box {
    width: 100px;
    height: 40px;
    border: 3px solid #1ABC9C;
    border-radius: 5px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1e293b;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .numbers-col {
    position: relative;
    top: 0;
    color: #1ABC9C;
    font-size: 24px;
    line-height: 40px;
    text-align: center;
    width: 20px;
  }
  .hex-prefix {
    color: #1ABC9C;
    font-size: 20px;
    margin-right: 5px;
  }
</style>
</head>
<body>
<div class="container" id="model">
  <div class="dial-box" id="dial">
    <span class="hex-prefix">0x</span>
    <div class="numbers-col" id="col1">
      <div>0</div>
    </div>
    <div class="numbers-col" id="col2">
      <div>0</div>
    </div>
    <div class="numbers-col" id="col3">
      <div>0</div>
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>A</div>
      <div>B</div>
      <div>C</div>
      <div>D</div>
      <div>E</div>
      <div>F</div>
    </div>
    <div class="numbers-col" id="col4">
      <div>4</div>
      <div>8</div>
      <div>C</div>
      <div>0</div>
      <div>4</div>
      <div>8</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const col4 = document.getElementById('col4');
  
  const tl = gsap.timeline({ repeat: -1 });
  for (let i = 0; i < 4; i++) {
    tl.to(col4, { top: `-=${40}px`, duration: 0.2, ease: "power1.inOut", delay: 1 });
  }

  const model = document.getElementById('model');
  model.addEventListener('click', () => {
    tl.kill();
    
    const clickTl = gsap.timeline();
    // Spin into blur
    clickTl.to(".numbers-col", { top: -200, duration: 0.5, ease: "power1.in" })
           .to(".numbers-col", { filter: "blur(4px)", duration: 0.2 }, 0)
           .to("#dial", { x: 300, opacity: 0, duration: 0.5, ease: "back.in(1.5)" }, 0.5);
  });
</script>
</body>
</html>
