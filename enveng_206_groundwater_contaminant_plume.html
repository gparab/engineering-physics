<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groundwater Contaminant Plume</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #1e1e1e;
        overflow: hidden;
    }
    #container {
        position: relative;
        width: 100px;
        height: 40px;
        cursor: pointer;
        background-color: #333;
        border-radius: 4px;
        overflow: hidden;
    }
    #plume {
        position: absolute;
        top: 15px;
        left: -10px;
        width: 15px;
        height: 10px;
        background-color: #9370DB;
        border-radius: 50%;
        filter: blur(2px);
    }
    #well {
        position: absolute;
        top: -40px;
        left: 70px;
        width: 4px;
        height: 40px;
        background-color: #fff;
    }
    .flow-lines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
        animation: flow 2s linear infinite;
    }
    @keyframes flow {
        from { background-position: 0 0; }
        to { background-position: 20px 0; }
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="container">
        <div class="flow-lines"></div>
        <div id="plume"></div>
        <div id="well"></div>
    </div>
<script>
    const container = document.getElementById('container');
    const plume = document.getElementById('plume');
    const well = document.getElementById('well');
    
    // Idle: Plume translates right and spreads
    let plumeTween = gsap.to(plume, {
        x: 60,
        scaleX: 2.5,
        scaleY: 1.5,
        duration: 4,
        ease: "none",
        repeat: -1,
        onRepeat: () => {
            gsap.set(plume, {x: 0, scaleX: 1, scaleY: 1});
        }
    });

    let clicked = false;
    container.addEventListener('click', () => {
        if(clicked) return;
        clicked = true;

        plumeTween.pause();

        const tl = gsap.timeline();
        
        // Extraction well drops in
        tl.to(well, {
            top: 0,
            duration: 0.5,
            ease: "bounce.out"
        });

        // Plume sucked to point (well tip)
        tl.to(plume, {
            x: 70,
            y: 0,
            scaleX: 0.5,
            scaleY: 0.5,
            duration: 1,
            ease: "power2.in"
        });

        // Pulled to surface
        tl.to(plume, {
            y: -50,
            opacity: 0,
            duration: 0.5,
            ease: "power1.in"
        });
        
        tl.to(well, {
            top: -40,
            duration: 0.5
        }, "-=0.2");
    });
</script>
</body>
</html>
