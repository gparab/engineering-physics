<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Glowing Flares UI</title>
<style>
  :root {
    --bg: #040406;
    --panel: #0a0a0f;
    --border: #1a1a24;
    
    /* Intense Neon Colors */
    --c-fluid: #00f2fe;
    --c-air:   #f0abfc;
    --c-fire:  #ff9900;
    --c-space: #818cf8;
    --c-earth: #34d399;
  }

  body {
    background-color: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 50px;
    user-select: none;
  }

  /* Typography & Layout */
  .header { text-align: center; max-width: 600px; }
  h1 { font-weight: 300; font-size: 13px; letter-spacing: 8px; margin: 0 0 8px 0; color: #fff; text-transform: uppercase; }
  p { font-size: 10px; letter-spacing: 3px; color: #666; margin: 0; text-transform: uppercase; }

  .instrument-panel {
    display: flex; gap: 10px;
  }
  @media (max-width: 800px) {
    .instrument-panel { flex-wrap: wrap; justify-content: center; max-width: 400px;}
  }

  .module {
    background: var(--panel);
    width: 130px; height: 160px;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
    transition: 0.3s;
  }
  .module:hover { border-color: rgba(255,255,255,0.1); background: #0d0d14; }

  /* Labels */
  .mod-id { font-size: 8px; color: #444; letter-spacing: 2px; position: absolute; top: 12px; left: 12px; }
  .mod-name { font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #aaa; position: absolute; bottom: 25px; text-transform: uppercase; }
  
  .reset-btn {
    position: absolute; bottom: 8px;
    background: transparent; color: #555; border: none;
    font-family: inherit; font-size: 8px; letter-spacing: 1px; padding: 2px 6px;
    cursor: pointer; opacity: 0; transition: 0.3s; pointer-events: none; text-transform: uppercase;
  }
  .reset-btn:hover { color: #fff; }
  .module.completed .reset-btn { opacity: 1; pointer-events: auto; }

  /* =======================================================================
     MICRO-ANIMATION STAGE
     ======================================================================= */
  .sensor-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; cursor: pointer; position: relative;
  }
  
  /* Universal Optical Flare */
  .flare { position: absolute; width: 60px; height: 60px; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; z-index: 10; }
  .flare::before, .flare::after {
    content: ''; position: absolute; background: currentColor;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 12px currentColor, 0 0 20px currentColor;
    border-radius: 10px;
  }
  .flare::before { width: 1px; height: 0px; }
  .flare::after { width: 0px; height: 1px; }

  .active .flare { animation: flash-flare 0.8s ease-out forwards; }
  .active .flare::before { animation: stretch-v 0.8s ease-out forwards; }
  .active .flare::after { animation: stretch-h 0.8s ease-out forwards; }

  @keyframes flash-flare { 0%, 50% { opacity: 1; filter: brightness(1.5); } 100% { opacity: 0; } }
  @keyframes stretch-v { 50% { height: 80px; width: 2px; } 100% { height: 0px; width: 0px; } }
  @keyframes stretch-h { 50% { width: 80px; height: 2px; } 100% { width: 0px; height: 0px; } }

  /* =======================================================================
     01. FLUID (Micro-Orbit)
     ======================================================================= */
  .fluid { color: var(--c-fluid); }
  .f-wrapper { width: 20px; height: 20px; animation: f-spin 1s linear infinite; position: relative; }
  .f-dot { position: absolute; width: 3px; height: 3px; background: currentColor; border-radius: 50%; box-shadow: 0 0 8px currentColor; top: 50%; transform: translateY(-50%); transition: 0.3s; }
  .f-d1 { left: 0; } .f-d2 { right: 0; }

  .sensor-area:hover .f-dot { box-shadow: 0 0 15px currentColor; filter: brightness(1.5); }

  .active.fluid .f-wrapper { animation: f-spin 0.2s linear infinite; }
  .active.fluid .f-d1 { animation: f-collide-1 0.4s ease-in forwards; }
  .active.fluid .f-d2 { animation: f-collide-2 0.4s ease-in forwards; }

  @keyframes f-spin { 100% { transform: rotate(360deg); } }
  @keyframes f-collide-1 { 100% { left: 8.5px; opacity: 0; transform: translateY(-50%) scale(2); } }
  @keyframes f-collide-2 { 100% { right: 8.5px; opacity: 0; transform: translateY(-50%) scale(2); } }

  /* =======================================================================
     02. AIR (Neon Helix)
     ======================================================================= */
  .air { color: var(--c-air); }
  .a-wrapper { width: 14px; height: 14px; position: relative; perspective: 100px; transform-style: preserve-3d; }
  .a-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1px solid currentColor; box-shadow: inset 0 0 4px currentColor, 0 0 4px currentColor; }
  .a-r1 { animation: a-spin1 2s linear infinite; }
  .a-r2 { animation: a-spin2 2.5s linear infinite; }

  .sensor-area:hover .a-ring { filter: brightness(1.5); }

  .active.air .a-ring { animation: a-vanish 0.6s ease-out forwards; }

  @keyframes a-spin1 { 100% { transform: rotateX(360deg) rotateY(180deg); } }
  @keyframes a-spin2 { 100% { transform: rotateY(360deg) rotateZ(180deg); } }
  @keyframes a-vanish { 100% { transform: scale(4); opacity: 0; border-width: 0; } }

  /* =======================================================================
     03. FIRE (Vibrating Core)
     ======================================================================= */
  .fire { color: var(--c-fire); }
  .z-core { width: 6px; height: 6px; background: currentColor; transform: rotate(45deg); box-shadow: 0 0 10px currentColor, 0 0 20px currentColor; animation: z-flicker 0.1s infinite alternate; transition: 0.3s; }

  .sensor-area:hover .z-core { transform: rotate(45deg) scale(1.5); box-shadow: 0 0 15px currentColor, 0 0 30px currentColor; }

  .active.fire .z-core { animation: z-implode 0.4s ease-in forwards; }

  @keyframes z-flicker { 0% { opacity: 0.8; transform: rotate(45deg) scale(0.9); } 100% { opacity: 1; transform: rotate(45deg) scale(1.1); } }
  @keyframes z-implode { 100% { transform: rotate(45deg) scale(0); opacity: 0; } }

  /* =======================================================================
     04. SPACE (Accretion Disk)
     ======================================================================= */
  .space { color: var(--c-space); }
  .s-disk { width: 16px; height: 16px; border-radius: 50%; border: 1.5px dashed currentColor; box-shadow: 0 0 10px currentColor; animation: s-spin 3s linear infinite; position: absolute; }
  .s-hole { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; box-shadow: inset 0 0 5px #000; z-index: 2; }

  .sensor-area:hover .s-disk { animation-duration: 1s; filter: brightness(1.5); box-shadow: 0 0 15px currentColor; }

  .active.space .s-disk { animation: s-suck 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
  .active.space .s-hole { animation: s-close 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }

  @keyframes s-spin { 100% { transform: rotate(360deg); } }
  @keyframes s-suck { 100% { transform: scale(0) rotate(720deg); opacity: 0; } }
  @keyframes s-close { 90% { transform: scale(1); } 100% { transform: scale(0); } }

  /* =======================================================================
     05. EARTH (Glowing Lattice)
     ======================================================================= */
  .earth { color: var(--c-earth); }
  .y-hex { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5px; fill: none; filter: drop-shadow(0 0 6px currentColor); animation: y-pulse 3s ease-in-out infinite; transition: 0.3s; }

  .sensor-area:hover .y-hex { filter: drop-shadow(0 0 12px currentColor); stroke-width: 2px; }

  .active.earth .y-hex { animation: y-shatter 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards; }

  @keyframes y-pulse { 50% { transform: scale(1.1); } }
  @keyframes y-shatter {
    40% { transform: scaleY(0.05) scaleX(1.2); stroke-width: 4px; }
    100% { transform: scaleY(0.05) scaleX(5); opacity: 0; }
  }

</style>
</head>
<body>

  <div class="header">
    <h1>Micro Holograms</h1>
    <p>Tiny, intensely glowing physics models with optical flares.</p>
  </div>

  <div class="instrument-panel">

    <!-- FLUID -->
    <div class="module">
      <span class="mod-id">01</span>
      <div class="sensor-area fluid" onclick="triggerAnim(this)">
        <div class="f-wrapper">
          <div class="f-dot f-d1"></div>
          <div class="f-dot f-d2"></div>
        </div>
        <div class="flare"></div>
      </div>
      <span class="mod-name">Fluid</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- AIR -->
    <div class="module">
      <span class="mod-id">02</span>
      <div class="sensor-area air" onclick="triggerAnim(this)">
        <div class="a-wrapper">
          <div class="a-ring a-r1"></div>
          <div class="a-ring a-r2"></div>
        </div>
        <div class="flare"></div>
      </div>
      <span class="mod-name">Air</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- FIRE -->
    <div class="module">
      <span class="mod-id">03</span>
      <div class="sensor-area fire" onclick="triggerAnim(this)">
        <div class="z-core"></div>
        <div class="flare"></div>
      </div>
      <span class="mod-name">Fire</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- SPACE -->
    <div class="module">
      <span class="mod-id">04</span>
      <div class="sensor-area space" onclick="triggerAnim(this)">
        <div class="s-disk"></div>
        <div class="s-hole"></div>
        <div class="flare"></div>
      </div>
      <span class="mod-name">Space</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

    <!-- EARTH -->
    <div class="module">
      <span class="mod-id">05</span>
      <div class="sensor-area earth" onclick="triggerAnim(this)">
        <svg viewBox="0 0 24 24" class="y-hex">
          <polygon points="12,4 19,8 19,16 12,20 5,16 5,8" />
        </svg>
        <div class="flare"></div>
      </div>
      <span class="mod-name">Earth</span>
      <button class="reset-btn" onclick="resetAnim(this)">Reset</button>
    </div>

  </div>

  <script>
    function triggerAnim(element) {
      if (element.classList.contains('active')) return;
      element.classList.add('active');
      const module = element.closest('.module');
      // Show reset button after animation completes
      setTimeout(() => {
        module.classList.add('completed');
      }, 1000);
    }

    function resetAnim(btn) {
      const module = btn.closest('.module');
      const area = module.querySelector('.sensor-area');
      module.classList.remove('completed');
      area.classList.remove('active');
      // Force DOM reflow
      void area.offsetWidth;
    }
  </script>
</body>
</html>
