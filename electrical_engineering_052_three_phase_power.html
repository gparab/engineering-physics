<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52. Three-Phase Power</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  .container {
    position: relative;
    width: 300px;
    height: 150px;
    cursor: pointer;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .wave {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0.8;
  }
  #phaseA { stroke: #F1C40F; } /* Yellow */
  #phaseB { stroke: #E74C3C; } /* Red */
  #phaseC { stroke: #3498DB; } /* Blue */
  
  .glass-crack {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 20%);
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div class="container" id="threePhase">
  <svg viewBox="0 0 300 150">
    <path class="wave" id="phaseA" />
    <path class="wave" id="phaseB" />
    <path class="wave" id="phaseC" />
  </svg>
</div>
<div class="glass-crack" id="crack"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const phaseA = document.getElementById('phaseA');
  const phaseB = document.getElementById('phaseB');
  const phaseC = document.getElementById('phaseC');
  
  let time = 0;
  let clicked = false;
  let phaseShift = { b: 120, c: 240 };
  let amplitude = { val: 30 };
  let freq = 0.05;
  
  function drawWave(pathElement, phaseOffset, amp) {
    let d = `M 0 75 `;
    for (let x = 0; x <= 300; x += 5) {
      const angle = (x * freq) + time + (phaseOffset * Math.PI / 180);
      const y = 75 - Math.sin(angle) * amp;
      d += `L ${x} ${y} `;
    }
    pathElement.setAttribute('d', d);
  }
  
  function animate() {
    if (!clicked) {
      time += 0.05;
    } else {
      time += 0.1;
    }
    
    drawWave(phaseA, 0, amplitude.val);
    drawWave(phaseB, phaseShift.b, amplitude.val);
    drawWave(phaseC, phaseShift.c, amplitude.val);
    
    requestAnimationFrame(animate);
  }
  animate();

  // Click Animation
  const container = document.getElementById('threePhase');
  
  container.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    
    const tl = gsap.timeline();
    
    // Waves align in-phase (shift to 0)
    tl.to(phaseShift, {
      b: 0,
      c: 0,
      duration: 1,
      ease: "power2.inOut"
    })
    // Change colors to match
    .to([phaseB, phaseC], {
      stroke: "#F1C40F",
      duration: 1
    }, 0)
    // Massive constructive spike
    .to(amplitude, {
      val: 200,
      duration: 0.2,
      ease: "power4.in"
    }, 1)
    // Shatter screen
    .to("#crack", {
      opacity: 1,
      scale: 3,
      duration: 0.1
    }, 1.1)
    .to(".wave", {
      opacity: 0,
      duration: 0.1
    }, 1.1)
    // Fade out
    .to("#crack", {
      opacity: 0,
      duration: 1
    }, 1.3);
  });
</script>
</body>
</html>
