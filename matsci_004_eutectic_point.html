<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #scene { width: 40px; height: 40px; position: relative; cursor: pointer; }
  svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: visible; }
  .line { stroke: #9b59b6; stroke-width: 2; stroke-linecap: round; }
  .droplet { position: absolute; width: 10px; height: 10px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg) translate(-50%, -50%); top: 15px; left: 20px; background: repeating-linear-gradient(45deg, #9b59b6, #9b59b6 2px, #fff 2px, #fff 4px); }
  .lamellae { position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: repeating-linear-gradient(90deg, #9b59b6, #9b59b6 20px, #eee 20px, #eee 40px); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="scene">
  <svg>
    <path class="line" d="M 0 0 L 20 20 L 40 0" fill="none" />
    <line class="line" x1="0" y1="20" x2="40" y2="20" />
  </svg>
  <div class="droplet" id="droplet"></div>
</div>
<div class="lamellae" id="lamellae"></div>
<script>
  const droplet = document.getElementById('droplet');
  
  const idle = gsap.to(droplet, { y: "-=2", duration: 0.5, yoyo: true, repeat: -1, ease: "sine.inOut" });
  
  let state = 0;
  setInterval(() => {
    if(state === 0) {
      droplet.style.background = 'radial-gradient(circle, #9b59b6 30%, #fff 30%)';
      state = 1;
    } else {
      droplet.style.background = 'repeating-linear-gradient(45deg, #9b59b6, #9b59b6 2px, #fff 2px, #fff 4px)';
      state = 0;
    }
  }, 200);

  document.getElementById('scene').addEventListener('click', () => {
    idle.kill();
    gsap.to(droplet, { y: "+=15", duration: 0.3, ease: "power2.in", onComplete: () => {
      droplet.style.display = 'none';
      const lam = document.getElementById('lamellae');
      lam.style.opacity = '1';
      gsap.to(lam, {
        width: Math.max(window.innerWidth, window.innerHeight) * 2,
        height: Math.max(window.innerWidth, window.innerHeight) * 2,
        duration: 1,
        ease: "expo.out",
        onComplete: () => {
          gsap.to(lam, { opacity: 0, duration: 1 });
        }
      });
    }});
  });
</script>
</body>
</html>
