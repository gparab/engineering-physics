<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Action Potential Spike</title>
<style>
  body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #111; overflow: hidden; }
  #container { cursor: pointer; position: relative; width: 100px; height: 50px; }
  #glow { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; opacity: 0; box-shadow: 0 0 30px #FF00FF; border-radius: 50%; mix-blend-mode: screen; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="container">
  <svg id="chart" viewBox="0 0 100 50" width="100" height="50" style="overflow:visible;">
    <path id="wave" d="M0,25 L20,25 L30,25 L40,25 L50,25 L70,25 L100,25" fill="none" stroke="#FF00FF" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div id="glow"></div>
</div>
<script>
  let wave = document.getElementById("wave");
  let idleAnim = gsap.to(wave, {
    attr: {d: "M0,25 L20,25 L28,24 L32,26 L40,25 L70,25 L100,25"},
    duration: 0.1, repeat: -1, yoyo: true, ease: "none"
  });
  
  let bumpInterval = setInterval(() => {
    if(idleAnim.isActive()) {
      gsap.to(wave, { attr: {d: "M0,25 L20,25 L30,20 L40,25 L70,25 L100,25"}, duration: 0.15, yoyo: true, repeat: 1 });
    }
  }, 1500);
  
  document.getElementById("container").addEventListener("click", () => {
    idleAnim.kill();
    clearInterval(bumpInterval);
    gsap.to(wave, {
      attr: {d: "M0,25 L20,25 L25,25 L30,-80 L35,40 L45,25 L100,25"},
      duration: 0.1,
      ease: "power2.inOut",
      onComplete: () => {
        gsap.to("#glow", {opacity: 1, duration: 0.1, yoyo: true, repeat: 3});
        gsap.to("#chart", {
          x: window.innerWidth,
          duration: 0.6,
          ease: "power3.in",
          delay: 0.1
        });
      }
    });
  });
</script>
</body>
</html>
