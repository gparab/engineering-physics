<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservoir Flow (Radial Darcy)</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  
  .container {
    position: relative;
    width: 24px;
    height: 24px;
    cursor: pointer;
  }
  
  .disc {
    position: absolute;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(139, 0, 0, 0.4);
    box-sizing: border-box;
  }
  
  .wellbore {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 4px;
    background-color: #8B0000;
    border-radius: 50%;
    box-shadow: 0 0 4px #8B0000;
  }

  .dot {
    position: absolute;
    width: 1.5px;
    height: 1.5px;
    background-color: #8B0000;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
  }

  /* Full screen effects */
  #cone-of-depression {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, #000 0%, transparent 80%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
    box-shadow: inset 0 0 50px 20px #8B0000;
    opacity: 0;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container" id="model-container">
  <div class="disc"></div>
  <div class="wellbore" id="wellbore"></div>
  <!-- Dots generated by JS -->
</div>

<div id="cone-of-depression"></div>

<script>
  const container = document.getElementById('model-container');
  const dots = [];
  
  for (let i = 0; i < 12; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    container.appendChild(dot);
    
    const angle = (i / 12) * Math.PI * 2;
    
    gsap.fromTo(dot, 
      {
        x: Math.cos(angle) * 11,
        y: Math.sin(angle) * 11,
        opacity: 0
      },
      {
        x: Math.cos(angle) * 2,
        y: Math.sin(angle) * 2,
        opacity: 1,
        duration: 1.5 + Math.random() * 1,
        repeat: -1,
        ease: "power1.in",
        delay: Math.random() * 2
      }
    );
    dots.push(dot);
  }

  container.addEventListener('click', () => {
    gsap.killTweensOf(".dot");
    gsap.to(".dot", {opacity: 0, duration: 0.2});
    gsap.to(".disc", {borderColor: "rgba(139, 0, 0, 0)", duration: 0.2});

    const cone = document.getElementById('cone-of-depression');
    
    gsap.to(cone, {
      width: "300vw",
      height: "300vw",
      opacity: 1,
      duration: 1.5,
      ease: "power3.in",
      onComplete: () => {
        container.style.display = 'none';
        gsap.to(cone, {
          background: "#000",
          boxShadow: "none",
          duration: 0.5
        });
      }
    });

    gsap.to("#wellbore", {
      scale: 0,
      opacity: 0,
      duration: 0.5,
      delay: 0.2,
      ease: "back.in(2)"
    });
  });
</script>
</body>
</html>
