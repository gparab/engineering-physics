<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #scene { width: 40px; height: 40px; position: relative; cursor: pointer; background: rgba(52, 73, 94, 0.3); border-radius: 4px; }
  .fiber { position: absolute; width: 36px; height: 3px; background: #34495e; left: 2px; border-radius: 1px; }
  .f1 { top: 10px; }
  .f2 { top: 20px; }
  .f3 { top: 30px; }
  
  .stress { position: absolute; width: 0; height: 1px; background: rgba(255,255,255,0.8); top: 1px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 2px #fff;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div id="scene">
  <div class="fiber f1"><div class="stress"></div></div>
  <div class="fiber f2"><div class="stress"></div></div>
  <div class="fiber f3"><div class="stress"></div></div>
</div>
<script>
  gsap.to(".stress", { width: "30px", opacity: 0, duration: 1, repeat: -1, ease: "power1.out" });

  document.getElementById('scene').addEventListener('click', () => {
    gsap.to("#scene", { backgroundColor: "rgba(52, 73, 94, 0)", duration: 0.5 });
    
    gsap.killTweensOf(".stress");
    document.querySelectorAll('.stress').forEach(e => e.style.display = 'none');
    
    document.querySelectorAll('.fiber').forEach((f, i) => {
      const f_left = document.createElement('div');
      f_left.className = 'fiber';
      f_left.style.width = '18px';
      f_left.style.top = f.style.top || (10 * (i+1)) + 'px';
      f_left.style.left = '2px';
      
      const f_right = document.createElement('div');
      f_right.className = 'fiber';
      f_right.style.width = '18px';
      f_right.style.top = f.style.top || (10 * (i+1)) + 'px';
      f_right.style.left = '20px';
      
      document.getElementById('scene').appendChild(f_left);
      document.getElementById('scene').appendChild(f_right);
      
      f.style.display = 'none';
      
      gsap.to(f_left, { x: -window.innerWidth, rotation: (Math.random()-0.5)*45, duration: 1.5, ease: "power2.in", delay: 0.5 });
      gsap.to(f_right, { x: window.innerWidth, rotation: (Math.random()-0.5)*45, duration: 1.5, ease: "power2.in", delay: 0.5 });
    });
  });
</script>
</body>
</html>
