<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D Flip-Flop</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 200px;
    height: 200px;
    cursor: pointer;
  }
  svg {
    width: 100%;
    height: 100%;
  }
  .box {
    fill: none;
    stroke: #F39C12;
    stroke-width: 4;
  }
  .clk-triangle {
    fill: none;
    stroke: #F39C12;
    stroke-width: 3;
    stroke-linejoin: miter;
  }
  .dot {
    fill: #F39C12;
  }
  .clk-flash {
    fill: #F39C12;
    opacity: 0;
  }
  .half {
    fill: none;
    stroke: #F39C12;
    stroke-width: 4;
  }
</style>
</head>
<body>
<div class="container" id="model">
  <svg viewBox="0 0 100 100" id="svg-element">
    <g id="box-group">
      <rect class="box" x="25" y="25" width="50" height="50" id="main-box" />
      <path class="clk-triangle" d="M25,65 L35,70 L25,75" />
      <circle class="clk-flash" cx="30" cy="70" r="6" id="flash" />
      <text x="35" y="40" fill="#F39C12" font-family="monospace" font-size="12">D</text>
      <text x="60" y="40" fill="#F39C12" font-family="monospace" font-size="12">Q</text>
      <circle class="dot" cx="50" cy="60" r="4" id="state-dot" />
    </g>
    
    <!-- Halves for click animation -->
    <path class="half" d="M25,50 L25,25 L75,25 L75,50" id="top-half" style="opacity: 0;" />
    <path class="half" d="M25,50 L25,75 L75,75 L75,50" id="bottom-half" style="opacity: 0;" />
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ repeat: -1 });
  
  tl.to("#flash", { opacity: 0.8, duration: 0.1 })
    .to("#flash", { opacity: 0, duration: 0.1 })
    .to("#state-dot", { y: -25, duration: 0.2, ease: "bounce.out" })
    .to("#state-dot", { delay: 0.5, duration: 0 })
    .to("#flash", { opacity: 0.8, duration: 0.1 })
    .to("#flash", { opacity: 0, duration: 0.1 })
    .to("#state-dot", { y: 0, duration: 0.2, ease: "bounce.out" })
    .to("#state-dot", { delay: 0.5, duration: 0 });

  const model = document.getElementById('model');
  model.addEventListener('click', () => {
    tl.kill();
    
    gsap.set("#box-group", { opacity: 0 });
    gsap.set(["#top-half", "#bottom-half"], { opacity: 1 });
    
    const clickTl = gsap.timeline();
    clickTl.to("#top-half", { y: -150, opacity: 0, duration: 0.6, ease: "power3.in" }, 0)
           .to("#bottom-half", { y: 150, opacity: 0, duration: 0.6, ease: "power3.in" }, 0);
  });
</script>
</body>
</html>
