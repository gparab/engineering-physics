<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E=MC² (Mass-Energy Equivalence)</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #111; overflow: hidden; }
        
        .system { position: relative; width: 200px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
        
        .scale { width: 150px; height: 20px; background: #555; border-radius: 10px 10px 0 0; position: relative; border-bottom: 5px solid #333; }
        .scale-dial { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 15px; background: #222; border: 2px solid #777; border-radius: 15px 15px 0 0; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
        .needle { width: 2px; height: 15px; background: red; transform-origin: bottom center; transform: rotate(20deg); animation: needle-wobble 2s ease-in-out infinite alternate; }

        .cube-container { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: -5px; z-index: 10; }
        
        .cube { width: 80px; height: 80px; background: #FFD700; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(255, 215, 0, 0.5); animation: breathe 2s ease-in-out infinite alternate; border-radius: 5px; position: relative; }

        .spark { position: absolute; width: 4px; height: 4px; background: #FFF; border-radius: 50%; box-shadow: 0 0 10px #FFF, 0 0 20px #FFD700; opacity: 0; pointer-events: none; }

        @keyframes breathe {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(0.95); filter: brightness(1.5); box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(255, 215, 0, 1); }
        }

        @keyframes needle-wobble {
            0% { transform: rotate(20deg); }
            100% { transform: rotate(15deg); }
        }
        
        @keyframes shoot-spark {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #FFF; opacity: 0; pointer-events: none; transition: opacity 0.1s; mix-blend-mode: screen; z-index: 100; }
        
        .detonate .flash { opacity: 1; transition: opacity 0.05s; }
        .detonate .cube { display: none; }
        .detonate .scale { filter: brightness(100); }
    </style>
</head>
<body>
    <div class="system" id="sys">
        <div class="cube-container">
            <div class="cube" id="cube"></div>
        </div>
        <div class="scale">
            <div class="scale-dial"><div class="needle"></div></div>
        </div>
    </div>
    <div class="flash"></div>

    <script>
        const sys = document.getElementById('sys');
        const cube = document.getElementById('cube');
        let clicked = false;
        
        // idle sparks
        setInterval(() => {
            if(clicked) return;
            const spark = document.createElement('div');
            spark.className = 'spark';
            // Random direction
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 50;
            spark.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
            spark.style.setProperty('--dy', `${Math.sin(angle)*dist}px`);
            
            spark.style.left = '50%';
            spark.style.top = '50%';
            spark.style.animation = 'shoot-spark 1s ease-out forwards';
            cube.appendChild(spark);
            
            setTimeout(() => { if(spark.parentNode) spark.remove(); }, 1000);
        }, 300);

        sys.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;
            document.body.classList.add('detonate');
            document.body.style.background = '#FFF';
        });
    </script>
</body>
</html>
