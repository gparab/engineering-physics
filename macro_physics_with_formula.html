<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Physics - Space Equation</title>
<style>
  :root {
    --bg: #030305;
    --dock: rgba(20, 20, 25, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    
    /* Specific Elemental Colors */
    --c-fluid: #00f2fe;
    --c-air:   #f8fafc;
    --c-fire:  #ff4500;
    --c-space: #c026d3;
    --c-earth: #10b981;
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    min-height: 600px;
    background-color: var(--bg); color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden; 
  }

  .header { position: absolute; top: 40px; left: 0; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
  h1 { font-weight: 300; font-size: 11px; letter-spacing: 10px; margin: 0 0 10px 0; color: #fff; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  p { font-size: 9px; letter-spacing: 3px; color: #888; margin: 0; text-transform: uppercase; }

  /* Minimalist Dock */
  .dock-container {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 20px; z-index: 15;
  }

  .trigger {
    width: 60px; height: 60px;
    background: var(--dock); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .trigger:hover { background: rgba(30, 30, 35, 0.9); border-color: rgba(255,255,255,0.2); transform: translateY(-5px); }

  .label {
    position: absolute; top: -25px; font-size: 9px; letter-spacing: 2px; color: #aaa;
    text-transform: uppercase; opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .trigger:hover .label { opacity: 1; transform: translateY(-5px); }

  /* Reset Button */
  .reset-btn {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: transparent; color: #666; border: 1px solid #444; border-radius: 4px;
    font-family: inherit; font-size: 9px; letter-spacing: 2px; padding: 6px 12px;
    cursor: pointer; opacity: 0; transition: 0.3s; pointer-events: none; text-transform: uppercase; z-index: 15;
  }
  .reset-btn:hover { color: #fff; border-color: #fff; }
  .reset-btn.visible { opacity: 1; pointer-events: auto; }

  /* =======================================================================
     TINY IDLE ANIMATIONS (In Dock)
     ======================================================================= */
  .icon-svg { width: 20px; height: 20px; overflow: visible; stroke-linecap: round; stroke-linejoin: round; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

  /* FLUID (Tear Drop) */
  .i-fluid { fill: var(--c-fluid); stroke: none; filter: drop-shadow(0 0 6px var(--c-fluid)); animation: fluid-idle 3s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes fluid-idle { 50% { transform: scale(1.1, 0.9); } }

  /* AIR (Wind Curls) */
  .i-air { stroke: var(--c-air); stroke-width: 1.5px; fill: none; filter: drop-shadow(0 0 6px var(--c-air)); animation: air-idle 4s linear infinite; transform-origin: center; }
  @keyframes air-idle { 100% { transform: rotate(360deg); } }

  /* FIRE (Faceted Flame) */
  .i-fire { fill: var(--c-fire); stroke: none; filter: drop-shadow(0 0 8px var(--c-fire)); animation: fire-idle 0.15s infinite alternate; transform-origin: center bottom; }
  @keyframes fire-idle { 0% { transform: scale(0.9, 1.1) skewX(2deg); } 100% { transform: scale(1.1, 0.9) skewX(-2deg); } }

  /* SPACE (Chalk writing Physics Equation) */
  .i-chalk { stroke: var(--c-space); stroke-width: 1.5px; fill: none; filter: drop-shadow(0 0 6px var(--c-space)); animation: chalk-write 1.5s infinite alternate; transform-origin: bottom left; }
  @keyframes chalk-write { 0% { transform: rotate(-10deg) translate(-2px, 0); } 100% { transform: rotate(10deg) translate(2px, -2px); } }

  /* EARTH (Crystal Lattice) */
  .i-earth { stroke: var(--c-earth); stroke-width: 1.5px; fill: none; filter: drop-shadow(0 0 6px var(--c-earth)); animation: earth-idle 4s ease-in-out infinite; transform-origin: center; }
  @keyframes earth-idle { 50% { transform: scale(1.1); stroke-width: 2px; } }

  /* Disappearance States */
  .trigger.consumed .icon-svg { opacity: 0; pointer-events: none; }
  .trigger.consumed .i-fluid { transform: translateY(30px) scale(0.1, 3); }
  .trigger.consumed .i-air { transform: translateX(30px) scale(0); }
  .trigger.consumed .i-fire { transform: scale(0); }
  .trigger.consumed .i-chalk { transform: scale(0); }
  .trigger.consumed .i-earth { transform: scaleY(0.1) scaleX(3); }

  /* =======================================================================
     MASSIVE PAGE-WIDE EFFECTS LAYER
     ======================================================================= */
  #fx-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: hidden; }

  /* Fluid Tsunami */
  .fx-tsunami { position: absolute; bottom: -50%; left: -50%; width: 200%; height: 150%; background: radial-gradient(ellipse at top, #00f2fe 0%, #0066ff 100%); border-radius: 50% 50% 0 0; mix-blend-mode: screen; filter: blur(4px); animation: tsunami-rise 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  @keyframes tsunami-rise { 0% { transform: translateY(100%); opacity: 1; } 50% { transform: translateY(-30%); opacity: 1; } 100% { transform: translateY(100%); opacity: 0; } }

  /* Air Gale */
  .fx-gale-streak { position: absolute; left: -100vw; height: 2px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: gale-sweep 1s cubic-bezier(0.7, 0, 0.3, 1) forwards; filter: blur(1px) drop-shadow(0 0 5px #fff); }
  @keyframes gale-sweep { 100% { transform: translateX(250vw); opacity: 0; } }

  /* Fire Supernova */
  .fx-fire-nova { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ff4500; transform: translate(-50%, -50%); box-shadow: 0 0 100px 50px #ff4500, 0 0 200px 100px #ffaa00; mix-blend-mode: screen; animation: nova-burst 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
  @keyframes nova-burst { 100% { transform: translate(-50%, -50%) scale(300); opacity: 0; } }
  .fx-ember { position: absolute; width: 3px; height: 3px; background: #ffaa00; border-radius: 50%; box-shadow: 0 0 10px #ff4500; animation: ember-float 2s ease-out forwards; }
  @keyframes ember-float { 100% { transform: translateY(-200px) scale(0); opacity: 0; } }

  /* Earth Fracture */
  .fx-fracture-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .fx-fracture-path { fill: none; stroke: var(--c-earth); stroke-width: 4px; filter: drop-shadow(0 0 15px var(--c-earth)); stroke-dasharray: 4000; stroke-dashoffset: 4000; animation: earth-crack 2s ease-out forwards; }
  @keyframes earth-crack { 40% { stroke-dashoffset: 0; opacity: 1; stroke-width: 10px; } 100% { stroke-dashoffset: 0; opacity: 0; stroke-width: 0px; filter: blur(20px); } }

  /* SPACE + CHALK EQUATION */
  .fx-formula {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 6vw;
    color: #fff; text-shadow: 0 0 20px var(--c-space), 0 0 40px var(--c-space);
    white-space: nowrap; pointer-events: none; z-index: 6;
    clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%);
    animation: write-formula 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fade-formula 1s 1.5s forwards;
  }
  .fx-formula sub { font-size: 2.5vw; }
  .fx-formula .frac { display: inline-block; vertical-align: middle; text-align: center; font-size: 4.5vw; margin: 0 1vw; }
  .fx-formula .frac div:first-child { border-bottom: 0.4vw solid #fff; padding-bottom: 0.5vw; margin-bottom: 0.5vw; }

  @keyframes write-formula { 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }
  @keyframes fade-formula { 100% { filter: blur(20px); opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }

  .fx-black-hole {
    position: absolute; width: 10px; height: 10px; background: #000; border-radius: 50%;
    transform: translate(-50%, -50%); z-index: 7;
    box-shadow: 0 0 50px 30px #c026d3, 0 0 150px 80px #4338ca, inset 0 0 20px #000;
    animation: hole-expand 2s cubic-bezier(0.7, 0, 0.3, 1) forwards;
  }
  @keyframes hole-expand { 50% { width: 300vmax; height: 300vmax; opacity: 1; } 100% { width: 0; height: 0; opacity: 0; } }

</style>
</head>
<body>

  <div class="header">
    <h1>MACRO PHYSICS</h1>
    <p>Including Einstein's Field Equations</p>
  </div>

  <div id="fx-layer"></div>

  <div class="dock-container">
    
    <!-- FLUID -->
    <div class="trigger" onclick="triggerEffect('fluid', this, event)">
      <span class="label" style="color: var(--c-fluid)">Fluid</span>
      <svg class="icon-svg i-fluid" viewBox="0 0 24 24"><path d="M12,22 C17.5,22 20,16.5 12,3 C4,16.5 6.5,22 12,22 Z" /></svg>
    </div>

    <!-- AIR -->
    <div class="trigger" onclick="triggerEffect('air', this, event)">
      <span class="label" style="color: var(--c-air)">Air</span>
      <svg class="icon-svg i-air" viewBox="0 0 24 24"><path d="M 6,12 Q 12,6 18,12" /><path d="M 4,16 Q 12,10 20,16" /><path d="M 8,8 Q 12,2 16,8" /></svg>
    </div>

    <!-- FIRE -->
    <div class="trigger" onclick="triggerEffect('fire', this, event)">
      <span class="label" style="color: var(--c-fire)">Fire</span>
      <svg class="icon-svg i-fire" viewBox="0 0 24 24"><path d="M12,22 C16,22 18,18 15,13 C14,11 12,8 12,4 C12,8 10,11 9,13 C6,18 8,22 12,22 Z" /></svg>
    </div>

    <!-- SPACE + CHALK -->
    <div class="trigger" onclick="triggerEffect('space', this, event)">
      <span class="label" style="color: var(--c-space)">Space</span>
      <svg class="icon-svg i-chalk" viewBox="0 0 24 24">
         <polygon points="17,3 21,7 9,19 5,19 5,15" />
         <line x1="17" y1="3" x2="5" y2="15" />
         <path d="M 2,21 Q 12,25 22,21" stroke-dasharray="2 4"/>
      </svg>
    </div>

    <!-- EARTH -->
    <div class="trigger" onclick="triggerEffect('earth', this, event)">
      <span class="label" style="color: var(--c-earth)">Earth</span>
      <svg class="icon-svg i-earth" viewBox="0 0 24 24"><polygon points="12,3 19,9 12,21 5,9" /><line x1="5" y1="9" x2="19" y2="9" /><line x1="12" y1="3" x2="12" y2="21" /></svg>
    </div>

  </div>

  <button class="reset-btn" id="resetBtn" onclick="resetAll()">Restore Environment</button>

  <script>
    const fxLayer = document.getElementById('fx-layer');
    const resetBtn = document.getElementById('resetBtn');
    let isAnimating = false;

    function triggerEffect(type, btn, event) {
      if(isAnimating || btn.classList.contains('consumed')) return;
      isAnimating = true;
      btn.classList.add('consumed');
      
      const rect = btn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      if(type === 'fluid') runFluidFX();
      if(type === 'air') runAirFX();
      if(type === 'fire') runFireFX(originX, originY);
      if(type === 'space') runSpaceFX(originX, originY);
      if(type === 'earth') runEarthFX(originX);

      setTimeout(() => {
        isAnimating = false;
        checkAllConsumed();
      }, 2500);
    }

    function runFluidFX() {
      const wave = document.createElement('div');
      wave.className = 'fx-tsunami';
      fxLayer.appendChild(wave);
      setTimeout(() => wave.remove(), 2500);
    }

    function runAirFX() {
      for(let i=0; i<30; i++) {
        const streak = document.createElement('div');
        streak.className = 'fx-gale-streak';
        streak.style.top = (Math.random() * 100) + 'vh';
        streak.style.width = (Math.random() * 400 + 100) + 'px';
        streak.style.animationDelay = (Math.random() * 0.4) + 's';
        fxLayer.appendChild(streak);
        setTimeout(() => streak.remove(), 1500);
      }
    }

    function runFireFX(x, y) {
      const nova = document.createElement('div');
      nova.className = 'fx-fire-nova';
      nova.style.left = x + 'px';
      nova.style.top = y + 'px';
      fxLayer.appendChild(nova);
      setTimeout(() => nova.remove(), 2000);
      for(let i=0; i<40; i++) {
        const ember = document.createElement('div');
        ember.className = 'fx-ember';
        ember.style.left = x + (Math.random() - 0.5) * 200 + 'px';
        ember.style.top = y + (Math.random() - 0.5) * 100 + 'px';
        ember.style.animationDelay = (Math.random() * 0.5) + 's';
        fxLayer.appendChild(ember);
        setTimeout(() => ember.remove(), 2500);
      }
    }

    function runSpaceFX(x, y) {
      // 1. Reveal Formula
      const formula = document.createElement('div');
      formula.className = 'fx-formula';
      // Einstein Field Equations
      formula.innerHTML = 'R<sub>μν</sub> - ½Rg<sub>μν</sub> + Λg<sub>μν</sub> = <span class="frac"><div>8πG</div><div>c⁴</div></span> T<sub>μν</sub>';
      fxLayer.appendChild(formula);

      // 2. Swallow with Black Hole
      setTimeout(() => {
        const hole = document.createElement('div');
        hole.className = 'fx-black-hole';
        hole.style.left = '50%';
        hole.style.top = '50%';
        fxLayer.appendChild(hole);
        setTimeout(() => hole.remove(), 2500);
      }, 1000);

      setTimeout(() => formula.remove(), 3500);
    }

    function runEarthFX(x) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'fx-fracture-svg');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'fx-fracture-path');
      let d = `M ${x} ${window.innerHeight}`;
      let currX = x;
      for(let y = window.innerHeight; y > -100; y -= 40) {
         currX += (Math.random() - 0.5) * 120;
         d += ` L ${currX} ${y}`;
      }
      path.setAttribute('d', d);
      svg.appendChild(path);
      fxLayer.appendChild(svg);
      setTimeout(() => svg.remove(), 2500);
    }

    function checkAllConsumed() { resetBtn.classList.add('visible'); }
    function resetAll() {
      document.querySelectorAll('.trigger').forEach(btn => btn.classList.remove('consumed'));
      resetBtn.classList.remove('visible');
      fxLayer.innerHTML = '';
    }
  </script>
</body>
</html>
