<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 24px;
    height: 30px;
    cursor: pointer;
  }
  .plate {
    position: absolute;
    width: 6px; height: 30px;
    border: 1px solid #FF8C00;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
  }
  .plate-left { left: 4px; border-right: none; }
  .plate-right { right: 4px; border-left: none; }
  .charge {
    width: 2px; height: 2px;
    border-radius: 50%;
    animation: vibrate 0.1s infinite alternate linear;
  }
  .plate-left .charge { background: #FF4500; }
  .plate-right .charge { background: #1E90FF; }
  
  @keyframes vibrate {
    0% { transform: translateX(-1px); }
    100% { transform: translateX(1px); }
  }
  
  .arc {
    position: absolute;
    left: 8px; top: 15px;
    width: 8px; height: 2px;
    background: #fff;
    box-shadow: 0 0 10px 5px #FF8C00;
    opacity: 0;
    transform-origin: 0 50%;
  }
</style>
</head>
<body>
<div class="container" id="model">
  <div class="plate plate-left" id="pL">
    <div class="charge"></div><div class="charge"></div><div class="charge"></div><div class="charge"></div><div class="charge"></div>
  </div>
  <div class="plate plate-right" id="pR">
    <div class="charge"></div><div class="charge"></div><div class="charge"></div><div class="charge"></div><div class="charge"></div>
  </div>
</div>
<script>
  document.getElementById('model').onclick = function() {
    this.style.pointerEvents = 'none';
    let charges = document.querySelectorAll('.charge');
    charges.forEach(c => c.style.animation = 'none');
    
    // Create multiple arcs
    for(let i=0; i<3; i++) {
      let arc = document.createElement('div');
      arc.className = 'arc';
      arc.style.top = (5 + i*10) + 'px';
      this.appendChild(arc);
      arc.animate([
        { opacity: 0, transform: 'scaleX(0)' },
        { opacity: 1, transform: 'scaleX(1)', offset: 0.1 },
        { opacity: 1, transform: 'scaleX(1) scaleY(10)', filter: 'brightness(3)', offset: 0.5 },
        { opacity: 0, transform: 'scaleX(1) scaleY(20)' }
      ], { duration: 400, fill: 'forwards' });
    }
    
    setTimeout(() => {
      document.getElementById('pL').style.display = 'none';
      document.getElementById('pR').style.display = 'none';
    }, 200);
  };
</script>
</body>
</html>
