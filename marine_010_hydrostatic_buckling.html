<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hydrostatic Buckling</title>
<style>
  body { margin: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .icon-container { position: relative; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .hull { position: absolute; width: 20px; height: 20px; background: #111111; border: 2px solid #444; border-radius: 50%; box-shadow: inset 0 0 5px #000; }
  .arrow { position: absolute; width: 2px; height: 6px; background: #777; }
  .arrow::after { content: ''; position: absolute; bottom: -3px; left: -2px; border-top: 4px solid #777; border-left: 3px solid transparent; border-right: 3px solid transparent; }
  .a1 { top: -2px; left: 19px; transform: rotate(0deg); }
  .a2 { bottom: -2px; left: 19px; transform: rotate(180deg); }
  .a3 { top: 17px; left: -4px; transform: rotate(270deg); }
  .a4 { top: 17px; right: -4px; transform: rotate(90deg); }
  
  .shockwave { position: absolute; width: 0; height: 0; border: 2px solid #fff; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div class="icon-container" id="icon">
    <div class="arrow a1"></div>
    <div class="arrow a2"></div>
    <div class="arrow a3"></div>
    <div class="arrow a4"></div>
    <div class="hull" id="hull"></div>
  </div>
  <script>
    const icon = document.getElementById('icon');
    const hull = document.getElementById('hull');
    let isAnimating = false;

    // Idle: arrows press inward, sphere compresses and rebounds
    const idleArrows = gsap.to('.arrow', { 
      y: (i, t) => {
        if(t.classList.contains('a1')) return 2;
        if(t.classList.contains('a2')) return -2;
        return 0;
      },
      x: (i, t) => {
        if(t.classList.contains('a3')) return 2;
        if(t.classList.contains('a4')) return -2;
        return 0;
      },
      duration: 1, yoyo: true, repeat: -1, ease: "sine.inOut"
    });
    
    const idleHull = gsap.to(hull, { scale: 0.9, duration: 1, yoyo: true, repeat: -1, ease: "sine.inOut" });

    icon.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;
      idleArrows.kill();
      idleHull.kill();

      // Deep compression
      gsap.to('.arrow', { scale: 1.5, duration: 0.3 });
      gsap.to(hull, { 
        scale: 0.7, 
        backgroundColor: '#ff0000', 
        borderColor: '#ff5555',
        duration: 0.3,
        onComplete: () => {
          // Instantaneous buckling / implosion
          gsap.to(hull, {
            scale: 0,
            duration: 0.05,
            onComplete: () => {
              gsap.to('.arrow', { opacity: 0, duration: 0.1 });
              
              // Shockwave expanding outward
              let sw = document.createElement('div');
              sw.className = 'shockwave';
              document.body.appendChild(sw);
              
              const rect = icon.getBoundingClientRect();
              gsap.set(sw, { top: rect.top + 20, left: rect.left + 20 });
              
              gsap.to(sw, {
                width: window.innerWidth * 2,
                height: window.innerWidth * 2,
                opacity: 1,
                borderWidth: 20,
                duration: 0.6,
                ease: "power2.out",
                onComplete: () => gsap.to(sw, { opacity: 0, duration: 0.2 })
              });
            }
          });
        }
      });
    });
  </script>
</body>
</html>
