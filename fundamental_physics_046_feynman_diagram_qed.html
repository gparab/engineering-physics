<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feynman Diagram (QED)</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #111; overflow: hidden; }
        
        .diagram { position: relative; width: 300px; height: 300px; cursor: pointer; }
        
        svg { width: 100%; height: 100%; }
        
        .electron { fill: none; stroke: #fff; stroke-width: 3; }
        .photon { fill: none; stroke: #1E90FF; stroke-width: 3; stroke-dasharray: 5, 5; animation: ripple 0.5s linear infinite; }
        
        @keyframes ripple {
            from { stroke-dashoffset: 10; }
            to { stroke-dashoffset: 0; }
        }

        .particle { fill: #fff; filter: drop-shadow(0 0 5px #fff); }
        
        .p1 { animation: move-e1 3s linear infinite; }
        .p2 { animation: move-e2 3s linear infinite; }

        @keyframes move-e1 {
            0% { transform: translate(50px, 250px); }
            45% { transform: translate(120px, 150px); }
            55% { transform: translate(120px, 150px); }
            100% { transform: translate(50px, 50px); }
        }
        
        @keyframes move-e2 {
            0% { transform: translate(250px, 250px); }
            45% { transform: translate(180px, 150px); }
            55% { transform: translate(180px, 150px); }
            100% { transform: translate(250px, 50px); }
        }
        
        .photon-packet { fill: #1E90FF; filter: drop-shadow(0 0 5px #1E90FF); opacity: 0; animation: exchange 3s linear infinite; }
        
        @keyframes exchange {
            0%, 45% { opacity: 0; transform: translate(120px, 150px); }
            50% { opacity: 1; transform: translate(150px, 150px); }
            55% { opacity: 0; transform: translate(180px, 150px); }
            100% { opacity: 0; }
        }

        /* Click state */
        .fractal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .clicked .base-diagram { display: none; }
        .clicked .fractal { display: block; }
    </style>
</head>
<body>
    <div class="diagram" id="diagram">
        <svg class="base-diagram">
            <!-- Time axis is bottom to top -->
            <!-- Electron 1 -->
            <path class="electron" d="M 50,250 L 120,150 L 50,50" />
            <polygon points="85,200 95,205 80,215" fill="#fff" /> <!-- Arrow in -->
            <polygon points="85,100 80,85 95,95" fill="#fff" /> <!-- Arrow out -->

            <!-- Electron 2 -->
            <path class="electron" d="M 250,250 L 180,150 L 250,50" />
            <polygon points="215,200 205,205 220,215" fill="#fff" />
            <polygon points="215,100 220,85 205,95" fill="#fff" />

            <!-- Photon -->
            <path class="photon" d="M 120,150 Q 135,130 150,150 T 180,150" />
            
            <circle class="particle p1" r="5" cx="0" cy="0" />
            <circle class="particle p2" r="5" cx="0" cy="0" />
            <circle class="photon-packet" r="4" cx="0" cy="0" />
        </svg>
        <canvas class="fractal" id="canvas"></canvas>
    </div>

    <script>
        const diag = document.getElementById('diagram');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 300; canvas.height = 300;
        
        let clicked = false;
        
        function drawFractal() {
            ctx.fillStyle = 'rgba(17, 17, 17, 0.2)';
            ctx.fillRect(0, 0, 300, 300);
            
            for(let i=0; i<50; i++) {
                ctx.beginPath();
                ctx.strokeStyle = Math.random() > 0.5 ? '#fff' : '#1E90FF';
                ctx.lineWidth = Math.random() * 2;
                let x = Math.random() * 300;
                let y = Math.random() * 300;
                ctx.moveTo(x, y);
                // random squiggles and loops
                for(let j=0; j<5; j++) {
                    ctx.bezierCurveTo(
                        x + (Math.random()-0.5)*50, y + (Math.random()-0.5)*50,
                        x + (Math.random()-0.5)*100, y + (Math.random()-0.5)*100,
                        x + (Math.random()-0.5)*150, y + (Math.random()-0.5)*150
                    );
                }
                ctx.stroke();
            }
            if(clicked) requestAnimationFrame(drawFractal);
        }

        diag.addEventListener('click', () => {
            if(clicked) return;
            clicked = true;
            diag.classList.add('clicked');
            drawFractal();
        });
    </script>
</body>
</html>
