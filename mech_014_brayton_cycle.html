<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brayton Cycle</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f9;
        overflow: hidden;
        cursor: pointer;
    }
    #container {
        position: relative;
        width: 60px;
        height: 40px;
    }
    canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let clicked = false;
    let shrapnel = [];
    
    const cx = width / 2;
    const cy = height / 2;
    const color = '#E74C3C';
    let fanAngle = 0;
    let fanSpeed = 0.1;
    let offscreenX = 0;

    class Debris {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            let a = Math.random() * Math.PI * 2;
            let s = Math.random() * 20 + 10;
            this.vx = Math.cos(a) * s;
            this.vy = Math.sin(a) * s;
            this.size = Math.random() * 3 + 1;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw(ctx) {
            ctx.fillStyle = `rgba(50, 50, 50, ${this.life})`;
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        fanSpeed = 0.8;
        setTimeout(() => {
            // Explode turbine
            for(let i=0; i<50; i++) {
                shrapnel.push(new Debris(cx + 20, cy));
            }
        }, 300);
    });

    function drawLoop(ctx, ox) {
        ctx.beginPath();
        // Compressor (left)
        ctx.moveTo(cx - 20 + ox, cy - 10);
        ctx.lineTo(cx - 10 + ox, cy - 10);
        ctx.lineTo(cx - 15 + ox, cy + 10);
        ctx.lineTo(cx - 25 + ox, cy + 10);
        ctx.closePath();
        ctx.strokeStyle = '#3498DB';
        ctx.stroke();

        // Combustor (top)
        ctx.beginPath();
        ctx.moveTo(cx - 10 + ox, cy - 10);
        ctx.lineTo(cx + 10 + ox, cy - 10);
        ctx.strokeStyle = color; // red
        ctx.stroke();

        // Turbine (right)
        ctx.beginPath();
        ctx.moveTo(cx + 10 + ox, cy - 10);
        ctx.lineTo(cx + 20 + ox, cy - 10);
        ctx.lineTo(cx + 25 + ox, cy + 10);
        ctx.lineTo(cx + 15 + ox, cy + 10);
        ctx.closePath();
        ctx.strokeStyle = color;
        ctx.stroke();

        // HX Loop (bottom)
        ctx.beginPath();
        ctx.moveTo(cx + 15 + ox, cy + 10);
        ctx.lineTo(cx - 15 + ox, cy + 10);
        ctx.strokeStyle = '#999';
        ctx.stroke();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        if (!clicked || shrapnel.length === 0) {
            fanAngle += fanSpeed;
            drawLoop(ctx, offscreenX);
            
            // Draw turbine fan
            ctx.save();
            ctx.translate(cx + 17.5 + offscreenX, cy);
            ctx.rotate(fanAngle);
            ctx.beginPath();
            ctx.moveTo(-5, 0); ctx.lineTo(5, 0);
            ctx.moveTo(0, -5); ctx.lineTo(0, 5);
            ctx.strokeStyle = '#333';
            ctx.stroke();
            ctx.restore();
            
            if(clicked) {
                // before explosion, speed up
            } else {
                // dots flowing
                ctx.fillStyle = '#3498DB';
                ctx.beginPath(); ctx.arc(cx - 15, cy + Math.sin(fanAngle)*5, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(cx + 15, cy + Math.cos(fanAngle)*5, 1.5, 0, Math.PI*2); ctx.fill();
            }
        } else {
            offscreenX -= 15; // rocket rest off page
            if (offscreenX > -width) {
                drawLoop(ctx, offscreenX);
            }

            shrapnel.forEach((s, i) => {
                s.update();
                s.draw(ctx);
                if(s.life <= 0) shrapnel.splice(i, 1);
            });
        }

        requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    animate();
</script>
</body>
</html>
