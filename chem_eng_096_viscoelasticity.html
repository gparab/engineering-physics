<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viscoelasticity (Maxwell Model)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 20px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spring {
            width: 10px;
            height: 20px;
            border-left: 2px solid #FF1493;
            border-right: 2px solid transparent;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                #FF1493 2px,
                #FF1493 4px
            );
            transform-origin: top center;
        }

        .dashpot {
            position: relative;
            width: 12px;
            height: 16px;
            border: 2px solid #FF1493;
            border-top: none;
            margin-top: 2px;
            overflow: hidden;
        }

        .piston {
            position: absolute;
            top: 4px;
            left: 2px;
            width: 8px;
            height: 4px;
            background-color: #FF1493;
        }

        .rod {
            position: absolute;
            top: 0;
            left: 5px;
            width: 2px;
            height: 4px;
            background-color: #FF1493;
        }

        .dashpot-fluid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 12px;
            height: 8px;
            background-color: rgba(255, 20, 147, 0.3);
        }

        .leaked-fluid {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #FF1493;
            opacity: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <div class="spring" id="spring"></div>
        <div class="dashpot" id="dashpot">
            <div class="rod" id="rod"></div>
            <div class="piston" id="piston"></div>
            <div class="dashpot-fluid" id="fluid"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('model-container');
        const spring = document.getElementById('spring');
        const piston = document.getElementById('piston');
        const rod = document.getElementById('rod');
        const fluid = document.getElementById('fluid');

        // Idle Animation
        const idleTL = gsap.timeline({ repeat: -1, yoyo: true });
        idleTL.to(spring, { scaleY: 1.3, duration: 1, ease: "sine.inOut" })
              .to(piston, { y: 2, duration: 1, ease: "sine.inOut" }, "<")
              .to(rod, { scaleY: 1.5, duration: 1, ease: "sine.inOut" }, "<")
              .to(container, { y: 5, duration: 1, ease: "sine.inOut" }, "<");

        // Click Animation
        container.addEventListener('click', () => {
            idleTL.kill();
            
            const clickTL = gsap.timeline();
            
            // Massive step strain
            clickTL.to(spring, { scaleY: 2.5, duration: 0.1, ease: "power2.out" })
                   .to(piston, { y: 8, duration: 0.1, ease: "power2.out" }, "<")
                   .to(rod, { scaleY: 3, duration: 0.1, ease: "power2.out" }, "<")
                   
                   // Spring snaps
                   .to(spring, { scaleY: 0, opacity: 0, duration: 0.2, ease: "power4.in" }, "+=0.1")
                   
                   // Dashpot leaks
                   .to(fluid, { y: 20, opacity: 0, duration: 0.5, ease: "power1.in" }, "<")
                   
                   // Generate leaked particles
                   .add(() => {
                       const rect = document.getElementById('dashpot').getBoundingClientRect();
                       for(let i=0; i<15; i++) {
                           let drop = document.createElement('div');
                           drop.className = 'leaked-fluid';
                           drop.style.left = (rect.left + rect.width / 2) + 'px';
                           drop.style.top = (rect.bottom) + 'px';
                           document.body.appendChild(drop);
                           
                           gsap.to(drop, {
                               y: window.innerHeight,
                               x: (Math.random() - 0.5) * 200,
                               opacity: 1,
                               duration: 0.5 + Math.random() * 0.5,
                               ease: "power2.in",
                               onComplete: () => {
                                   gsap.to(drop, { opacity: 0, scale: 3, duration: 0.3 });
                               }
                           });
                       }
                   }, "<")
                   .to(document.getElementById('dashpot'), { opacity: 0, y: 50, rotation: 45, duration: 0.5 }, "<0.2")
                   .to(container, { display: 'none', duration: 0 });
        });
    </script>
</body>
</html>
