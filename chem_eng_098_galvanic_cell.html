<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galvanic Cell</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 30px;
            height: 25px;
            cursor: pointer;
        }

        .beaker {
            position: absolute;
            bottom: 0;
            width: 10px;
            height: 12px;
            border: 1px solid #555;
            border-top: none;
            border-radius: 0 0 2px 2px;
        }
        .beaker.left { left: 2px; }
        .beaker.right { right: 2px; }

        .electrode {
            position: absolute;
            bottom: 2px;
            width: 4px;
            height: 12px;
            background-color: #DAA520;
        }
        .anode { left: 5px; transform-origin: bottom center; }
        .cathode { right: 5px; }

        .wire {
            position: absolute;
            top: 7px;
            left: 7px;
            width: 16px;
            height: 8px;
            border: 1px solid #888;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
        }

        .salt-bridge {
            position: absolute;
            bottom: 8px;
            left: 9px;
            width: 12px;
            height: 8px;
            border: 2px solid rgba(218, 165, 32, 0.5);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 80% 100%, 80% 40%, 20% 40%, 20% 100%, 0 100%);
        }

        .electron {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #fff;
            border-radius: 50%;
            top: 6px;
            left: 7px;
            opacity: 0;
        }

        .ion {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #DAA520;
            border-radius: 50%;
            bottom: 12px;
            left: 14px;
            opacity: 0;
        }

        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            box-shadow: 0 0 10px 5px #fff, 0 0 20px 10px #DAA520;
            border-radius: 50%;
            top: 6px;
            left: 7px;
            opacity: 0;
            transform: translate(-50%, -50%);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
</head>
<body>
    <div class="container" id="model-container">
        <div class="beaker left"></div>
        <div class="beaker right"></div>
        <div class="electrode anode" id="anode"></div>
        <div class="electrode cathode"></div>
        <div class="wire" id="wire"></div>
        <div class="salt-bridge"></div>
        
        <div class="electron" id="e1"></div>
        <div class="electron" id="e2"></div>
        <div class="ion" id="i1"></div>
        
        <div class="spark" id="spark"></div>
    </div>

    <script>
        gsap.registerPlugin(MotionPathPlugin);

        const container = document.getElementById('model-container');
        const anode = document.getElementById('anode');
        const wire = document.getElementById('wire');
        const spark = document.getElementById('spark');

        // Idle Animation
        const eTL = gsap.timeline({ repeat: -1 });
        eTL.to('#e1', {
            motionPath: {
                path: [{x: 0, y: 0}, {x: 8, y: -4}, {x: 16, y: 0}],
                curviness: 1.5
            },
            opacity: 1,
            duration: 1,
            ease: "none"
        }).to('#e1', { opacity: 0, duration: 0.1 });

        const eTL2 = gsap.timeline({ repeat: -1, delay: 0.5 });
        eTL2.to('#e2', {
            motionPath: {
                path: [{x: 0, y: 0}, {x: 8, y: -4}, {x: 16, y: 0}],
                curviness: 1.5
            },
            opacity: 1,
            duration: 1,
            ease: "none"
        }).to('#e2', { opacity: 0, duration: 0.1 });

        const iTL = gsap.timeline({ repeat: -1 });
        iTL.to('#i1', { x: -4, y: -2, opacity: 1, duration: 0.5, ease: "sine.inOut" })
           .to('#i1', { x: -8, y: 0, opacity: 0, duration: 0.5, ease: "sine.inOut" });

        // Click Animation
        container.addEventListener('click', () => {
            eTL.kill();
            eTL2.kill();
            iTL.kill();
            gsap.set('.electron, .ion', { opacity: 0 });

            const clickTL = gsap.timeline();
            
            // Anode dissolves
            clickTL.to(anode, {
                scaleY: 0,
                opacity: 0,
                duration: 0.5,
                ease: "power2.in"
            })
            // Spark at wire break
            .to(spark, {
                opacity: 1,
                scale: 5,
                duration: 0.1
            }, "-=0.1")
            .to(wire, {
                borderTopColor: "transparent",
                borderLeftColor: "transparent",
                duration: 0.1
            }, "<")
            .to(spark, {
                scale: 0,
                opacity: 0,
                duration: 0.3,
                ease: "power2.out"
            })
            .to(container, {
                opacity: 0,
                y: 10,
                duration: 0.5
            });
        });
    </script>
</body>
</html>
