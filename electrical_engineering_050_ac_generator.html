<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50. AC Generator</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  .container {
    position: relative;
    width: 250px;
    height: 150px;
    cursor: pointer;
    perspective: 500px;
  }
  .pole {
    position: absolute;
    width: 40px;
    height: 100px;
    top: 25px;
    background: #444;
    border-radius: 5px;
    box-shadow: inset 0 0 10px #000;
  }
  .pole.north {
    left: 20px;
    border-right: 5px solid #c0392b; /* North red */
  }
  .pole.south {
    right: 20px;
    border-left: 5px solid #2980b9; /* South blue */
  }
  .pole-label {
    color: #aaa;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    line-height: 100px;
  }
  .rotor-container {
    position: absolute;
    width: 100px;
    height: 100px;
    left: 75px;
    top: 25px;
    transform-style: preserve-3d;
  }
  .wire-loop {
    position: absolute;
    width: 80px;
    height: 60px;
    left: 10px;
    top: 20px;
    border: 4px solid #D35400;
    border-radius: 4px;
    box-sizing: border-box;
    transform-style: preserve-3d;
  }
  .shaft {
    position: absolute;
    width: 120px;
    height: 4px;
    background: #777;
    top: 48px;
    left: -10px;
  }
  .sine-wave {
    position: absolute;
    width: 250px;
    height: 50px;
    top: 130px;
    left: 0;
    pointer-events: none;
    opacity: 0.7;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .disk-of-light {
    position: absolute;
    width: 100px;
    height: 100px;
    left: 75px;
    top: 25px;
    background: radial-gradient(circle, rgba(211,84,0,1) 0%, rgba(211,84,0,0) 70%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div class="container" id="generator">
  <div class="pole north"><div class="pole-label">N</div></div>
  <div class="pole south"><div class="pole-label">S</div></div>
  
  <div class="rotor-container" id="rotor">
    <div class="shaft"></div>
    <div class="wire-loop"></div>
  </div>
  
  <div class="disk-of-light" id="disk"></div>
  
  <div class="sine-wave">
    <svg viewBox="0 0 250 50">
      <path id="wavePath" d="M0 25 Q 31 25, 62 25 T 125 25 T 187 25 T 250 25" fill="none" stroke="#D35400" stroke-width="2" stroke-linecap="round" />
    </svg>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  // Idle Animation
  let rotationObj = { angle: 0 };
  
  const wavePath = document.getElementById('wavePath');
  
  function updateWave() {
    const a = rotationObj.angle * Math.PI / 180;
    const amp = 20 * Math.sin(a); // Amplitude varies with rotation
    
    // Draw a moving sine wave
    const offset = (rotationObj.angle % 360) / 360 * 125;
    
    // Simple representation of the emitted wave
    const path = `M0 25 Q 31 ${25 - amp}, 62 25 T 125 25 T 187 25 T 250 25`;
    wavePath.setAttribute('d', path);
    wavePath.setAttribute('stroke-width', 2 + Math.abs(amp)/10);
    wavePath.style.opacity = 0.5 + Math.abs(amp)/40;
  }

  const idleTween = gsap.to(rotationObj, {
    angle: 360,
    duration: 2,
    repeat: -1,
    ease: "none",
    onUpdate: () => {
      gsap.set("#rotor", { rotationX: rotationObj.angle });
      updateWave();
    }
  });

  // Click Animation
  const container = document.getElementById('generator');
  let clicked = false;

  container.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    
    idleTween.kill();
    
    const clickTl = gsap.timeline();
    
    // Spin up to infinite frequency
    clickTl.to(rotationObj, {
      angle: rotationObj.angle + 360 * 10,
      duration: 1.5,
      ease: "power3.in",
      onUpdate: () => {
        gsap.set("#rotor", { rotationX: rotationObj.angle });
        // Make the wave go crazy
        const amp = 30 * Math.sin(rotationObj.angle * Math.PI / 180 * 5);
        wavePath.setAttribute('d', `M0 25 Q 20 ${25 - amp}, 40 25 T 80 25 T 120 25 T 160 25 T 200 25 T 240 25 T 280 25`);
        wavePath.setAttribute('stroke', '#fff');
      }
    })
    .to("#rotor", {
      opacity: 0,
      duration: 0.2
    }, "-=0.3")
    .to("#disk", {
      opacity: 1,
      scale: 3,
      duration: 0.5
    }, "-=0.5")
    .to(".pole, .sine-wave", {
      opacity: 0,
      duration: 0.3
    }, "-=0.2")
    .to("#disk", {
      scale: 0,
      opacity: 0,
      duration: 0.4,
      ease: "back.in(2)"
    });
  });
</script>
</body>
</html>
