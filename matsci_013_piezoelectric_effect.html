<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background-color: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
  .container { position: relative; width: 50px; height: 50px; cursor: pointer; border: 2px solid #555; transform-origin: center; display: flex; align-items: center; justify-content: center;}
  .cation { width: 12px; height: 12px; border-radius: 50%; background: #16a085; position: absolute; transform: translateY(-5px); box-shadow: 0 0 8px #16a085;}
  .spark { position: absolute; width: 100%; height: 2px; background: cyan; box-shadow: 0 0 5px cyan; opacity: 0; }
  .spark-top { top: -2px; }
  .spark-bottom { bottom: -2px; }
  .shockwave { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 20px; height: 20px; border-radius: 50%; border: 4px solid #16a085; opacity: 0; pointer-events: none;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="container" id="container">
    <div class="cation" id="cation"></div>
    <div class="spark spark-top" id="st"></div>
    <div class="spark spark-bottom" id="sb"></div>
</div>
<script>
  let tl = gsap.timeline({repeat: -1, yoyo: true});
  tl.to('#container', {height: 40, duration: 1, ease: "sine.inOut"})
    .to('#cation', {y: 0, duration: 1, ease: "sine.inOut"}, 0)
    .to(['#st', '#sb'], {opacity: 1, duration: 0.1, yoyo: true, repeat: 3}, 0.8);
  
  let clicked = false;
  document.getElementById('container').addEventListener('click', () => {
      if(clicked) return;
      clicked = true;
      tl.kill();
      
      let resTl = gsap.timeline();
      resTl.to('#container', {scaleY: 1.5, scaleX: 0.8, y: -10, duration: 0.05, yoyo: true, repeat: 20, ease: "none", 
          onUpdate: function() {
              gsap.set('#cation', {y: "random(-15, 15)"});
          }
      })
      .to('#container', {opacity: 0, duration: 0.1})
      .call(() => {
          for(let i=0; i<3; i++) {
              let wave = document.createElement('div');
              wave.className = 'shockwave';
              document.body.appendChild(wave);
              gsap.to(wave, {scale: 100, opacity: 1, duration: 0.5, delay: i*0.2, ease: "power2.out"});
              gsap.to(wave, {opacity: 0, duration: 0.5, delay: i*0.2 + 0.3});
          }
      });
  });
</script>
</body>
</html>
